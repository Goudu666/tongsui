- id: t_ball_game
  kind: solo
  stage: teen
  where: school
  when: [930, 1200]
  weight: 2
  requires: { minAge: 15 }
  title: 投进了
  text: 年级篮球赛决赛，最后三秒，你投进了。全班冲进场里，把你压在了人堆最底下，球还抱在怀里。
  options:
    - id: find
      text: 爬出来找对门在哪
      tags: [gentle]
