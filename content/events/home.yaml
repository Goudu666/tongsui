  weight: 3
  requires: { minAge: 5, maxAge: 8, flags: [hm_milk] }
  title: 门口的木箱
  text: 天不亮，送奶的往门口木箱里放一瓶奶，顺手带走昨天的空瓶。你妈说，喝完再去上学。
