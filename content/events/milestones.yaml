      requires: { notFlags: [fam_rich] }
      lock: 家里舍不得
      tags: [responsible, adventure]
      effects: { bond: { distance: 2 }, flags: [army] }
    - id: work
      text: 不念了，找活干
      tags: [responsible]
      effects: { flags: [work_early] }
  resonance:
    away:
      text: 晚了一年的两张火车票。站台上没人送，你们自己对了对表。
      memory: 晚一年的票
      bond: { sync: 3, close: 2 }
    local:
      text: 复读班同一张桌子出来的，又进了同一座城里的两所学校。
      memory: 同一张桌子
      bond: { sync: 2, close: 2 }
    work:
      text: 卷子卖给了收破烂的，一人换了两根冰棍。第二天一块儿去找活。
      memory: 两根冰棍
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 复读的那一年两个人天天在一块儿。这回一个走了，一个留下。
    bond: { close: -3 }

- id: m_job
  kind: milestone
  stage: young
  age: 22
  requires: { notFlags: [left_city] }
  title: 找个正经事由
  text: 该定下来了。干哪一行，往后几十年每天几点出门、几点回来，就都跟着定了。
  options:
    - id: desk
      text: 过桥去坐办公室
      score: { mind: 1 }
      # 少年以后每个日子算得更重（rules.yaml growth.turnWeight / room 按阶段，玩法总把关 11-11）：8.2 时专心念书的人开局就过，抬到 8.5
      min: 8.5
      tags: [competitive]
      effects: { flags: [job_desk] }
    # 董家（exp_pull，爸妈心里那条路就是进单位，docs/MEANS.md 第九节）：同一条路，钱家里出，自己不掏。别的人家、别的殷实人家看不见这一条。
    # 排在 pull 前头：两条线一样高，机器人（tools/paths.mjs 的 climb）按写的顺序取头一条
    - id: pull_home
      text: 进爸妈安排好的单位
      score: { mind: 0.6, charm: 0.4 }
      min: 8.9
      requires: { flags: [fam_rich, exp_pull], notFlags: [fam_cut] }
      lock: 家里没有这层关系
      hide: true
      joins: pull
      tags: [competitive]
      effects: { self: { mood: -4 }, flags: [job_pull] }
    - id: pull
      text: 托家里的关系进单位
      # 自己一份营生（tracks.yaml 的 job_pull），不算考进去的办公室：一天少几块，往后三道要钱的关不跟着坐办公室走。
      # 魅力只占四成：占六成的时候嘴甜的殷实孩子 85% 进得去，同样嘴甜的小康 19%，成了「魅力换办公室」（玩法评审）。
      # 时间切段（#23）以后人长得快一些，7.8 时嘴甜殷实 57% 对小康 30%，抬到 8.0（means.test 钉着差不超过 15 个点）
      # 11-11 成长曲线放宽以后嘴甜殷实 65% 对小康 39%，跟着坐办公室抬到 8.9（嘴甜的人魅力长得快，托关系那四成魅力替他补了心智）
      score: { mind: 0.6, charm: 0.4 }
      min: 8.9
      cost: 15
      requires: { flags: [fam_rich], notFlags: [fam_cut] }
      lock: 家里没有这层关系
      tags: [competitive]
      effects: { self: { mood: -3 }, flags: [job_pull] }
    - id: teach
      text: 回小学教书
      score: { mind: 0.6, charm: 0.4 }
      min: 6.8
      tags: [patient]
      effects: { flags: [job_teach] }
    - id: trade
      text: 在街口支个摊，做买卖
      score: { charm: 0.7, luck: 0.3 }
      min: 6.9
      tags: [adventure]
      effects: { flags: [job_trade] }
    - id: craft
      text: 学一门手艺
      score: { body: 0.5, mind: 0.5 }
      min: 6.4
      tags: [patient, responsible]
      effects: { flags: [job_craft] }
    - id: labor
      text: 去码头卖力气
      score: { body: 1 }
      min: 6.0
      tags: [responsible]
      effects: { flags: [job_labor] }
    - id: succeed
      text: 接爸妈的班，进厂
      requires: { flags: [fam_factory] }
      lock: 家里没人在厂里
      tags: [responsible]
      effects: { flags: [job_succeed] }
    - id: placed
      text: 退伍安置，进厂
      requires: { flags: [army] }
      lock: 没当过兵
      joins: succeed
      tags: [responsible]
      effects: { flags: [job_succeed, army_placed] }
    - id: odd
      text: 先打零工
      tags: [solitude]
      effects: { flags: [job_odd] }
  resonance:
    desk:
      text: 同一趟早班车，一个在第三站下，一个在第五站下。
      memory: 同一趟早班车
      bond: { sync: 2, close: 2 }
    teach:
      text: 当年你们坐过的那间教室，现在一人教一个班。
      memory: 一人一个班
      bond: { sync: 3, close: 2 }
    trade:
      text: 两个摊子挨着，一把遮阳伞底下，谁先卖完谁帮另一个吆喝。
      memory: 一把遮阳伞
      bond: { sync: 3, close: 2 }
    craft:
      text: 一个铺子，两条板凳，师傅说你们俩一个手稳一个手快。
      memory: 两条板凳
      bond: { sync: 3, close: 2 }
    labor:
      text: 一根杠子两头抬，走了一天，步子是一样的。
      memory: 一根杠子
      bond: { sync: 3, close: 2 }
    pull:
      text: 两家托的是同一个人。报到那天在传达室碰上了，谁也没问对方是怎么进来的。
      memory: 传达室
      bond: { sync: 2, close: 1 }
    succeed:
      text: 同一个厂门，同一种蓝工装。下了班在澡堂门口等，谁先出来谁去买汽水。
      memory: 两身蓝工装
      bond: { sync: 3, close: 2 }
    odd:
      text: 今天有活，明天没活。没活的那天，你们在河边坐一下午。
      memory: 没活的下午
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 一个出门早，一个回来晚。对门的灯，各亮各的钟点。
    bond: { close: -3 }

# 二十八岁：成家（docs/FAMILY.md 第一节）。看的是两个人的亲近，不是本事。早先在楼顶办过喜事、和别人成了家的不过这道关。
# 两个人都选跟对门过才成一家，都选老朋友才是知己；一个想跟对门过、一个没有，就是错过（p_missed）。
# 错位是整道关一份（引擎不分是哪两条路错开的），所以错过不写在错位上：选了跟对门过的人自己记一个 wed_ask，
#   没成一家的，三十出头那件「烟盒纸」（marriage.yaml 的 mw_unsaid）给他打上 p_missed。
# 线：28 岁亲近（tools/paths.mjs 每种约 48 人）：搭伴念书中位 61、p25 54；一个人念书中位 14、p75 17；不上心中位 20；影子中位 22。
#   跟对门过 50 只有搭伴的走得到；老朋友 15 一个人用功的约一半。
- id: m_wed
  kind: milestone
  stage: young
  age: 28
  requires: { notFlags: [p_married, married_other] }
  score: { close: 1 }
  title: 成家
  text: 二十八了。两家的饭桌上一年问一回，今年问得最勤。你妈往你碗里夹了块鱼，没往下问。
  options:
    - id: us
      text: 跟对门过
      min: 50
      requires: { notFlags: [p_estranged] }
      lock: 吵翻过那一回
      tags: [responsible]
      effects: { self: { mood: 8 }, flags: [wed_ask] }
    - id: other
      text: 和别人成家
      tags: [responsible]
      effects: { self: { mood: 5 }, flags: [married_other] }
    - id: friend
      text: 做一辈子的老朋友
      min: 15
      tags: [gentle]
      effects: { self: { mood: 5 } }
    - id: alone
      text: 一个人过
      tags: [solitude]
      effects: { self: { mood: 3 }, flags: [single_life] }
  resonance:
    us:
      text: 一个说「要不就咱俩」，另一个说「我也这么想」。两家的妈在门口听着，谁也没出声。
      memory: 就咱俩
      bond: { sync: 3, close: 2 }
      flags: [p_lovers, p_married]
    other:
      text: 两个人是同一年办的事。喜糖互相送了一包，一样的牌子，谁也没拆。
      memory: 两包喜糖
      bond: { sync: 2, close: 1 }
    friend:
      text: 话说开了，一个人笑，另一个也笑。下楼买了两瓶汽水，在楼道里喝完的。
      memory: 楼道里的汽水
      bond: { sync: 3, close: 1 }
      flags: [p_confidant]
    alone:
      text: 两个人都说一个人挺好。两家的妈对着叹气，你俩在屋里各吃各的，吃得都挺香。
      memory: 各吃各的
      bond: { sync: 2, close: 1 }
  dissonance:
    text: 一个想了很久要怎么开口，另一个先把自己的打算说了。那句话就没再说出来。
    # 共鸣只给一点亲近：legacy.test 钉着搭伴的连心七十岁并一家不过六成（给 4 的时候 61%）
    bond: { close: -2 }

- id: m_settle
  kind: milestone
  stage: middle
  age: 30
  score: { money: 1 }
  title: 安家
  text: 三十了。这些年攒下的钱都在存折上，够不够给自己安一个地方？
  options:
    - id: buy
      text: 买下一套自己的房
      # 成年后歇班那年工钱照发以后，三十岁的积蓄整体多了四成，线跟着从 150 抬到 200（tools/paths.mjs 校准）
      # 三扇门（二）（docs/MEANS.md 第九节）：殷实人家成年后工钱多两成、小康人家有爸妈攒的那笔，200 时一个人念书的小康 88% 有房，
      # 抬到 230（tools/origin.mjs 校准：清贫 / 小康 / 殷实三档拉开）
      min: 230
      cost: 230
      tags: [responsible]
      effects: { self: { mood: 15 }, flags: [home_own] }
    - id: help
      text: 爸妈出首付，买了房
      # 爸妈出四五十块。线再低，三十岁买不买得起房就几乎只看投胎了（tools/paths.mjs：殷实不上心的人 130 时九成有房）
      # 家里不管了的（fam_cut）没有这一条，锁上写「家里已经不管你了」（rules.yaml 的 locks）
      min: 190
      cost: 190
      requires: { flags: [fam_rich], notFlags: [fam_cut] }
      lock: 爸妈帮不上
      joins: buy
      tags: [responsible]
      effects: { self: { mood: 10 }, flags: [home_own, home_help] }
    - id: unit
      text: 等到了厂里分的房
      min: 40
      cost: 40
      requires: { flags: [job_succeed, era_fenfang] }   # 只在分房那几年有（content/eras.yaml，房改以后摘掉）
      lock: 厂里不分房了
      joins: buy
      tags: [patient]
      effects: { self: { mood: 12 }, flags: [home_own, home_unit] }
    # 小康人家（fam_nest，爸妈攒的那一笔，一辈子动一回）：和殷实人家的 help 一样的线，用了就摘掉 fam_nest。
    # 十五、十八岁用过了（念书那头）、二十几岁拿去开了铺子的，这里就没有了。别的人家看不见这一条
    - id: nest
      text: 爸妈拿出那笔钱，出首付
      min: 215
      cost: 215
      requires: { flags: [fam_nest] }
      lock: 家里没攒下这笔钱
      hide: true
      joins: buy
      tags: [responsible]
      effects: { self: { mood: 10 }, flags: [home_own, home_nest], drop: [fam_nest] }
    # 房价回落以后城边上盖了保障房（eras.yaml 的 era_huiluo）：在厂里上班的人顶上原来分房那条路，数值照抄 unit
    - id: quota
      text: 排上了一套保障房
      min: 40
      cost: 40
      requires: { flags: [job_succeed, era_huiluo] }
      lock: 没排上保障房
      joins: buy
      tags: [patient]
      effects: { self: { mood: 10 }, flags: [home_own, home_quota] }
    # 清贫人家的安家是另一场冲刺（docs/MEANS.md 第九节）：工钱三成寄回家，三十岁买房几乎够不着。
    # 翻修：还住老屋，算和「还住老屋」同一条路（还是对门）；也拿 home_old，拆迁那几年照样补钱
    - id: fixed
      text: 把老屋翻修一下
      # 原来 70：清贫人家一个人念书的积蓄中位 136，人人翻得起，这道关没得冲。130 落在中位附近（tools/origin.mjs）
      min: 130
      cost: 110
      requires: { flags: [fam_poor] }
      lock: 不是你家的老屋
      hide: true
      joins: stay
      tags: [patient]
      effects: { self: { mood: 8 }, flags: [home_fixed, home_old] }
    # 合住：看亲近，谁都能走。两个人都选是「门对着门」。给的亲近和别的共鸣一样少（legacy.test 夹着七十岁并一家）
    - id: share
      text: 两家合住一个院
      score: { close: 1 }
      min: 25
      tags: [gentle]
      effects: { self: { mood: 6 }, flags: [home_share] }
    - id: rent
      text: 在附近租一间
      min: 100
      cost: 100
      tags: [adventure]
      effects: { self: { mood: 6 }, flags: [home_rent] }
    - id: stay
      text: 还住老屋
      tags: [gentle]
      effects: { flags: [home_old] }
  resonance:
    buy:
      text: 钥匙是同一天拿的。新楼没有楼道灯，你们各自在门口装了一盏。
      memory: 两盏门灯
      bond: { sync: 2, close: 2 }
    rent:
      text: 搬家那天互相搭了把手。东西都不多，一趟就完了。
      memory: 一趟就搬完
      bond: { sync: 2, close: 2 }
    stay:
      text: 还是三楼，还是对门。暖气片还是那么烫手。
      memory: 还是对门
      bond: { sync: 2, close: 2 }
    share:
      text: 两家搬进了一个院。院子不大，两扇门对着开，晾衣绳从这家窗台拴到那家窗台。
      memory: 门对着门
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 一个搬走了，一个留下了。留下的那个，有时候还会朝对面那扇门看一眼。
    bond: { close: -3 }

# 四十五岁：前半辈子攒下的三样东西（身体、本事、钱）各能换一样。只够顾好一头。
# 三条路都接着七十岁那一关：身体接「自己下楼」，位子多挣的钱接「请人照应」，花在家里的接「搭伙过」。
- id: m_midlife
  kind: milestone
  stage: middle
  age: 45
  title: 四十五
  text: 体检单上多了两个箭头，单位里空出来一个位子，家里的老人要住院。三件事是同一个礼拜到的，力气只够顾好一头。
  options:
    - id: post
      text: 去争那个位子
      score: { mind: 0.5, charm: 0.5 }
      min: 7.4
      tags: [competitive]
      effects: { self: { mood: 6 }, flags: [mid_post] }
    - id: home
      text: 把钱和工夫都花在家里
      score: { money: 1 }
      # 关口冲刺 11-11：#59 升了级工钱高，四十五岁开局就够 110 的人到了七成五，线抬到 170（花掉的还是 120）
      min: 170
      cost: 120
      tags: [responsible]
      # 清贫人家花在家里了，往后工钱不再寄回去（send_home，docs/MEANS.md 第九节）
      effects: { self: { mood: 10 }, other: { mood: 4 }, bond: { close: 8 }, flags: [mid_home], drop: [send_home] }
    # 清贫人家（send_home）：把爸妈接过来住，往后不用再寄了。和上面那条是同一条路，线低一截，给的亲近少一半。
    # 爸妈已经走了的没有这一条（那时候 hardship_money.yaml 的「汇款单」已经摘了 send_home）
    - id: take
      text: 把爸妈接过来住
      score: { money: 1 }
      min: 110
      cost: 70
      requires: { flags: [send_home], notFlags: [parent_gone] }
      lock: 不用往家里寄钱
      hide: true
      joins: home
      tags: [responsible]
      effects: { self: { mood: 8 }, other: { mood: 2 }, bond: { close: 4 }, flags: [mid_home, mid_take], drop: [send_home] }
    - id: fit
      text: 先把身体捡起来
      tags: [patient]
      effects: { self: { body: 2, mood: 4 }, flags: [mid_fit] }
  resonance:
    post:
      text: 两个人都升了一级，都搬进了有窗户的那间屋。晚上回来得更晚了，可是楼道里的灯，后回来的那个总看见还亮着。
      memory: 留着的楼道灯
      bond: { sync: 2, close: 1 }
    home:
      text: 医院的走廊里，你们一人守上半夜，一人守下半夜。交班的时候谁也不说话，把暖壶递过去。
      memory: 递过去的暖壶
      bond: { sync: 3, close: 3 }
    fit:
      text: 早上六点，河边多了两个跑不动的人。跑一段，走一段，一个月以后，能一口气到桥头了。
      memory: 一口气到桥头
      bond: { sync: 3, close: 3 }
  dissonance:
    text: 一个天天加班，一个天天往医院跑，一个天不亮就去河边。三样里你们各顾了各的，碰面只剩下点点头。
    bond: { close: -3 }

- id: m_retire
  kind: milestone
  stage: old
  age: 60
  title: 退休
  text: 最后一天的活干完了。从明天起，一整天又都是自己的了。也有人来问：手上的本事，还愿不愿意往下传？
  options:
    - id: mentor
      text: 带个徒弟，再干几年
      score: { mind: 0.5, charm: 0.5 }
      min: 7.0
      tags: [responsible]
      effects: { self: { mood: 6 }, flags: [retired, retire_mentor] }
    - id: rest
      text: 把闹钟收起来
