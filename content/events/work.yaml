# 职场小事：同事、领导、师傅、徒弟（cr_ 前缀）。都挂在升迁那几道关上（content/events/career.yaml）：
#   - 23~25 岁：26 岁「站住脚」之前，每个行当一件，给本行升一级看的那项属性推一把或绊一下
#   - 31~35 岁（中年只有 33 岁那个日子）：升了一级（rank1）以后、36 岁「挑大梁」之前，各行一件
#   - 37~44 岁（39、42 两个日子）：升了两级（rank2）以后、45 岁争位子（mid_post，看心智和魅力）之前，少数几行
#   - 通用的几件：领导、年终、背锅、老东家（jumped）、转了行（switched）、家里托人调的（seat_pull）、没升上的（台阶）、新来的年轻人
# 选项要么给下一道关看的属性一点，要么拿心情、精力、亲近换，要么是对门和工作二选一。
# 只读标记，不发标记。下了海、开了铺子、摆了摊、下了岗的人碰不上（notFlags）。
# 写法守文风手册：说事不说情，不评价哪条路好。字数：青年 50、中年 45。

