      lockBy: { fam_cut: 家里已经不管你了 }
      tags: [adventure]
      effects: { bond: { distance: 3 }, flags: [uni_abroad] }
    - id: local
      text: 念本市的大学
      min: 6.8
      tags: [gentle]
      effects: { flags: [uni_near], flagsIf: [{ flags: [fam_poor], notFlags: [aid], add: [loan] }] }
    - id: army
      text: 报名去当兵
      score: { body: 1 }
