# 老物件：一辈子过完，每个人给河畔里留下一样东西。下一世投胎时，每人可以从攒下的老物件里挑一件带上。
# 按顺序匹配，一个人只留第一件对得上的；最后一件没有条件，是兜底。越靠前越难得。
# 两个人不留同一件：先走的先留，后走的那个接着往下找（都只剩兜底那件的时候除外）。
# 所以一个人自己挣来的排在前面，两个人一起做过的排在后面：不然一起养过鸽子的两个人，回回都只留下一只鸽哨。
#
#   from    上一世什么样的人会留下它（写法同 endings.yaml 的 lives.requires，另有 anyStat、minMoney）
#   bonus   带上它的人，先天属性加多少。不占投胎的点数，所以要小：一件最多半点。
#           关口的线是按十分之一点调的，半点已经够让一条够不着的线变成够得着一半
#   money   开局多带的零花钱。和家业（rules.yaml 的 legacy.houseMoney × houseMax）加起来最多十块：
#           买房的线是按两百块调的，而且很陡，带来的钱只能是个零头
#   close   开局两人的亲近多多少
#   flags   带上它的人出生就有的标记，事件可以用 requires.flags 读到
#   hint    老物件会变（from 里写了 carried 的那几件）：住户本里写在上一件底下的那一句，说怎么才变得过来
#
# 写法：一句话写物件本身，不写它「代表」什么。
#
# 老物件会变（docs/LEGACY.md 第十三节）：from.carried 是「带着那一件出生的」。带着它、这一世又做了那件事，
# 留下的就是它的下一种样子。所以放在最前面：带着上一件的人，先看变不变得过来。
# 加成和别的老物件一样大（不越带越强），变到头的那件带出一个藏着的结局（endings.yaml 里 heir_ 开头的条件）。

