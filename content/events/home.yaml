# 家里的东西（content/home.yaml 的物件，docs/MEANS.md 第八、九节的三种难度）。
#
# 同一年，三户人家不在同一个年代：殷实人家早几年有了电视、电话、书柜，清贫人家晚几年，有的一直没有。
# 这里的事读的是「这个人爸妈家里有什么」（hm_<物件>，引擎按家境 × 日历年打，server/src/home.ts）和家境（fam_rich / fam_poor，小康两样都不带）。
# 同一件事，家里有的和家里没有的看到的选项不一样（选项的 requires 只看选的人自己）：有电脑的回家打作业，没有的掏钱去网吧，或者拿时间手抄。
# 殷实人家拿钱换分，清贫人家拿时间换钱，小康人家压岁钱存进存折、到二十岁上还回来一笔。
#
# 每件事挂在它前面那道关上（content/events/milestones.yaml）：
#   9 三年级（体魄 / 心智 / 魅力）← 门槛上看电视、门口的牛奶
#   12 小升初（心智）            ← 三档的压岁钱、金家的书柜、锁进柜子的游戏机
#   15 中考（心智）              ← 月底的饭桌（清贫）、考第几（殷实）、借来的书、一盘磁带
#   18 高考 / 当兵（心智 / 体魄）← 电视换台、考前的电话、打出来的作业（有网吧的那些年）
#   22 找事由（心智魅力，坐办公室头一年垫 21 块）← 小康那本存折、打到小卖部的电话
# 都写成各自碰上的（solo）：两个人的 mirror 看的是两人标记的并集，写不出「一家有、一家没有」，
# 所以「去别人家看电视」「借书」写成家里没有的那一个自己碰上，借给你的是同桌、楼里先有电视的那家。
# 关口那一岁不当起点（不写 where 的事会在关口当天早上冒出来，milestone.test）。
# 钱的量级：积蓄按块，压岁钱一回一到四块，复读机 15、游戏机 12。
# 写法守文风手册：东西就是东西，不当年代符号摆；不写品牌、年份、真实的节目。不哭穷也不炫富。

# ======================== 压岁钱：三户人家三个去处 ========================

# 殷实：钱多，可一半先归了爸妈报的班
- id: ho_hb_rich
  kind: solo
  stage: childhood
  seasons: [winter]
  weight: 3
  requires: { minAge: 5, maxAge: 11, flags: [fam_rich] }
  title: 一摞红纸包
  text: 过年家里来客一拨接一拨，走时都往你兜里塞个红纸包。你妈说：留着，开春拿去报班。
  options:
    - id: class
      text: 交给你妈报班
      tags: [responsible]
      effects: { self: { mind: 0.25, mood: -3 } }
    - id: keep
      text: 自己收进铁盒里
      tags: [patient]
      effects: { self: { mood: 3 }, money: 4 }
    - id: books
      text: 买一摞小人书分对门
      tags: [gentle]
      effects: { self: { mind: 0.1, mood: 4 }, other: { mood: 4 }, bond: { close: 1 } }

# 小康：存进存折，记在你名下。二十岁上（ho_hb_passbook）还回来一笔
- id: ho_hb_mid
  kind: solo
  stage: childhood
  seasons: [winter]
  weight: 3
  requires: { minAge: 5, maxAge: 11, notFlags: [fam_rich, fam_poor] }
  title: 新存折
  text: 过年收了几个红纸包。你妈拿出一本新存折，说要是存上，往后每年都记在你名下。
  options:
    - id: save
      text: 让你妈存上
      tags: [patient]
      effects: { self: { mood: 1 }, flags: [hb_saved] }
    - id: keep
      text: 自己留着花
      tags: [adventure]
      effects: { self: { mood: 3 }, money: 2 }
    - id: buy
      text: 买两挂小鞭分对门
      tags: [gentle]
      effects: { self: { mood: 6 }, other: { mood: 4 }, bond: { close: 1 } }

# 清贫：妈说替你存着。偷偷留下的那一张，到了月底的饭桌（ho_table_poor）还会被想起来
- id: ho_hb_poor
  kind: solo
  stage: childhood
  seasons: [winter]
  weight: 3
  requires: { minAge: 5, maxAge: 11, flags: [fam_poor] }
  title: 替你存着
  text: 过年收了两个红纸包，还没捂热，你妈伸过手来：「妈替你存着。」
  options:
    - id: give
      text: 两个都交给你妈
      tags: [responsible]
      effects: { self: { mood: -2, charm: 0.05 } }
    - id: keep
      text: 偷偷留下一张
      tags: [solitude]
      effects: { self: { mood: 2 }, money: 1, flags: [hb_kept] }
    - id: buy
      text: 拉对门去买糖堆儿
      tags: [gentle]
      effects: { self: { mood: 6 }, other: { mood: 4 }, bond: { close: 1 } }

# 小康那本存折：二十二岁找事由之前还回来（坐办公室头一年要自己垫 21 块）
- id: ho_hb_passbook
  kind: solo
  stage: young
  weight: 20
  requires: { minAge: 20, maxAge: 21, flags: [hb_saved], notFlags: [fam_rich, fam_poor] }
  title: 那本存折
  text: 你妈从柜底翻出那本存折，一行一行全是过年存的。她说：拿着，上班用得着。
  options:
    - id: take
      text: 收下，揣好
      tags: [patient]
      effects: { self: { mood: 3 }, money: 6 }
    - id: half
      text: 留一半给家里
      tags: [responsible]
      effects: { self: { mood: 4 }, money: 3 }
    - id: treat
      text: 请对门吃顿好的
      tags: [gentle]
      effects: { self: { mood: 6 }, other: { mood: 6 }, bond: { close: 1 }, money: 4 }

# ======================== 饭桌 ========================

# 清贫：月底。挣一块是一块，拿的是午饭和放学以后的工夫（15 中考之前）
- id: ho_table_poor
  kind: solo
  stage: teen
  weight: 3
  requires: { minAge: 13, maxAge: 14, flags: [fam_poor] }
  title: 月底
  text: 月底了，饭桌上一碟咸菜一锅粥。你妈说下礼拜发了工钱割二两肉。你爸没吭声，多盛了一碗。
  options:
    - id: lunch
      text: 把午饭钱省下来
      tags: [responsible]
      effects: { self: { hunger: -10, mood: -2 }, money: 1 }
    - id: piece
      text: 晚上帮家里糊纸盒
      tags: [patient]
      effects: { self: { energy: -15, mind: -0.1 }, money: 1 }
    - id: kept
      text: 拿出藏着的压岁钱
      requires: { flags: [hb_kept] }
      cost: 1
      tags: [gentle]
      effects: { self: { mood: 4, charm: 0.05 } }
    - id: study
      text: 吃完回屋写作业
      tags: [competitive]
      effects: { self: { mind: 0.15, mood: -2 } }

# 殷实：饭桌上问成绩。顶一句「名次不要紧」算一回脸色（strain1，有了的记 fam_cut，见 hardship_time.yaml 文件头）
- id: ho_table_rich
  kind: solo
  stage: teen
  weight: 3
  requires: { minAge: 13, maxAge: 14, flags: [fam_rich], notFlags: [fam_cut] }
  title: 考第几
  text: 期中卷子发下来了。饭桌上你爸放下筷子，头一句就问考第几。你妈给你夹了块排骨，等着。
  options:
    - id: more
      text: 说往后礼拜天也去补
      tags: [competitive]
      effects: { self: { mind: 0.3, mood: -5 } }
    - id: fine
      text: 说名次不要紧
      requires: { notFlags: [strain1] }
      tags: [adventure]
      effects: { self: { mood: 3 }, flags: [strain1] }
    - id: fine_cut
      text: 说名次不要紧
      requires: { flags: [strain1] }
      tags: [adventure]
      effects: { self: { mood: 2 }, flags: [fam_cut] }
    - id: eat
      text: 低头啃排骨
      tags: [patient]
      effects: { self: { mood: -2 } }
    - id: door
      text: 吃完去对门写作业
      tags: [gentle]
      effects: { self: { mind: 0.1, mood: 2 }, bond: { close: 1 } }

# ======================== 电视 ========================

# 家里还没有电视的（c65 一楼一台，c75 小康清贫，c85 清贫）：去先有的那家看。九岁三年级之前
- id: ho_tv_door
  kind: solo
  stage: childhood
  weight: 3
  requires: { minAge: 5, maxAge: 8, notFlags: [hm_tv] }
  title: 门槛上
  text: 楼里先有电视的那家，晚上门敞着。屋里坐满了，后来的孩子就站在门槛上看。
  options:
    - id: nightly
      text: 天天晚上去占地方
      tags: [adventure]
      effects: { self: { mood: 6, energy: -8, charm: 0.1 } }
    - id: stool
      text: 搬小板凳叫上对门
      tags: [gentle]
      effects: { self: { mood: 4 }, other: { mood: 4 }, bond: { close: 1 } }
    - id: help
      text: 帮那家扫地端水
      tags: [responsible]
      effects: { self: { charm: 0.2, mood: 2 } }
    - id: radio
      text: 回家听收音机
      requires: { flags: [hm_radio] }
      tags: [solitude]
      effects: { self: { mind: 0.15, mood: 2 } }

# 家里有电视的：十六七岁，晚上看哪个台，往后就往哪边多使一把劲（18 岁当兵看体魄，考大学看心智，22 岁进单位、做买卖看魅力）
- id: ho_tv_channel
  kind: solo
  stage: teen
  weight: 3
  requires: { minAge: 16, maxAge: 17, flags: [hm_tv] }
  title: 换台
  text: 晚上电视换着台：一个台演军营，一个台在答题，一个台在唱歌。你爸说看一个，看完睡觉。
  options:
    - id: army
      text: 看完下楼跑两圈
      tags: [adventure]
      effects: { self: { body: 0.3, mood: 2 } }
    - id: quiz
      text: 跟着答，记下不会的
      tags: [competitive]
      effects: { self: { mind: 0.2 } }
    - id: sing
      text: 跟着学唱
      tags: [gentle]
      effects: { self: { charm: 0.25, mood: 4 } }
    - id: off
      text: 关了电视去找对门
      tags: [solitude]
      effects: { self: { mood: 3 }, bond: { close: 1 } }

# ======================== 书 ========================

# 家里没有书柜的：书是借来的，有期限（15 中考之前）
- id: ho_book_borrow
  kind: solo
  stage: teen
  weight: 3
  requires: { minAge: 13, maxAge: 14, notFlags: [hm_books] }
  title: 借来的书
  text: 同桌家里有一柜子书。他借你一本，用报纸包着皮，说礼拜一还，别折角。
  options:
    - id: night
      text: 熬夜看完
      tags: [competitive]
      effects: { self: { mind: 0.25, energy: -15 } }
    - id: copy
      text: 抄下喜欢的几页
      tags: [patient]
      effects: { self: { mind: 0.3, energy: -20, mood: -2 } }
    - id: share
      text: 先给对门看
      tags: [gentle]
      effects: { self: { mood: 2 }, other: { mind: 0.2 }, bond: { close: 1 } }
    - id: late
      text: 赖着多借两天
      tags: [solitude]
      effects: { self: { mind: 0.35, charm: -0.1 } }

# 金家（fam_oldmoney，清贫）：老城里搬来的，穷了，书一直在（home.yaml 的 books.jin）。清贫人家里唯一不用借书的（12 小升初之前）
- id: ho_jin_shelf
  kind: solo
  stage: childhood
  weight: 3
  requires: { minAge: 7, maxAge: 11, flags: [fam_oldmoney] }
  title: 没挪过的书柜
  text: 家里三代挤一间半，墙边那个书柜一直没挪过地方。你爷爷说，什么都能卖，这个不卖。
  options:
    - id: read
      text: 每天抽一本看
      tags: [patient]
      effects: { self: { mind: 0.3, mood: -1 } }
    - id: door
      text: 叫对门来一块儿翻
      tags: [gentle]
      effects: { self: { mind: 0.15 }, other: { mind: 0.15 }, bond: { close: 1 } }
    - id: sell
      text: 偷拿一本去旧书摊
      tags: [adventure]
      effects: { self: { mood: -4 }, money: 1 }

# ======================== 电话 ========================

# 家里没装电话的：找你的电话打到楼下小卖部（刘家自己就是小卖部，不算）。二十二岁找事由之前
# 回拨要花钱（殷实小康拿钱），骑车找过去要花工夫（清贫拿时间）
- id: ho_phone_shop
  kind: solo
  stage: young
  weight: 4
  requires: { minAge: 20, maxAge: 21, notFlags: [hm_phone, fam_shop, uni_away, uni_abroad, army] }
  title: 楼下喊人
  text: 有个单位的电话打到楼下小卖部。老板娘站在楼下喊了三声，你跑下去，那头已经挂了。
  options:
    - id: call
      text: 照着号码回拨过去
      cost: 1
      tags: [responsible]
      effects: { self: { charm: 0.25, mood: 2 } }
    - id: ride
      text: 骑车找到那个单位去
      tags: [adventure]
      effects: { self: { body: 0.1, charm: 0.2, energy: -20 } }
    - id: watch
      text: 求对门帮着守电话
      tags: [gentle]
      effects: { self: { mood: 2 }, other: { energy: -10 }, bond: { close: 1 } }
    - id: drop
      text: 算了，再等别的
      tags: [solitude]
      effects: { self: { mood: -4 } }

# 家里装了电话的：高考前那几天，电话一到晚上就响。躲到对门那儿去，默契在考场上托手气差的那一半（rules.yaml 的 bond.syncSteady）
- id: ho_phone_eve
  kind: solo
  stage: teen
  weight: 6
  requires: { minAge: 17, maxAge: 17, flags: [hm_phone], notFlags: [dropout, vocational, zhongzhuan] }
  title: 晚上的电话
  text: 离高考没几天了，家里电话一到晚上就响，都是亲戚问准备得怎么样。又响了，你妈看了你一眼。
  options:
    - id: answer
      text: 自己去接，说都好
      tags: [responsible]
      effects: { self: { charm: 0.1, mood: -3 } }
    - id: unplug
      text: 拔了电话线
      tags: [solitude]
      effects: { self: { mind: 0.1, mood: 5 } }
    - id: door
      text: 躲到对门屋里去
      tags: [gentle]
      effects: { self: { mood: 3 }, bond: { sync: 2, close: 1 } }

# ======================== 复读机、游戏机、电脑 ========================

# 家里有复读机的（殷实、小康，或者自己攒钱买的）：学英语用的，也能录歌。借给对门就是把家里有的分出去（15 中考之前）
- id: ho_tape
  kind: solo
  stage: teen
  weight: 3
  requires: { minAge: 13, maxAge: 14, flags: [hm_tape] }
  title: 一盘磁带
  text: 复读机是买来学英语的。一盘磁带听到第三遍，你按下了录音键，把电视里的歌录了半首。
  options:
    - id: study
      text: 换回英语带跟着念
      tags: [competitive]
      effects: { self: { mind: 0.3, mood: -2 } }
    - id: songs
      text: 接着录满一盘
      tags: [adventure]
      effects: { self: { charm: 0.2, mood: 5 } }
    - id: lend
      text: 借给对门一礼拜
      tags: [gentle]
      effects: { self: { mood: 2 }, other: { mind: 0.25 }, bond: { close: 1 } }

# 家里有游戏机的：期末前锁进柜子（12 小升初之前）
- id: ho_console_lock
  kind: solo
  stage: childhood
  weight: 3
  requires: { minAge: 10, maxAge: 11, flags: [hm_console] }
  title: 柜子上的锁
  text: 期末前，游戏机让你爸锁进了柜子，钥匙挂在他裤腰上。卡带还在你枕头底下。
  options:
    - id: wait
      text: 等考完再要回来
      tags: [patient]
      effects: { self: { mind: 0.25, mood: -4 } }
    - id: pick
      text: 拿发卡捅开锁
      tags: [adventure]
      effects: { self: { mood: 8, mind: -0.15, energy: -10 } }
    - id: deal
      text: 跟你爸讲条件
      tags: [competitive]
      effects: { self: { charm: 0.2, mood: -1 } }

# 有网吧的那些年（era_wangba，content/eras.yaml）：家里有电脑的回家打，没有的掏钱去网吧，或者拿时间手抄（18 高考之前）
- id: ho_pc_netcafe
  kind: solo
  stage: teen
  weight: 3
  requires: { minAge: 13, maxAge: 17, flags: [era_wangba] }
  title: 打出来交
  text: 老师说这回的作业要打出来交。家里有电脑的回家就打了，别的人放了学往网吧跑。
  options:
    - id: home
      text: 在家里打出来
      requires: { flags: [hm_pc] }
