      bond: { sync: 3, close: 2 }
    hands:
      text: 你们都撒开了车把，张着胳膊往前冲，像两只要飞的鸽子。差点一块儿栽进河里。
      memory: 张开的胳膊
      bond: { sync: 3, close: 3 }
  dissonance:
    text: 一个人停在了堤岸上，一个人骑远了。回过头喊了一声，声音被河风吹散了。
