  title: 茶壶盖
  text: 二月二，楼下剃头的支起了挑子，推子咔嚓咔嚓响。两家大人一人按着一个：「憋了一正月，今天都得剃！」
  options:
    - id: sit
      text: 闭上眼，认了
      tags: [responsible]
      effects: { self: { clean: 10 } }
    - id: cry
      text: 扯着嗓子哭
      tags: [competitive]
      effects: { self: { mood: -3, energy: -5 } }
    - id: run
      text: 挣开了就跑
      tags: [adventure]
      effects: { self: { body: 1, mood: 5 } }
  resonance:
    sit:
      text: 布单子一掀，两个一模一样的茶壶盖。你们指着对方笑，笑着笑着，都去摸自己的。
      memory: 两个茶壶盖
      bond: { sync: 3, close: 3 }
    cry:
      text: 两个人比着哭，一个比一个调门高。老师傅推子不停：「哭吧。哭完了，正好剃完。」
      memory: 比着哭
      bond: { sync: 3, close: 2 }
    run:
      text: 一个往东，一个往西。最后是在早点铺门口一块儿被逮住的，都剃了一半。
      memory: 剃了一半
      bond: { sync: 3, close: 3 }
  dissonance:
    text: 一个老实坐着，一个跑没了影。坐着的那个顶着茶壶盖找了一下午，就想让对方瞧一眼。
    bond: { close: 0 }

