# ---------- 冬 · 各自 ----------

- id: c_frozen_persimmon
  kind: solo
  stage: childhood
  seasons: [winter]
  weight: 2
  title: 冻柿子
  text: 窗台外头搁了一冬的柿子，冻得跟石头蛋子似的。大人说得泡凉水里缓，不能用热水，一烫就化成汤了。
  options:
    - id: wait
      text: 泡凉水，等冰壳
