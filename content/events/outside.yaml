      requires: { notFlags: [fam_rich, fam_poor] }
      tags: [gentle]
      effects: { self: { mood: 6 }, flags: [saw_village], goto: village }
    - id: go
      text: 拎上一兜子上车
      requires: { notFlags: [fam_rich, fam_poor] }
      tags: [responsible]
      effects: { self: { mood: 4 }, flags: [saw_village], goto: village }
    - id: follow
      text: 回家问能不能跟去
      tags: [adventure]
      effects: { self: { mood: 2 }, tagAlong: [invite] }
    - id: stay
      text: 这回不去了
      tags: [patient]
      effects: { self: { energy: 4 } }
    - id: wait
      text: 下楼送一送
      tags: [solitude]
      effects: { self: { mood: 2 } }
  resonance:
    invite:
      text: 两家坐的是同一趟长途车。下了车才知道，两家的姥姥住一个村，隔着一条河沟。
      memory: 隔一条河沟
      bond: { sync: 3, close: 2 }
    go:
      text: 早班长途车上，一前一后两排。两个人隔着椅背对看了一眼，都笑了。
      memory: 隔着椅背
      bond: { sync: 3, close: 2 }
    follow:
      text: 两个人都回家问了一遍，都问到了同一句：「人家去走亲戚，你跟着算怎么回事。」
      memory: 同一句话
      bond: { sync: 3, close: 2 }
    stay:
      text: 点心匣子留下了一盒。两个人坐在楼道台阶上分着吃了，渣掉了一台阶。
      memory: 一台阶的渣
      bond: { sync: 3, close: 2 }
    wait:
      text: 两个人一人拎着一兜子送下楼，拎到车边，胳膊上都勒出了一道红印。
      memory: 勒红的胳膊
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个在长途车上睡着了，脑袋磕着车窗；一个在楼下跳皮筋，跳一会儿往街口看一眼。
    bond: { close: 0 }

