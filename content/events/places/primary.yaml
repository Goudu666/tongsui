# 小学的支线（pl_pr_ 前缀）。where 用 content/maps/primary.yaml 的 areas。写法见 places/building.yaml 文件头。
# 上学第一天、刻名字、铁皮盒子归主线；开学第一天、转学的同桌、同学录已经有了。

- id: pl_pr_board
  kind: mirror
  stage: childhood
  where: classroom
  when: [930, 1080]
  hint: 教室里有人在拍粉笔灰。
  weight: 2
  requires: { minAge: 8 }
  title: 黑板报
  text: 轮到你们出黑板报。报头空着，粉笔只剩红黄两根。老师说明天一早检查，说完锁了办公室的门。
  options:
    - id: draw
      text: 先画报头
      tags: [adventure]
      effects: { self: { charm: 1 } }
    - id: copy
      text: 先把字抄上
      tags: [responsible]
      effects: { self: { mind: 1 } }
    - id: half
      text: 一人管半块黑板
      tags: [competitive]
      effects: { self: { mood: 4 } }
  resonance:
    draw:
      text: 两个人都画了太阳，一个在左边，一个在右边。第二天全班说黑板上有两个太阳。
      memory: 两个太阳
      bond: { sync: 3, close: 2 }
    copy:
      text: 字抄得一边大一边小。你们站在讲台上，拿板擦一个字一个字改齐了。
      memory: 改齐的字
      bond: { sync: 3, close: 2 }
    half:
      text: 一人画了半块黑板，当中那道缝怎么也对不上。你们干脆在中间画了一座桥。
      memory: 当中一座桥
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个画满了报头，一个抄满了字。最后报头挤在角上，像一张邮票。
    bond: { close: 0 }

- id: pl_pr_pencilbox
  kind: mirror
  stage: childhood
  where: classroom
  when: [480, 930]
  hint: 后排一阵起哄。
  weight: 2
  requires: { minAge: 7, maxAge: 9 }
  title: 会弹的盖子
  text: 班上有人带来一个双层铁皮文具盒，一按，盖子自己弹开。下课全班围着看，排着队按。
  options:
    - id: queue
      text: 排队按一下
      tags: [adventure]
      effects: { self: { mood: 4 } }
    - id: seat
      text: 坐着不动
      tags: [patient]
      effects: { self: { mind: 1 } }
    - id: make
      text: 拿硬纸板自己糊一个
      tags: [gentle]
      effects: { self: { mind: 1, mood: 2 } }
  resonance:
    queue:
      text: 你们排在一前一后。轮到了，两个人一人按了一下，盖子弹得一样高。
      memory: 弹起来的盖子
      bond: { sync: 3, close: 2 }
    seat:
      text: 全班都围过去了，就剩你们俩坐着。你们互相看了一眼，接着削铅笔。
      memory: 削铅笔
      bond: { sync: 3, close: 2 }
    make:
      text: 你们拿硬纸板一人糊了一个，没有弹簧，盖子拿手一推就开。一直用到了五年级。
      memory: 纸板文具盒
      bond: { sync: 3, close: 3 }
  dissonance:
    text: 一个挤在人堆里，一个在座位上拿纸板比画。上课铃响，两个人都没看够。
    bond: { close: 0 }

- id: pl_pr_photo
  kind: mirror
  stage: childhood
  where: yard
  when: [540, 930]
  hint: 操场上摆了几排长凳。
  weight: 2
  requires: { minAge: 11 }
  title: 毕业照
  text: 操场上摆好了长凳，按个头排。照相的数「一、二」，还没数到三，就有人眨了眼。
  options:
    - id: front
      text: 往前头挤
      tags: [competitive]
      effects: { self: { charm: 1 } }
    - id: beside
      text: 站到对门旁边
      tags: [gentle]
      effects: { self: { mood: 4 } }
    - id: tiptoe
      text: 踮起脚
      tags: [adventure]
      effects: { self: { mood: 3 } }
  resonance:
    front:
      text: 你们都挤到了第一排正当中，把班主任挤到了边上。
      memory: 第一排正中
      bond: { sync: 3, close: 2 }
    beside:
      text: 个头不一样，一个站长凳一个站地上，肩膀正好齐了。
      memory: 齐着的肩膀
      bond: { sync: 3, close: 3 }
    tiptoe:
      text: 你们都踮着脚。照片洗出来，两个人都比实际高出一截。
      memory: 踮着的脚
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个往前挤，一个往旁边找。照片上两个人隔着三个人，都在往一边看。
    bond: { close: 0 }

- id: pl_pr_keys
  kind: solo
  stage: childhood
  where: school
  when: [930, 1080]
  hint: 传达室的窗户开着。
  weight: 2
  requires: { minAge: 7 }
  title: 搁在这儿的钥匙
  text: 放学出门，传达室的大爷叫住你：「你妈把钥匙搁我这儿了。」他认得全校每个孩子是谁家的。
  options:
    - id: run
      text: 道声谢就跑
      tags: [adventure]
      effects: { self: { mood: 3 } }
    - id: stay
      text: 坐下陪他听会儿收音机
      tags: [patient]
      effects: { self: { mood: 5, charm: 1 } }
    - id: ask
      text: 问他怎么都认得
      tags: [gentle]
      effects: { self: { mind: 1 } }

- id: pl_pr_pickup
  kind: solo
  stage: old
  where: school
  when: [930, 1080]
  hint: 校门口站满了老人。
  weight: 2
  title: 接孩子
  text: 校门口等孩子的，一半是老人。你站在当年等人的那棵树底下。
  options:
    - id: wave
      text: 朝门里招手
      tags: [gentle]
      effects: { self: { mood: 6 } }
    - id: sit
      text: 坐在花坛边上等
      tags: [patient]
      effects: { self: { energy: 3 } }

# ---------- 补空档（11-11）：少年、青年、中年 ----------
# 少年两件挂在中考（15）前：旧习题集拿精力换心智，也能让给对门；操场那件给体魄。
# 青年：当了老师的人头一年（挂在四十五岁那道看心智魅力的关上），和人人都碰得上的旧课桌。
# 中年：补课的副业（job_teach 晚上在教室后排）拿精力换心智、或者换人缘；家长会给有孩子的人。

- id: pl_pr_workbook
  kind: solo
  stage: teen
  where: school
  when: [930, 1110]
  hint: 有人在校门口喊你。
  weight: 2
  requires: { minAge: 13, maxAge: 15 }
  title: 旧习题集
  text: 路过小学，当年教数学的老师在门口叫住你，从包里掏出一本旧习题集：「中考考这个。」
  options:
    - id: do
      text: 拿回去一页页做完
      tags: [competitive]
      effects: { self: { mind: 1, energy: -8 } }
    - id: share
      text: 撕开一半给对门
      tags: [gentle]
      effects: { self: { mood: 2 }, other: { mind: 1 }, bond: { close: 1 } }
    - id: shelf
      text: 道声谢，先搁着
      tags: [solitude]
      effects: { self: { mood: 3 } }

- id: pl_pr_hoop
  kind: mirror
  stage: teen
  where: yard
  when: [930, 1110]
  hint: 小学操场上没人。
  weight: 2
  requires: { minAge: 13 }
  title: 矮了的篮筐
  text: 放学绕回小学操场。当年够不着的篮筐，现在一伸手就摸到了网。
  options:
    - id: shoot
      text: 投到天黑
      tags: [competitive]
      effects: { self: { body: 1, energy: -8 } }
    - id: step
      text: 坐在当年那级台阶上
      tags: [patient]
      effects: { self: { mood: 4 } }
    - id: kids
      text: 教小孩子运球
      tags: [gentle]
      effects: { self: { charm: 1, energy: -4 } }
  resonance:
    shoot:
      text: 天黑透了，最后一个球在框上转了三圈。你们俩谁也没去捡。
      memory: 转了三圈
      bond: { sync: 3, close: 2 }
    step:
      text: 那级台阶现在只坐得下两个人，你们挤着坐上去，正好。
      memory: 那级台阶
      bond: { sync: 3, close: 2 }
    kids:
      text: 你们一人带一拨小孩比了一场。比分拿粉笔写在地上，天黑前是平的。
      memory: 地上的比分
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个在篮下投个不停，一个坐在台阶上看。球滚过去，坐着的那个伸脚挡住了。
    bond: { close: 0 }

- id: pl_pr_desks
  kind: mirror
  stage: young
  where: yard
  when: [720, 1110]
  hint: 操场上堆着旧桌椅。
  weight: 2
  requires: { minAge: 20 }
  title: 旧课桌
  text: 小学换了新课桌，旧的堆在操场上，谁要谁搬走。你们在那一堆里找当年那一张。
  options:
    - id: find
      text: 一张张翻着找
      tags: [patient]
      effects: { self: { mood: 5, energy: -4 } }
    - id: carry
      text: 扛一张回家
      tags: [responsible]
      effects: { self: { body: 1, energy: -8 } }
    - id: sit
      text: 坐上去比比个子
      tags: [adventure]
      effects: { self: { mood: 3 } }
  resonance:
    find:
      text: 你们在同一张前面停下。桌面当中一道刻痕，一边宽一边窄。
      memory: 一边宽一边窄
      bond: { sync: 3, close: 2 }
    carry:
      text: 两个人扛着一张桌子回去，一人一头，进楼道时都喊「低头」。
      memory: 一人一头
      bond: { sync: 3, close: 2 }
    sit:
      text: 两个人挤在一张桌子后头，胳膊肘又碰在了一块儿。
      memory: 碰着的胳膊肘
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个在桌子堆里翻，一个已经扛起一张走了。翻的那个找着时，扛走的那张就是。
    bond: { close: 0 }

- id: pl_pr_firstyear
  kind: solo
  stage: young
  where: school
  when: [420, 1020]
  hint: 预备铃响了。
  weight: 2
  requires: { minAge: 22, maxAge: 25, flags: [job_teach] }
  title: 头一年
  text: 头一年上讲台。最后一排那个男孩在桌肚里弹玻璃球，跟你当年一个样。
  options:
    - id: take
      text: 收了，下课还他
      tags: [patient]
      effects: { self: { charm: 1 } }
    - id: ask
      text: 叫他上来做这道题
      tags: [competitive]
      effects: { self: { mind: 1, energy: -4 } }
    - id: let
      text: 装没看见，接着讲
      tags: [gentle]
      effects: { self: { mood: 3 } }

- id: pl_pr_window
  kind: solo
  stage: middle
  where: classroom
  when: [1080, 1290]
  hint: 窗户外头站着个人。
  weight: 2
  requires: { minAge: 30, flags: [job_teach] }
  title: 窗外那个
  text: 晚上教室后排补课，来了七个。还有一个交不起钱，天天站在窗户外头听。
  options:
    - id: in
      text: 叫他进来坐
      tags: [gentle]
      effects: { self: { charm: 1, mood: 4 } }
    - id: after
      text: 散了单给他讲一遍
      tags: [responsible]
      effects: { self: { mind: 1, energy: -10 } }
    - id: shut
      text: 把窗关上
      tags: [competitive]
      effects: { self: { energy: 3, mood: -2 } }

- id: pl_pr_parents
  kind: solo
  stage: middle
  where: classroom
  when: [1080, 1260]
  hint: 教室里点着灯，人坐满了。
  weight: 2
  requires: { minAge: 32, maxAge: 42, flags: [has_kid] }
  title: 家长会
  text: 家长会。你坐在孩子的座位上，膝盖顶着桌板。还是你当年那间教室。
  options:
    - id: note
      text: 记满一页纸
      tags: [responsible]
      effects: { self: { mind: 1 } }
    - id: hand
      text: 举手说一句
      tags: [competitive]
      effects: { self: { charm: 1 } }
    - id: desk
      text: 伸手摸摸桌肚
      tags: [patient]
      effects: { self: { mood: 5 } }
