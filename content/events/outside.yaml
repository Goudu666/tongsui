      text: 两个人都下了楼，在车边站着。喇叭又响了一声，两个人一齐往后退了一步。
      memory: 退了一步
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 车上的那个数着路边的电线杆，楼道里的那个数着台阶，都数到了一百多。
    bond: { close: 0 }

# ---------- 一、夏天：小康 · 回乡下 ----------
# follow 不写 requires：殷实、清贫的孩子都能跟着去；两家都是小康、一个叫一个跟，也是跟着去了别人家的姥姥家

