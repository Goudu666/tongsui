# 童年篇事件（3–12 岁，一回合 = 一个季节里被记住的一天）
#
# 字段说明见 docs/TECH.md「内容格式」。
#   kind: mirror  默契事件：两人同时在 where 才触发，看到同一段文字，各自私下选择
#   kind: solo    各自事件：每个人单独遇到；没有 where 时在早上醒来触发
# 数值键：
#   个人属性 body 体魄 / mind 心智 / charm 魅力 / luck 运气（0~10）
#   需求     mood 心情 / hunger 饱腹 / energy 精力 / clean 清洁（0~100）
#   关系     sync 默契 / close 亲近 / distance 距离
#   触发     where 地点（见 map.yaml 的 zones）/ when [起, 止] 分钟（1080 = 18:00）/ hint 地图上飘着的提示

- id: c_roof_summer
  kind: mirror
  stage: childhood
  where: roof
  when: [1080, 1300]
  hint: 楼顶好像有人在收凉席。
  seasons: [summer]
  weight: 3
  title: 楼顶的夏夜
  text: 夏天晚上，楼顶比屋里凉快。远处海河对岸的灯一盏一盏亮起来，楼下有人在收音机里听相声。
  options:
    - id: stars
      text: 躺在凉席上数星星
      tags: [gentle]
      effects: { self: { mood: 10 } }
    - id: popsicle
      text: 跑下楼买两根冰棍
      tags: [adventure]
      effects: { self: { mood: 5 }, other: { mood: 5 } }
    - id: home
      text: 太晚了，回屋吧
      tags: [solitude]
      effects: { self: { energy: 10 } }
  resonance:
    stars:
      text: 你们并排躺着，数到第四十七颗的时候，谁也想不起来数到哪儿了。
      memory: 第四十七颗星
      bond: { sync: 3, close: 3 }
    popsicle:
      text: 你们在楼梯拐角撞上了，手里都攥着两根冰棍。最后一人吃了两根，第二天都闹肚子。
      memory: 四根冰棍
      bond: { sync: 3, close: 2 }
    home:
      text: 你们一前一后下了楼，在楼道里说了声"明儿见"。
      memory: 明儿见
      bond: { sync: 2, close: 1 }
  dissonance:
    text: 一个人在楼顶等了很久，另一个人已经在楼下了。
    bond: { close: 1 }

- id: c_stray_cat
  kind: mirror
  stage: childhood
  where: hallway
  hint: 楼道的暖气片后面有很细的叫声。
  weight: 2
  requires: { minAge: 5 }
  title: 暖气片后面的猫
  text: 楼道的暖气片后面缩着一只受伤的小猫。楼长说过不许在楼道里养东西。
  options:
    - id: hide
      text: 偷偷拿纸箱给它搭个窝
      tags: [adventure, gentle]
      effects: { self: { mood: 5 }, flags: [cat_secret] }
    - id: tell
      text: 去告诉大人
      tags: [responsible]
      effects: { self: { mind: 1 } }
    - id: leave
      text: 不敢管，绕开走
      tags: [solitude]
      effects: { self: { mood: -5 } }
  resonance:
    hide:
      text: 从那天起，你们有了第一个只属于两个人的秘密。猫叫"暖暖"。
      memory: 暖暖
      bond: { sync: 3, close: 4 }
    tell:
      text: 你们一起去敲了楼长的门。小猫后来被自行车铺的爷爷收养了。
      memory: 车铺的猫
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 一个想留下它，一个想交给大人。你们第一次为一件事争了起来。
    bond: { close: -1 }

- id: c_new_year
  kind: mirror
  stage: childhood
  where: alley
  when: [1140, 1320]
  hint: 楼下飘着一股火药味。
  seasons: [winter]
  weight: 2
  title: 除夕的鞭炮
  text: 除夕夜，楼下满地红纸屑。你攥着一盒偷来的火柴，兜里揣着三个"二踢脚"。
  options:
    - id: together
      text: 喊上对门一起放
      tags: [adventure]
      effects: { self: { mood: 10 } }
    - id: save
      text: 留到初一早上
      tags: [patient]
      effects: { self: { mind: 1 } }
  resonance:
    together:
      text: "「砰——啪！」你们的眉毛都被燎掉了一点，楼上有人推开窗户骂了一句，然后也乐了。"
      memory: 燎掉的眉毛
      bond: { sync: 3, close: 3 }
    save:
      text: 大年初一的清晨，整条街只有你们两个人的鞭炮声。
      memory: 初一的清晨
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 你在楼下喊了好几声，楼上那扇窗一直没开。那年的鞭炮是一个人听的。
    bond: { close: 0 }

- id: c_river_ice
  kind: mirror
  stage: childhood
  where: river
  hint: 海河边有人在喊"冻实了！"
  seasons: [winter]
  weight: 2
  title: 冻上的海河
  text: 海河冻上了。冰面上有人抽冰嘎，有人推着冰车跑，岸边大人喊着"别往中间去"。
  options:
    - id: skate
      text: 下去推冰车
      tags: [adventure]
      effects: { self: { body: 1, mood: 5 } }
    - id: shore
      text: 在岸上看着
      tags: [patient]
      effects: { self: { mood: 5 } }
  resonance:
    skate:
      text: 一个人坐在冰车上，一个人在后面推。摔了七次，笑了七次。
      memory: 冰车
      bond: { sync: 3, close: 3 }
    shore:
      text: 你们靠着栏杆，看着别人在冰上转圈，哈出来的白气混在一起。
      memory: 栏杆上的白气
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个在冰上喊"快下来"，一个在岸上喊"快上来"。
    bond: { close: 1 }

- id: c_first_fight
  kind: solo
  stage: childhood
  where: alley
  when: [900, 1140]
  weight: 2
  requires: { minAge: 7 }
  title: 第一次打架
  text: 放学路上，隔壁楼的几个大孩子拦住你，说你"天天跟对门那个玩，丢人"。
  options:
    - id: fight
      text: 冲上去
      tags: [adventure, competitive]
      effects: { self: { body: 1, mood: -5 }, other: { mood: 5 }, bond: { close: 2 } }
    - id: run
      text: 跑回家
      tags: [solitude]
      effects: { self: { mood: -5 } }
    - id: argue
      text: "跟他们掰扯：「介有嘛丢人的？」"
      tags: [responsible]
      effects: { self: { mind: 1, charm: 1 } }

- id: c_rainy_day
  kind: solo
  stage: childhood
  weight: 3
  title: 下雨天
  text: 雨下了一整天，楼下的路成了河。
  options:
    - id: read
      text: 翻出一本没看完的小人书
      tags: [solitude]
      effects: { self: { mind: 1 } }
    - id: puddle
      text: 穿上雨靴去踩水坑
      tags: [adventure]
      effects: { self: { body: 1, mood: 5, clean: -20 } }
    - id: door
      text: 去对门借一本小人书
      tags: [gentle]
      effects: { self: { mood: 5 }, other: { mood: 5 }, bond: { close: 1 } }

- id: c_guitar
  kind: solo
  stage: childhood
  where: bikeshop
  weight: 1
  requires: { minAge: 8 }
  title: 车铺里的旧二胡
  text: 修车爷爷的墙上挂着一把落满灰的二胡。他说，想学就来。
  options:
    - id: learn
      text: 每天放学来学一会儿
      tags: [patient]
      effects: { self: { charm: 1, mood: 5 }, flags: [erhu] }
    - id: skip
      text: 算了，太难听了
      tags: [solitude]
      effects: {}

- id: c_exam
  kind: solo
  stage: childhood
  weight: 2
  requires: { minAge: 9 }
  title: 期末考试
  text: 明天期末考试，你的数学还有两个单元没看。
  options:
    - id: cram
      text: 熬夜看书
      tags: [competitive]
      effects: { self: { mind: 2, energy: -20 } }
    - id: ask
      text: 去对门问题目
      tags: [gentle]
      effects: { self: { mind: 1 }, bond: { close: 1 } }
    - id: sleep
      text: 早点睡，听天由命
      tags: [solitude]
      effects: { self: { mood: 5 } }
