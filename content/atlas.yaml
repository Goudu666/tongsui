# 图鉴和「差一点」（server/src/atlas.ts，设计见 docs/LEGACY.md 第十三节）。
#
# 一世走完，住户本里多记一笔这条人生线走到过的结局；没走到的，图鉴里只留一句谜面。
# 结局页「再来一世」正上方写「差一点」：关口上差几分没够上的那条路，差一样就能走到的结局和一生。
# 只拿来看，不给东西：见过多少个结局，投胎出来的孩子一模一样。
#
#   hidden   藏着的结局、一生、街坊记住的事：没走到之前，图鉴里只有一个印着「藏」的空框，没有谜面
#   sad      不拿来说「差一点」的结局（没人想差一点就走散）
#   riddles  没见过的结局那一句。十二个字上下，说的是「怎么过」，不说「差几分」。
#            接家里营生的那些一生不用写：构建按人家自动写成「生在周家，接下了家里的营生」
#   says     差一点的时候，缺的那个标记怎么说，接在「就差」后面（not 的那种接在「坏在」后面）。
#            结局条件里的标记没写在这儿的，那个结局就不拿来说差一点（比如出身定的 fam_，这辈子改不了）

hidden:
  - e_album
  - e_four_names
  - e_nested
  - e_again
  - e_same_death
  - e_duo
  - l_margin
  - l_just_right
  - r_again
  - r_four_names

sad: [e_drifted, e_nod, l_early]

