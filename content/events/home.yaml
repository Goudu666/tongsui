    - id: drink
      text: 站在门口一口喝完
      tags: [responsible]
      effects: { self: { body: 0.2 } }
    - id: share
      text: 倒一半给对门
      tags: [gentle]
      effects: { self: { body: 0.1 }, other: { body: 0.1 }, bond: { close: 1 } }
    - id: pour
      text: 嫌腥，偷偷倒掉
      tags: [solitude]
      effects: { self: { mood: 2 } }
