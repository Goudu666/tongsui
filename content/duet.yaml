# 「接话」：两个人之间一抛一接的文案和数值。玩法说明见 docs/DUET.md。
# 改完运行 npm run content（和事件一起校验，一起生成进 content.json / content.generated.ts）。
#
# 文案里可以用的占位符：{a} {b} 两个人的名字，{gap} 隔了几个日子，{o} 选项或事件的原文，{x} {y} 次数

# ---------------------------------------------------------------------------
# 一、搭上了：默契事件里两人选得不一样，但一个抛、一个接
#
# 按事件 id 挂上去，可以挂在任何 mirror 事件上，不用改事件文件。pair 不分先后。
# 没写在这里的不同选项组合，仍然算错位。
#   text    48 字以内，写成一来一往，停在一个画面上
#   memory  8 字以内，一样握得住的东西
#   flags   可选，共同标记（p_ 开头），和共鸣的 flags 一样两个人都会得到
# ---------------------------------------------------------------------------
catches:
  c_roof_summer:
    - pair: [stars, popsicle]
      text: 一个躺着数星星，一个举着两根冰棍上来了。数到哪儿不要紧，冰棍先吃。
      memory: 楼顶的冰棍
      bond: { sync: 2, close: 1 }
  c_river_ice:
    - pair: [skate, shore]
      text: 一个在冰上推冰车，一个在岸上给抱着棉袄。棉袄捂热了，人也上来了。
      memory: 捂热的棉袄
      bond: { sync: 2, close: 1 }
  d_kite_tree:
    - pair: [climb, hold]
      text: 一个上树，一个在底下张着手。风筝先下来的，人后下来的，都接住了。
      memory: 都接住了
      bond: { sync: 3, close: 1 }
  d_broken_window:
    - pair: [own, cover]
      text: 一个刚说「是我们俩」，一个抢着说「是我一个人」。马奶奶：「你俩先对对词儿。」
      memory: 没对上的词儿
      bond: { sync: 2, close: 2 }
  d_radio_show:
    - pair: [pick, clap]
      text: 一个往下编，一个在边上「嗯、啊、别挨骂了」。马爷爷说：「行，这俩能上台了。」
      memory: 楼顶那一段
      bond: { sync: 4, close: 1 }
  d_teen_bike:
    - pair: [ride, seat]
      text: 一个蹬，一个坐后座上扶着书包。上桥那段是下来推的，谁也没提。
      memory: 上桥那一段
      bond: { sync: 3, close: 1 }
  d_wheel_steps:
    - pair: [front, back]
      text: 一个前头，一个后头，三级台阶，没人喊一二三。老楼长说：「你俩打小就这么抬白菜。」
      memory: 三级台阶
      bond: { sync: 4, close: 1 }
  d_old_bench:
    - pair: [talk, quiet]
      text: 一个说，一个听。说的那个说岔了年头，听的那个没给纠正。
      memory: 说岔的年头
      bond: { sync: 3, close: 1 }
  # 门外的世界（content/events/outside.yaml）：一家叫、一家跟着去，是把对门带进自己家的世界那一下；
  # 一个去了、一个在家等着，带回来一样东西。p_took_* 一生小结读（被带去的那一个）
  out_sea_1:
    - pair: [invite, follow]
      text: 一个刚喊「走」，一个已经跑回家问去了。车开出去，两个人挤在后座的一个窗口。
      memory: 一个窗口
      bond: { sync: 3, close: 2 }
      flags: [p_took_sea]
    - pair: [go, wait]
      text: 一个上了车，一个在楼下站着。三天后回来，兜里一把沙子，先敲的是对门。
      memory: 一兜沙子
      bond: { sync: 2, close: 1 }
  out_sea_2:
    - pair: [invite, follow]
      text: 一个来拍门，一个已经拎着书包站在门里了。书包里塞着一条旧泳裤，是借的。
      memory: 借来的泳裤
      bond: { sync: 3, close: 2 }
      flags: [p_took_sea]
    - pair: [go, wait]
      text: 一个上了车，一个在楼下挥手。回来那天，楼道里对门的门把上挂着一串贝壳。
      memory: 门把上的贝壳
      bond: { sync: 2, close: 1 }
  out_village_1:
    - pair: [invite, follow]
      text: 一个说「走」，一个回家拿了件长袖。到了玉米地才知道，长袖是拿对了。
      memory: 一件长袖
      bond: { sync: 3, close: 2 }
      flags: [p_took_village]
    - pair: [go, wait]
      text: 一个回了乡下，一个在楼下等。回来那天，半兜子新掰的玉米先给了对门。
      memory: 半兜玉米
      bond: { sync: 2, close: 1 }
  out_village_2:
    - pair: [invite, follow]
      text: 一个刚开口，一个就说「我去问」。那天晚上，姥姥家的饭桌上多摆了一双筷子。
      memory: 多一双筷子
      bond: { sync: 3, close: 2 }
      flags: [p_took_village]
    - pair: [go, wait]
      text: 一个回了乡下，一个在楼下等。回来的那个晒黑了一圈，拎着一兜鸡蛋，拿报纸裹着。
      memory: 裹报纸的鸡蛋
      bond: { sync: 2, close: 1 }
  out_market_1:
    - pair: [invite, follow]
      text: 一个说「来帮我看摊」，一个鞋都没提上就下了楼。车斗里挤着两个人，一摞筐。
      memory: 车斗里俩人
      bond: { sync: 3, close: 2 }
      flags: [p_took_market]
    - pair: [go, wait]
      text: 一个出了摊，一个在楼下等。中午车回来，车斗里滚下来两根卖剩的黄瓜，是给对门的。
      memory: 两根黄瓜
      bond: { sync: 2, close: 1 }
  out_market_2:
    - pair: [invite, follow]
      text: 一个把扎好的毛票分了一半塞过去：「你管找零。」那天一分钱也没找错。
      memory: 一分没错
      bond: { sync: 3, close: 2 }
      flags: [p_took_market]
    - pair: [go, wait]
      text: 一个出了摊，一个在楼下等。中午回来，兜里一把卖剩的小西红柿，红的都给了对门。
      memory: 小西红柿
      bond: { sync: 2, close: 1 }
  out_kin_visit:
    - pair: [tell, copy]
      text: 一个讲今天的题，一个说病房里的事。讲完了，说完了，两个人谁也没起身。
      memory: 谁也没起身
      bond: { sync: 3, close: 2 }

# ---------------------------------------------------------------------------
# 二、回话：一方不在时影子替他选过的默契事件，本人回来后补答
# ---------------------------------------------------------------------------
echo:
  ask: 你不在的那天，是影子替你去的。换了你，你会？
  res: 这句话在半空悬了{gap}，接上了。
  catch: 隔了{gap}，还是搭上了。
  miss: 换了本人，也没选到一块儿。倒省得后悔。
  like: 影子选的也是这个。它学得挺像。
  unlike: 影子替你选的是「{o}」。它还得学。
  knew: "{b}当时猜的就是这个。{b}比影子懂你。"
  kept: 这一回是影子替{b}去的。话先悬着，等本人回来接。
  told: "{b}回了「{o}」那天的话。"

# ---------------------------------------------------------------------------
# 关口上：拉一把、没拉上、重逢（server/src/pull.ts，docs/DUET.md 第五节）
# {a} 拉人的 / 走了别的路的那个，{b} 被拉的 / 没拉上的那个，{x} 差几分、几块、隔了几年，{o} 没拉上以后走的那条路
# 回忆的名字 8 字以内。拉一把是一个人替另一个人做的事，写那个动作，不写感激
# ---------------------------------------------------------------------------
gate:
  pull: "{b}差 {x} 分。{a}把自己那份往这边推了推，两个人一块儿过去了。"
  money: "{b}差 {x} 块。{a}没吭声，把钱塞进了{b}的兜里。"
  miss: "{a}走了别的路。{b}一个人够不着那条，走了「{o}」。"
  reunion: 各走各的{x}年，到这儿又走到一条路上了。
  pullMemory: 拉了一把
  moneyMemory: 塞过来的钱
  reunionMemory: 又走到一块儿

# ---------------------------------------------------------------------------
# 三、一生结束时多出来的几句（接在人生长卷的题词后面）
# last 按顺序取第一条满足的：minRate 是默契率（共鸣和搭上了都算）
# ---------------------------------------------------------------------------
epitaph:
  know: "{a}猜中{b} {x} 回，{b}猜中{a} {y} 回。"
  shadow: 影子替{a}去过 {x} 回，有 {y} 回选得跟本人一样。
  last:
    - { minRate: 70, text: 这二位，对门住了一辈子，正经话没说过几句，话也没掉地上过几回。 }
    - { minRate: 40, text: 这二位，一个抛的另一个不一定接得住，可回回都伸手了。 }
    - { minRate: 0, text: 这二位，各说各的说了一辈子，倒也没耽误当对门。 }
