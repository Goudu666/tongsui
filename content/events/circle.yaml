# 人际圈子（docs/CIRCLE.md、content/circle.yaml）：认识谁，决定能求谁。
#
# 门路（tie_*）和关口上的用法归 milestones.yaml / map.yaml / server/src/circle.ts，这里只写日子里碰上的事：
#   - 三档人家同一个题目不同的样子：家长会（7~11）、过年拜年（13~17，被求的那一头 / 求人的那一头 / 走亲戚的那一头）、
#     份子钱（23~29，清贫人家另一份，钱占得更重）
#   - 事件给的门路：殷实家长会上妈妈留下的纸袋（tie_teacher）、金家爷爷的一封信（tie_unit）、街坊求到门上替他说一句（tie_street）
#   - 用街坊情：家里老人住院，楼里凑的一沓钱（摘 tie_street、打 owe_street）
#   - 还人情：每种 owe_* 至少一件，选完都摘掉。owe_kin 推了打 kin_cold（那门亲戚淡了，c_kin_cold 读它）；
#     owe_pa 推了记一回脸色（照 hardship_time.yaml：没有 strain1 的打 strain1，有了的打 fam_cut）
#   - 清贫人家的门路是街坊：开不了关口的门，可饭点上有人隔着窗户喊你（c_street_supper）
#
# 岁数都从关口后一岁起（4、6、9、12、15、18、19、22、28、30、45 是关口），不然会在关口那天早上冒出来。
# 写法守文风手册：不评价谁家好谁家差，不哭穷也不炫富。钱和人情只是摆在那儿的事。正文不写阿拉伯数字。

# ======================== A. 老师眼里的你（家长会，7~11） ========================

- id: c_meeting_rich
  kind: solo
  stage: childhood
  weight: 3
  requires: { minAge: 7, maxAge: 11, flags: [fam_rich], notFlags: [tie_teacher] }
  title: 留下的纸袋
  text: 家长会散了，你妈多留了一会儿，手里那个纸袋没拎回来。第二天，你的座位挪到了第二排。
  options:
    - id: sit
      text: 坐过去，上课多举手
      tags: [competitive]
      effects: { self: { mood: 2 }, flags: [tie_teacher] }
    - id: back
      text: 跟老师说想坐回去
      tags: [adventure]
      effects: { self: { charm: 0.1, mood: 1 } }
    - id: ask
      text: 回家问纸袋里是什么
      tags: [patient]
      effects: { self: { mood: -2 } }

- id: c_meeting_mid
  kind: solo
  stage: childhood
  weight: 3
  requires: { minAge: 7, maxAge: 11, notFlags: [fam_rich, fam_poor, tie_teacher] }
  title: 小椅子
  text: 家长会，你爸请了半天假来的。他坐在你的小椅子上，膝盖顶着桌子，老师说一句他记一句。
  options:
    - id: paper
      text: 散了会拉他看墙报
      tags: [gentle]
      effects: { self: { mood: 5 } }
    - id: ask
      text: 路上问老师说了什么
      tags: [responsible]
      effects: { self: { mind: 0.1, mood: 1 } }
    - id: door
      text: 跟对门在门口等着
      tags: [gentle]
      effects: { self: { mood: 3 }, other: { mood: 2 }, bond: { close: 1 } }

- id: c_meeting_poor
  kind: solo
  stage: childhood
  weight: 3
  requires: { minAge: 7, maxAge: 11, flags: [fam_poor], notFlags: [fam_grandma, tie_teacher] }
  title: 空着的椅子
  text: 家长会那天，你家那把椅子空着。你妈那个班调不开。老师念到你的名字，停了一下，接着往下念。
  options:
    - id: slip
      text: 自己把成绩条带回家
      tags: [responsible]
      effects: { self: { mind: 0.1, mood: -2 } }
    - id: note
      text: 记下老师的话念给她听
      tags: [patient]
      effects: { self: { mind: 0.1, charm: 0.1, mood: -1 } }
    - id: sit
      text: 坐到那把椅子上去
      tags: [solitude]
      effects: { self: { mood: -3 } }

- id: c_meeting_grandma
  kind: solo
  stage: childhood
  weight: 3
  requires: { minAge: 7, maxAge: 11, flags: [fam_grandma], notFlags: [tie_teacher] }
  title: 最后一排
  text: 家长会是姥姥去的，坐在最后一排。老师讲了一个钟头，她回来只说了一句：「老师说你坐得直。」
  options:
    - id: read
      text: 把成绩条念给姥姥听
      tags: [gentle]
      effects: { self: { mood: 4, charm: 0.1 } }
    - id: nod
      text: 点点头，去写作业
      tags: [patient]
      effects: { self: { mind: 0.1 } }
    - id: straight
      text: 第二天坐得更直
      tags: [responsible]
      effects: { self: { body: 0.1, mood: 2 } }

# ======================== B. 人情往来 ========================

# ---------- 过年：被求的那一头 / 求人的那一头 / 走亲戚的那一头 ----------

- id: c_newyear_rich
  kind: solo
  stage: teen
  weight: 3
  requires: { minAge: 16, maxAge: 17, flags: [fam_rich] }
  title: 门口的鞋
  text: 过年你家门口的鞋多。拎东西来的人坐一会儿就走，说话前先看一眼你爸。你妈把东西码进柜子，一样也不拆。
  options:
    - id: tea
      text: 给客人续水，听他们说
      tags: [responsible]
      effects: { self: { charm: 0.2, mood: -2 } }
    - id: room
      text: 躲进屋里写作业
      tags: [solitude]
      effects: { self: { mood: -1 } }
    - id: share
      text: 拿两盒点心给对门
      tags: [gentle]
      effects: { self: { mood: 3 }, other: { mood: 4 }, bond: { close: 1 } }

- id: c_newyear_poor
  kind: solo
  stage: teen
  weight: 3
  requires: { minAge: 13, maxAge: 17, flags: [fam_poor], notFlags: [fam_grandma] }
  title: 拎回来的酒
  text: 年初二，你妈拎着两瓶酒去给你爸单位的领导拜年，你跟着。在人家门口站了一会儿，她又拎着回来了。
  options:
    - id: carry
      text: 接过酒帮她拎
      tags: [gentle]
      effects: { self: { body: 0.1, mood: -2 } }
    - id: quiet
      text: 一路什么也不问
      tags: [patient]
      effects: { self: { mood: -3 } }
    - id: knock
      text: 说下回我去敲门
      tags: [adventure]
      effects: { self: { charm: 0.1, mood: -1 } }

- id: c_newyear_kin
  kind: solo
  stage: teen
  weight: 3
  requires: { minAge: 13, maxAge: 17, flags: [kin_unit] }
  title: 表舅家
  text: 年初三，你爸拎着两瓶酒去表舅家。表舅在单位管点事，家里有暖气。他问了两回你念几年级。
  options:
    - id: answer
      text: 坐直了好好回话
      tags: [responsible]
      effects: { self: { charm: 0.1, mood: -2 } }
    - id: kitchen
      text: 去厨房帮着端菜
      tags: [gentle]
      effects: { self: { charm: 0.1, energy: -5, mood: 1 } }
    - id: tv
      text: 盯着他家的电视
      tags: [solitude]
      effects: { self: { mood: 3 } }

