# 门外的世界（out_ 前缀）：三档人家见到的地方不一样（接口稿 outside/SPEC.md 第四节）。
#
# 一、夏天（mirror，童年，楼道，早上）：殷实人家去海边，小康人家回乡下姥姥家，清贫人家跟着去早市出摊。
#     requires.either：两个人里至少一个人自己是这一档（引擎，outside.ts）。选项的 requires 只看选的人：
#       这一档的孩子看得见 invite（叫上对门）/ go（跟着家里走），都带 goto 把人送到那张图上；
#       别人家的孩子看得见 follow（回家问问，跟着去），tagAlong: [invite]——对门叫了他才跟去，没叫就什么也不发生；
#       stay / wait 谁都看得见。
#     invite × follow 是「搭上了」（content/duet.yaml），打 p_took_*，一生小结读。go × wait 也是：一个去，一个等，带回来一样东西。
#     invite、go 自己也打 saw_*（和图上的 seen 是同一个标记，引擎没走地图的时候也打得上）。
#     两个人读的是同一段字，所以正文只写楼道里看得见的东西（旅行包、两兜子东西、装好的三轮车），不写「你家」「你爸」。
# 二、看病（solo，童年冬天）：同一场烧，三档人家去的地方不一样。
# 三、家里有人住院（少年）：清贫人家的孩子放了学、歇着的日子都在医院（kin_care，rules.yaml 的 flagDuty）；
#     小康人家替半天班，殷实人家请了护工、坐十分钟。对门在楼道里接一下。
# 四、出远门（solo，少年、青年，纯文字）。
#
# 岁数：没写 where 的事别从关口那岁起（6、9、12、15、18、22……），会在关口当天早上触发。所以看病从 7 岁、住院从 13 岁起。
# 写法守 docs/tianjin_style.md：不评价谁家好谁家差，不哭穷也不炫富，不点真实地名和招牌。

# ---------- 一、夏天：殷实 · 海边 ----------

- id: out_sea_1
  kind: mirror
  stage: childhood
  where: hallway
  when: [390, 600]
  seasons: [summer]
  hint: 楼道里搁着个旅行包。
  weight: 3
  requires: { minAge: 6, maxAge: 8, either: { flags: [fam_rich], notFlags: [fam_cut] } }
  title: 旅行包
  text: 楼道里搁着一个新旅行包，拉链上拴着个游泳圈。有一家今天去海边，住三天，车八点到楼下。
  options:
    - id: invite
      text: 拉上对门一块儿去
      requires: { flags: [fam_rich], notFlags: [fam_cut] }
      tags: [gentle]
      effects: { self: { mood: 6 }, flags: [saw_sea], goto: seaside }
    - id: go
      text: 跟着家里上车
      requires: { flags: [fam_rich], notFlags: [fam_cut] }
      tags: [adventure]
      effects: { self: { mood: 4 }, flags: [saw_sea], goto: seaside }
    - id: follow
      text: 回家问能不能跟去
      requires: { notFlags: [fam_rich] }
      tags: [adventure]
      effects: { self: { mood: 2 }, tagAlong: [invite] }
    - id: stay
      text: 这回不去了
      tags: [patient]
      effects: { self: { energy: 4 } }
    - id: wait
      text: 下楼看看那辆车
      tags: [solitude]
      effects: { self: { mood: 2 } }
  resonance:
    invite:
      text: 两个人同时敲开对方的门，话都没说完。两家定的是同一片海，同一个招待所。
      memory: 同一个招待所
      bond: { sync: 3, close: 2 }
    go:
      text: 到了招待所，隔壁的门一开，出来的是对门。两家谁也没提前说。
      memory: 隔壁那间屋
      bond: { sync: 3, close: 2 }
    stay:
      text: 旅行包又拎回了屋里。那天两个人在楼下跳了一上午皮筋，谁也没提海。
      memory: 没提的海
      bond: { sync: 3, close: 2 }
    wait:
      text: 两个人一前一后下了楼，围着车转了一圈，在车窗上各按了一个手印。
      memory: 车窗上的手印
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个坐在后座上回头，一个趴在楼道的窗台上。车拐过街口，两个人还看着那个方向。
    bond: { close: 0 }

