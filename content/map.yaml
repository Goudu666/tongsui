# 行动（各个地方在哪、有哪些点位，见 content/maps/<图>.yaml）
# 行动。needs：hunger 饱腹 / energy 精力 / mood 心情 / clean 清洁（0~100）
#       stats：body / mind / charm（0~10，一次涨零点几；运气是天生的，行动不给）
#       money：正数是挣钱，负数是花钱（钱不够做不了）
# 每个行动只回答一个问题：它涨什么。日常行动是成长的大头，事件给的属性只是点缀。
# together：两个人同时在同一个点做同一件事叫「搭伴」。成长有倍率（见 server/src/world.ts），
#           这里写的是每种每天第一次搭伴时另给的心情、亲近和一句话。
# duty：日程（上学、上班）。做多久、涨什么、挣多少由这个人走的路决定，见 content/tracks.yaml。
actions:
  # ---- 过日子 ----
  - id: eat
    label: 吃饭
    quick: true
    minutes: 30
    needs: { hunger: 45, mood: 3 }
  - id: eat_out
    label: 买套煎饼果子
    quick: true
    minutes: 20
    money: -2
    requires: { hours: [390, 600] }
    needs: { hunger: 40, mood: 8 }
    together: { needs: { mood: 6 }, bond: { close: 1 }, text: "「俩鸡蛋，多放葱花。」你们说的是同一句。" }
  - id: dine
    label: 下馆子
    quick: true
    minutes: 60
    money: -8
    requires: { minAge: 18, hours: [1020, 1260] }
    needs: { hunger: 55, mood: 12 }
    together: { needs: { mood: 8 }, bond: { close: 2 }, text: 一张小桌，两瓶汽水，说到人家收摊。 }
  - id: sleep
    label: 睡觉
    sleep: true
    requires: { owner: true }
  - id: wash
    label: 洗澡
    quick: true
    minutes: 20
    needs: { clean: 60, mood: 2 }
  - id: duty
    label: 上学
    duty: true
    together: { needs: { mood: 4 }, bond: { close: 1 }, text: 你们是一路去的。 }

  # ---- 心智 ----
  - id: picture_book
    label: 翻小人书
    minutes: 60
    requires: { maxAge: 5 }
    needs: { energy: -4, mood: 2 }
    stats: { mind: 0.3 }
    together: { needs: { mood: 4 }, bond: { close: 1 }, text: 两个脑袋凑在一本书上，谁也不让谁翻页。 }
  - id: study
    label: 写作业
    minutes: 90
    requires: { minAge: 6, maxAge: 17 }
    needs: { energy: -10, mood: -6 }
    stats: { mind: 0.4 }
    together: { needs: { mood: 5 }, bond: { close: 1 }, text: 一张桌子两头坐，写一会儿，抬头看一眼对面写到哪了。 }
  - id: read
    label: 看书
    minutes: 90
    requires: { minAge: 18 }
    needs: { energy: -8, mood: -2 }
    stats: { mind: 0.35 }
    together: { needs: { mood: 4 }, bond: { close: 1 }, text: 各看各的，半天没人说话，也不觉得闷。 }

  # ---- 体魄 ----
  - id: play_alley
    label: 楼下跳皮筋
    minutes: 60
    requires: { maxAge: 14 }
    needs: { mood: 10, energy: -8, clean: -8 }
    stats: { body: 0.25, charm: 0.2 }
    together: { needs: { mood: 6 }, bond: { close: 1 }, text: "「小皮球，架脚踢……」你们俩跳得一样快。" }
  - id: play_river
    label: 海河边放风筝
    minutes: 60
    requires: { maxAge: 17 }
    needs: { mood: 10, energy: -8, clean: -6 }
    stats: { body: 0.3 }
    together: { needs: { mood: 6 }, bond: { close: 1 }, text: 一个人拽线，一个人举着风筝跑。 }
  - id: walk_river
    label: 沿河走一圈
    minutes: 60
    requires: { minAge: 18 }
    needs: { mood: 8, energy: -6 }
    stats: { body: 0.3 }
    together: { needs: { mood: 6 }, bond: { close: 1 }, text: 从桥这头走到那头，话说了一半，又走回来。 }
  - id: ball
    label: 操场踢球
    minutes: 90
    requires: { minAge: 6, maxAge: 40 }
    needs: { mood: 6, energy: -14, clean: -10 }
    stats: { body: 0.45 }
    together: { needs: { mood: 6 }, bond: { close: 1 }, text: 两个人，一个球，书包摆成门。 }
  - id: work
    label: 帮爷爷修车
    minutes: 120
    requires: { minAge: 8, maxAge: 17 }
    # 拿成长换钱：两个钟头挣 2 块，长的比踢球、写作业少一半。原来是 5 块外加两项属性都长，从小修车的人三十岁白捡一套房
    money: 2
    needs: { energy: -12, clean: -15 }
    stats: { body: 0.15, mind: 0.1 }
    together: { needs: { mood: 5 }, bond: { close: 1 }, text: 爷爷说你们俩加一块儿顶半个学徒。 }

  # ---- 三年级挑上的（m_club）：只有进了的人做得了，只在放学以后那一阵，长得比自己练快三成 ----
  - id: club_math
    label: 数学小组
    minutes: 90
    requires: { minAge: 9, maxAge: 11, flags: [club_math], hours: [930, 1080] }
    needs: { energy: -10, mood: -2 }
    stats: { mind: 0.52 }
    together: { needs: { mood: 6 }, bond: { close: 1 }, text: 一道题两种解法，你们各讲各的，讲到传达室的大爷来锁门。 }
  - id: club_sport
    label: 体校训练
    minutes: 90
    requires: { minAge: 9, maxAge: 11, flags: [club_sport], hours: [930, 1080] }
    needs: { energy: -18, hunger: -8, mood: 2 }
    stats: { body: 0.58 }
    together: { needs: { mood: 6 }, bond: { close: 1 }, text: 压腿的时候背靠着背，谁也不敢先喊疼。 }
  - id: club_art
    label: 跟曲艺队排练
    minutes: 60
    requires: { minAge: 9, maxAge: 11, flags: [club_art], hours: [930, 1080] }
    needs: { energy: -8, mood: 6 }
    stats: { charm: 0.5 }
    together: { needs: { mood: 6 }, bond: { close: 1 }, text: 茶社下午没有客人，台子借给孩子们。你们一个打板，一个数拍子。 }

  # ---- 家境：家里才有的（docs/MEANS.md）----
  # 殷实人家花钱买的：长得比自己练快，但要钱，也占着放学后、晚上的那一段。bring：对门跟过来，两份钱你出
  - id: piano
    label: 去少年宫学琴
    minutes: 90
    money: -2
    bring: true
    requires: { minAge: 6, maxAge: 14, flags: [fam_rich], hours: [930, 1200] }
    needs: { energy: -6, mood: -3 }
    stats: { charm: 0.4, mind: 0.15 }
    together: { needs: { mood: 6 }, bond: { close: 1, sync: 1 }, text: 一架琴两个人坐，你弹右手，TA 弹左手，老师说拍子对上了。 }
  - id: tutor
    label: 过桥上补习班
    minutes: 120
    money: -3
    bring: true
    requires: { minAge: 12, maxAge: 17, flags: [fam_rich], hours: [1080, 1260] }
    needs: { energy: -14, mood: -6 }
    stats: { mind: 0.62 }
    together: { needs: { mood: 5 }, bond: { close: 1 }, text: 回来的末班车上，两个人把今天的卷子对了一遍，错的是同一道。 }
  # 清贫人家自己的：挣钱，也长见人的本事。不用花钱，可也不带人（那是你家的活）
  - id: help_out
    label: 帮家里干活
    minutes: 120
    money: 3
    requires: { minAge: 8, maxAge: 17, flags: [fam_poor] }
    needs: { energy: -12, clean: -10 }
    stats: { body: 0.15, charm: 0.2 }
    together: { needs: { mood: 5 }, bond: { close: 1 }, text: 对门过来搭了把手，干完了，你家大人塞给你们一人一个苹果。 }
  # 爸妈在厂里的：厂里的澡堂，一张澡票洗得又热又久。带对门去，澡票你出
  - id: factory_bath
    label: 去厂里澡堂洗澡
    minutes: 40
    money: -1
    bring: true
    requires: { minAge: 5, flags: [fam_factory] }
    needs: { clean: 90, mood: 10, energy: 4 }
    together: { needs: { mood: 8 }, bond: { close: 2 }, text: 出来的时候头发还冒着热气，两个人一人一瓶汽水，坐在厂门口晾着。 }

  # ---- 魅力 ----
  - id: chat
    label: 跟街坊聊会儿
    minutes: 60
    requires: { minAge: 15 }
    needs: { mood: 4 }
    stats: { charm: 0.4 }
    together: { needs: { mood: 4 }, bond: { close: 1 }, text: 街坊问你们俩怎么老在一块儿，你们同时说「顺路」。 }

  # ---- 彼此 ----
  - id: knock
    label: 开门喊一声
    quick: true
    minutes: 15
    needs: { mood: -1 }
    together: { needs: { mood: 10 }, bond: { close: 2, sync: 1 }, text: 两扇门同时开了，你们在楼道里对着乐。 }
  - id: play_roof
    label: 楼顶放鸽子
    minutes: 60
    needs: { mood: 12, energy: -4, clean: -4 }
    together: { needs: { mood: 6 }, bond: { close: 1 }, text: 鸽子绕着楼顶飞了三圈，你们数的圈数不一样。 }

  # ---------- 街坊的去处 ----------
  - id: listen
    label: 喝茶听一段
    minutes: 40
    money: -1
    requires: { minAge: 6, hours: [540, 1260] }
    needs: { mood: 12, energy: 2 }
    stats: { charm: 0.1 }
    together: { needs: { mood: 6 }, bond: { close: 1, sync: 1 }, text: 台上讲到最要紧的地方停了一下。你们俩同时笑出了声，又同时捂住了嘴。 }
  - id: perform
    label: 上台来一段
    minutes: 45
    requires: { minAge: 10, hours: [540, 1260] }
    needs: { mood: 6, energy: -10 }
    stats: { charm: 0.4 }
    together: { needs: { mood: 8 }, bond: { close: 1, sync: 2 }, text: 你忘了词，TA 在旁边接了下去，像排练过一样。台下有人叫了声好。 }
  - id: fish
    label: 跟大爷钓鱼
    minutes: 60
    requires: { minAge: 6, hours: [390, 1140] }
    needs: { mood: 10, energy: -4 }
    stats: { mind: 0.1 }
    together: { needs: { mood: 6 }, bond: { close: 1, sync: 1 }, text: 漂动了。你们俩同时喊「上钩了！」鱼吓跑了。大爷没恼，笑了笑，又挂了一条蚯蚓。 }

  # ---------- 新地图上的去处（content/maps/，地点内容线程） ----------
  # 横版多地图接上以前，这些行动没有点位，游戏里碰不到。数值照现有行动的量级，成长线程按需重标。
  # 顺手的事（night_snack、cook、balcony）等五段时间合进来以后加 quick: true。
  - id: chess
    label: 跟大爷下盘棋
    minutes: 60
    requires: { minAge: 7, hours: [720, 1110] }
    needs: { mood: 4, energy: -4 }
    stats: { mind: 0.25 }
    together: { needs: { mood: 5 }, bond: { close: 1 }, text: 你们俩对着下，大爷们围了一圈，谁也不许支招。 }
  - id: blackboard
    label: 出黑板报
    minutes: 60
    requires: { minAge: 7, maxAge: 11, hours: [930, 1080] }
    needs: { energy: -6, clean: -4, mood: 2 }
    stats: { charm: 0.3, mind: 0.05 }
    together: { needs: { mood: 6 }, bond: { close: 1 }, text: 一个画报头，一个抄字，粉笔灰落了两个人一头。 }
  - id: broadcast
    label: 去广播站念稿
    minutes: 45
    requires: { minAge: 12, maxAge: 17, hours: [720, 840] }
    needs: { energy: -4, mood: 4 }
    stats: { charm: 0.35 }
    together: { needs: { mood: 6 }, bond: { close: 1, sync: 1 }, text: 一个念稿，一个放歌。念错一个字，全校都听见你们俩在笑。 }
  - id: rail_talk
    label: 靠着栏杆站会儿
    minutes: 45
    requires: { minAge: 12 }
    needs: { mood: 5 }
    together: { needs: { mood: 8 }, bond: { close: 2, sync: 1 }, text: 船过去了三条，话说了一半。剩下那一半，明天再说。 }
  - id: window_shop
    label: 逛商场
    minutes: 90
    money: -3
    requires: { minAge: 12, hours: [600, 1260] }
    needs: { mood: 10, energy: -8 }
    together: { needs: { mood: 6 }, bond: { close: 1 }, text: 什么也没买，从一楼逛到顶楼，又坐滚梯下来。 }
  - id: dine_west
    label: 吃顿西餐
    minutes: 90
    money: -15
    requires: { minAge: 15, hours: [1020, 1260] }
    needs: { hunger: 55, mood: 14 }
    stats: { charm: 0.05 }
    together: { needs: { mood: 8 }, bond: { close: 2 }, text: 刀叉摆了一排，你们从最外头那把拿起，拿错了也没人看。 }
  - id: read_store
    label: 蹲在书店看书
    minutes: 120
    requires: { minAge: 10, hours: [540, 1200] }
    needs: { energy: -6, mood: 4 }
    stats: { mind: 0.4 }
    together: { needs: { mood: 4 }, bond: { close: 1 }, text: 你们背靠着一个书架坐在地上，一人一本，翻页的声音错开。 }
  - id: night_snack
    label: 夜市吃一碗
    minutes: 30
    money: -2
    requires: { minAge: 18, hours: [1080, 1320] }
    needs: { hunger: 45, mood: 8 }
  - id: cook
    label: 自己做顿饭
    minutes: 45
    money: -1
    requires: { minAge: 18 }
    needs: { hunger: 50, mood: 5, clean: -4 }
    together: { needs: { mood: 6 }, bond: { close: 1 }, text: 一个灶眼，两个人轮着炒，炒出来的是一个味儿。 }
  - id: balcony
    label: 去阳台站会儿
    minutes: 20
    requires: { minAge: 30 }
    needs: { mood: 5 }
  - id: morning_walk
    label: 绕湖走一圈
    minutes: 60
    requires: { minAge: 45, hours: [390, 600] }
    needs: { mood: 6, energy: -6 }
    stats: { body: 0.25 }
    together: { needs: { mood: 6 }, bond: { close: 1 }, text: 你们一前一后走，走到第三圈，并成了一排。 }
  - id: choir
    label: 跟合唱队唱
    minutes: 60
    requires: { minAge: 50, hours: [480, 720] }
    needs: { mood: 8, energy: -4 }
    stats: { charm: 0.25 }
    together: { needs: { mood: 6 }, bond: { close: 1, sync: 1 }, text: 你们站在一排，调都起高了，谁也没往下落。 }
  - id: ground_write
    label: 拿水在地上写字
    minutes: 60
    requires: { minAge: 55, hours: [390, 720] }
    needs: { mood: 6, energy: -2 }
    stats: { mind: 0.2 }
    together: { needs: { mood: 5 }, bond: { close: 1 }, text: 一个写上句，一个接下句。写到第四句，第一句已经干了。 }
  - id: accompany
    label: 陪床
    minutes: 120
    requires: { minAge: 30 }
    needs: { mood: -4, energy: -8 }
    together: { needs: { mood: 8 }, bond: { close: 2 }, text: 两把椅子拼在一起，你们轮着眯一会儿。 }
  # 外地：隔着两张图的两个人，靠写信（信怎么寄到、TA 什么时候收到，见第三步的主线引擎）
  - id: letter
    label: 写信
    minutes: 60
    requires: { minAge: 15 }
    needs: { mood: 5 }
    stats: { mind: 0.15 }
