# ---------- 二、看病：同一场烧 ----------
# lifeGated：殷实（没断供）托人挂专家号、小康排队挂号要两块钱、清贫去街道卫生所一块钱；姜汤和硬撑谁都有。
# 去医院的两样把人送到医院（goto），看完从挂号大厅门口坐车回家

- id: out_sick
  kind: solo
  stage: childhood
  seasons: [winter]
  weight: 3
  requires: { minAge: 7, maxAge: 11 }
  title: 夜里烧起来
  text: 后半夜烧起来了，嗓子眼像塞了团棉花。天一亮，被子掀开一角，一只手搭上了你的脑门。
  options:
    # 郑家（大夫家，fam_doctor）：熟人就是自己妈，不用托人，也不欠人情（tie_hospital 不摘，docs/CIRCLE.md）
    - id: mom
      text: 妈在区医院，直接领你去
      requires: { flags: [fam_doctor] }
      tags: [gentle]
      effects: { self: { energy: 14, mood: 2 }, goto: hospital }
    - id: expert
      text: 爸妈托人挂了专家号
      requires: { flags: [fam_rich], notFlags: [fam_cut, fam_doctor] }
      tags: [patient]
      effects: { self: { energy: 10 }, goto: hospital }
    - id: queue
      text: 一早去医院排队挂号
      requires: { notFlags: [fam_rich, fam_poor] }
      cost: 2
      tags: [patient]
      effects: { self: { energy: 4 }, goto: hospital }
    - id: clinic
      text: 去街道卫生所打一针
      requires: { flags: [fam_poor] }
      cost: 1
      tags: [responsible]
      effects: { self: { energy: -10, mood: -2 } }
    - id: ginger
      text: 喝碗姜汤捂一身汗
      tags: [solitude]
      effects: { self: { energy: -20, mood: -4 } }
    - id: push
      text: 硬撑着去上学
      tags: [competitive]
      effects: { self: { energy: -28, mind: 1 } }

# ---------- 三、家里有人住院 ----------
# 清贫：kin_care 让上学的日子拖到傍晚（放了学去医院送饭），歇着的日子在病房陪床（rules.yaml 的 flagDuty）。
# 出院那件（out_kin_home）权重给 8 不给 30：一年就两三个日子，给 30 第二天早上就出院了，医院那几天只剩一天

- id: out_kin_hurt
  kind: solo
  stage: teen
  weight: 3
  requires: { minAge: 13, maxAge: 16, flags: [fam_poor], notFlags: [kin_care, kin_cared] }
  title: 铝饭盒
  text: 家里有人住了院，一时半会儿出不来。一只铝饭盒刷干净了，搁在你书包旁边。
  options:
    - id: after_school
      text: 放了学就去送饭
      tags: [responsible]
      effects: { self: { mood: -3 }, flags: [kin_care] }
    - id: night
      text: 夜里去陪床
      tags: [gentle]
      effects: { self: { energy: -10, charm: 1 }, flags: [kin_care] }
    - id: brother
      text: 跟家里轮着来
      tags: [patient]
      effects: { self: { mood: -2 }, flags: [kin_care] }

- id: out_kin_home
  kind: solo
  stage: teen
  weight: 8
  requires: { minAge: 13, flags: [kin_care] }
  title: 出院那天
  text: 出院那天，你把床头柜里的东西一样一样装进网兜。护士说：「这孩子，天天来。」
