# 家庭专属剧情（f_ 前缀）
# 开局抽到的人家，traits 会成为本人的标记（fam_*）。每户一条贯穿一生的小线：童年 → 少年/青年 → 中年/老年。
# 线靠个人标记串起来：后一步的 requires.flags = 家庭标记 + 前一步打的标记。
# mirror 的 requires.flags 看两人标记的并集：只要有一方是这户人家就能触发。文案里不要说「你家」，两个人看到的是同一段字。
# 接下家里营生的选项打 took_over，同时打一个本家的标记（chen_kept / zhou_kept ……），方便以后单独读取。

# ======================== 陈家 · 自行车铺（fam_handy） ========================

- id: f_chen_patch
  kind: solo
  stage: childhood
  where: bikeshop
  weight: 3
  requires: { minAge: 5, flags: [fam_handy] }
  title: 脸盆里的气泡
  text: 你爸蹲在车铺门口补胎。他先拿耳朵听了一圈，再把内胎按进脸盆：「盯着。哪儿冒泡，哪儿就是漏眼。」
  options:
    - id: watch
      text: 蹲下来盯着水面
      tags: [patient]
      effects: { self: { mind: 1, mood: 5 }, flags: [chen_patch] }
    - id: bell
      text: 偷偷拆下一个车铃
      tags: [adventure]
      effects: { self: { body: 1 }, flags: [chen_patch] }
    - id: run
      text: 嫌一手油，跑了
      tags: [solitude]
      effects: { self: { mood: 5 } }

- id: f_chen_old_bike
  kind: mirror
  stage: teen
  where: bikeshop
  when: [930, 1200]
  hint: 车铺门口靠着一辆锈车。
  weight: 3
  requires: { minAge: 13, flags: [fam_handy, chen_patch] }
  title: 锈死的二八车
  text: 陈家车铺推进来一辆锈死的二八车。车主老太太说是她老伴儿的，修不好，就当废铁卖了吧。
  options:
    - id: strip
      text: 一根辐条一根辐条地拆
      tags: [patient]
      effects: { self: { body: 1, energy: -10 }, flags: [chen_rust] }
    - id: new
      text: 全换新零件
      tags: [responsible]
      effects: { self: { mind: 1 }, flags: [chen_rust] }
    - id: sell
      text: 劝她卖了算了
      tags: [solitude]
      effects: { self: { mood: -5 }, flags: [chen_rust] }
  resonance:
    strip:
      text: 修到车铺关门，链条终于转了一整圈。老太太按了按车铃，叮——她别过脸去。
      memory: 叮的一声
      bond: { sync: 3, close: 3 }
    new:
      text: 新车把，新链条，新座子。老太太绕着车走了三圈：「介还是他那辆吗？」你们俩谁也答不上来。
      memory: 新零件
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个蹲着拆，一个站着劝。老太太看看这个，看看那个，把车推走了。第二天又推了回来。
    bond: { close: 0 }

- id: f_chen_wrench
  kind: solo
  stage: middle
  where: bikeshop
  weight: 3
  requires: { minAge: 36, flags: [fam_handy, chen_rust] }
  title: 那把扳手
  text: 你爸的手抖了，一颗螺丝拧了三回没拧紧。他把那把磨得发亮的扳手放在工具箱最上面，没说话。
  options:
    - id: take
      text: 拿起扳手
      # 接下车铺要耐得住性子：只挂 responsible 的时候，按性格选的人几乎都去劝关门或周末回来帮，
      # 「车铺」那个一生小结 1500 条人生里只走到几回（11-11 加了一批中年小事以后一回都没了）
      tags: [responsible, patient]
      effects: { self: { body: 1, mood: 5 }, flags: [took_over, chen_kept] }
    - id: close
      text: 劝他把铺子关了
      tags: [gentle]
      effects: { self: { mood: -10 }, flags: [chen_closed] }
    - id: weekend
      text: 周末回来帮一天
      tags: [patient]
      effects: { self: { energy: -10, mood: 5 } }

# ======================== 林家 · 教书先生（fam_strict） ========================

- id: f_lin_copybook
  kind: solo
  stage: childhood
  weight: 3
  requires: { minAge: 6, flags: [fam_strict] }
  title: 一页大字
  text: 林家的规矩：晚饭后写一页大字，写不完不许下楼。窗外，楼下有人在喊你的名字。
  options:
    - id: finish
      text: 一笔一笔写完
      tags: [responsible]
      effects: { self: { mind: 1, mood: -5 }, flags: [lin_rules] }
    - id: rush
      text: 写得飞快，字像蚯蚓
      tags: [adventure]
      effects: { self: { mood: 5 }, flags: [lin_rules, lin_rebel] }
    - id: note
      text: 从窗户扔个纸团下去
      tags: [gentle]
      effects: { self: { mood: 5 }, other: { mood: 5 }, flags: [lin_rules] }

- id: f_lin_class
  kind: mirror
  stage: teen
  where: school
  when: [930, 1140]
  hint: 有间教室放学了还亮着灯。
  weight: 3
  requires: { minAge: 12, maxAge: 16, flags: [fam_strict, lin_rules] }
  title: 林老师的补课
  text: 放学后，林家爸爸留下几个孩子补课，不收钱，规矩比课还多。对门的孩子也被家里塞了进来，两个人坐同一张桌。
  options:
    - id: listen
      text: 坐直了认真听
      tags: [responsible]
      effects: { self: { mind: 2, mood: -5 }, flags: [lin_class] }
    - id: doodle
      text: 在桌底下传张画
      tags: [adventure]
      effects: { self: { mood: 5 }, flags: [lin_class] }
    - id: board
      text: 下课帮着擦黑板
      tags: [gentle]
      effects: { self: { charm: 1 }, flags: [lin_class] }
  resonance:
    listen:
      text: 两个本子上的红勾一样多。林老师难得笑了一下：「明儿给你们俩煮挂面。」
      memory: 一样多的红勾
      bond: { sync: 3, close: 2 }
    doodle:
      text: 画被截了。林老师当众打开，是他自己，头上长了两只角。他没骂，把画夹进了教案里。
      memory: 长角的林老师
      bond: { sync: 3, close: 3 }
    board:
      text: 两块黑板擦拍在一起，粉笔灰扑了一脸。林老师在门口站了一会儿，假装没看见。
      memory: 粉笔灰
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个在认真记笔记，一个在桌子底下戳TA的胳膊。林老师咳嗽了一声，两个人都坐直了。
    bond: { close: 0 }

- id: f_lin_podium
  kind: solo
  stage: middle
  weight: 3
  requires: { minAge: 30, maxAge: 45, flags: [fam_strict, lin_class] }
  title: 那块讲台
  text: 你爸退休那天，学校来人问你，愿不愿意回来教他那个班。他的教案还在抽屉里，里面夹着一张长角的画。
  options:
    - id: teach
      text: 回来，站上那块讲台
      tags: [responsible]
      effects: { self: { mind: 1, charm: 1 }, flags: [took_over, lin_teach] }
    - id: away
      text: 不了，想去别处看看
      tags: [adventure]
      effects: { self: { mood: 5 } }
    - id: keep
      text: 把教案收进箱子里
      tags: [patient]
      effects: { self: { mood: -5, mind: 1 } }

# ======================== 周家 · 早点铺（fam_breakfast） ========================

- id: f_zhou_dough
  kind: solo
  stage: childhood
  seasons: [winter, autumn]
  weight: 3
  requires: { minAge: 5, flags: [fam_breakfast] }
  title: 凌晨三点
  text: 凌晨三点，外屋的灯亮了。爸妈在和面，面盆比你还大，屋里一股热乎乎的绿豆面味儿。
  options:
    - id: knead
      text: 挽起袖子帮着揉
      tags: [responsible]
      effects: { self: { body: 1, energy: -15 }, flags: [zhou_dough] }
    - id: eggs
      text: 蹲着数鸡蛋
      tags: [patient]
      effects: { self: { mind: 1, energy: -10 }, flags: [zhou_dough] }
    - id: bed
      text: 钻回被窝
      tags: [solitude]
      effects: { self: { energy: 10 } }

- id: f_zhou_stall
  kind: solo
  stage: young
  where: breakfast
  weight: 3
  requires: { minAge: 21, flags: [fam_breakfast, zhou_dough] }
  title: 这摊子你要吗
  text: 过年回来，你妈手腕上贴着膏药。你爸一边摊煎饼一边说：这摊子，你要不要？不要，开春就盘出去了。
  options:
    - id: take
      text: 我接
      tags: [responsible]
      effects: { self: { charm: 1, energy: -15 }, flags: [took_over, zhou_kept] }
    - id: sell
      text: 盘出去吧，你们歇歇
      tags: [gentle]
      effects: { self: { mood: -5 }, flags: [zhou_sold] }
    - id: recipe
      text: 先把面糊方子抄下来
      tags: [patient]
      effects: { self: { mind: 1 }, flags: [zhou_sold, zhou_recipe] }

- id: f_zhou_taste
  kind: mirror
  stage: old
  where: breakfast
  when: [390, 600]
  hint: 早点铺的铛冒着热气。
  weight: 6 # 早点铺人家、小时候帮过和面、老了两个人都在才碰得上，老年的日子又多半让给主线第七章：3 的时候 1500 世里只出 0~1 回
  requires: { flags: [fam_breakfast, zhou_dough] }
  title: 还是那个味儿
  text: 楼下的早点铺换过三回招牌，面糊还是周家那个方子。两个老人站在铛前，等一套煎饼果子。
  options:
    - id: two_eggs
      text: 俩鸡蛋，多放葱花
      tags: [gentle]
      effects: { self: { mood: 10, hunger: 20 } }
    - id: share
      text: 就要一套，分着吃
      tags: [patient]
      effects: { self: { mood: 5, hunger: 10 } }
  resonance:
    two_eggs:
      text: 你们异口同声，跟七岁那年一模一样。摊煎饼的小年轻乐了：介二位，倍儿默契。
      memory: 多放葱花
      bond: { sync: 3, close: 2 }
    share:
      text: 一套煎饼，一人一半。咬下去，是凌晨三点的面盆味儿。
      memory: 一人一半
      bond: { sync: 3, close: 3 }
  dissonance:
    text: 一个要了俩鸡蛋，一个只要半套。最后半套也让给了对方。
    bond: { close: 1 }

# ======================== 许家 · 跑海运（fam_father_away / fam_rich） ========================

- id: f_xu_ships
  kind: mirror
  stage: childhood
  where: river
  when: [900, 1140]
  hint: 铁桥下面有船鸣笛。
  weight: 3
  requires: { minAge: 5, flags: [fam_father_away] }
  title: 数船
  text: 许家挂历上的红圈只剩三个了，船就要靠岸。两个孩子趴在铁桥栏杆上，一条一条数从底下过去的船。
  options:
    - id: count
      text: 一条一条接着数
      tags: [patient]
      effects: { self: { mood: 5 }, flags: [xu_waiting] }
    - id: paper
      text: 折个纸船放下去
      tags: [gentle]
      effects: { self: { mood: 5, luck: 1 }, flags: [xu_waiting] }
    - id: shout
      text: 冲每条船喊一声
      tags: [adventure]
      effects: { self: { charm: 1, energy: -10 }, flags: [xu_waiting] }
  resonance:
    count:
      text: 数到第六十三条，天黑了。谁也没说那条船没来。
      memory: 第六十三条船
      bond: { sync: 3, close: 3 }
    paper:
      text: 两只纸船一前一后漂远了。有人小声说：船上的人会看见的。
      memory: 两只纸船
      bond: { sync: 3, close: 3 }
    shout:
      text: 喊到嗓子哑，有条船真的鸣了一声笛。两个人高兴得差点翻过栏杆。
      memory: 回了一声笛
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个还在数，一个已经不想等了。桥上的风很大，挂历上的圈还剩三个。
    bond: { close: 0 }

- id: f_xu_retire
  kind: solo
  stage: young
  weight: 3
  requires: { minAge: 20, flags: [fam_father_away, xu_waiting] }
  title: 他不走了
  text: 你爸退休了，这回不走了。他每天五点站在阳台上看天，问你吃没吃饭，客气得像问一个邻居。
  options:
    - id: river
      text: 陪他去海河边站站
      tags: [gentle]
      effects: { self: { mood: 5 }, flags: [xu_home, xu_near] }
    - id: ask
      text: 问他船上是嘛样
      tags: [patient]
      effects: { self: { mind: 1 }, flags: [xu_home, xu_near] }
    - id: apart
      text: 各过各的吧
      tags: [solitude]
      effects: { self: { mood: -10 }, flags: [xu_home] }

- id: f_xu_logbook
  kind: solo
  stage: middle
  weight: 3
  requires: { minAge: 36, flags: [fam_father_away, xu_home] }
  title: 航海日志
  text: 你爸眼睛花了。他把一摞发黄的航海日志推过来：念念。第一本第一页写着：今天风大，想家。
  options:
    - id: read
      text: 一页一页念给他听
      tags: [patient]
      effects: { self: { mood: 10 }, flags: [xu_read] }
    - id: write
      text: 念完，在空白页接着写
      tags: [responsible]
      effects: { self: { mind: 1, mood: 5 }, flags: [took_over, xu_log] }
    - id: later
      text: 合上，说明儿再念
      tags: [solitude]
      effects: { self: { mood: -10 } }

# ======================== 何家 · 姥姥带大（fam_grandma / fam_poor） ========================

- id: f_he_story99
  kind: mirror
  stage: childhood
  where: hallway
  when: [1080, 1300]
  hint: 楼道里有人在讲古。
  weight: 3
  requires: { minAge: 5, flags: [fam_grandma] }
  title: 第九十九个
  text: 何家姥姥坐着小马扎在楼道里择韭菜，一边择一边讲。讲完第九十九个，她拍拍手：第一百个，等你们长大再讲。
  options:
    - id: beg
      text: 缠着她现在就讲
      tags: [adventure]
      effects: { self: { mood: 5 }, flags: [he_99] }
    - id: pinky
      text: 拉钩，等长大
      tags: [patient]
      effects: { self: { mood: 5 }, flags: [he_99] }
    - id: write
      text: 把故事记在作业本背面
      tags: [responsible]
      effects: { self: { mind: 1 }, flags: [he_99, he_notebook] }
  resonance:
    pinky:
      text: 三根手指勾在一起，姥姥的那根最粗。她说：第一百个，给你们俩留着。
      memory: 第一百个
      bond: { sync: 3, close: 4 }
      flags: [p_hundredth]
    beg:
      text: 两个人一左一右拽着姥姥的袖子。韭菜撒了一地，第一百个还是没讲。
      memory: 一地韭菜
      bond: { sync: 3, close: 2 }
    write:
      text: 姥姥不识字，凑过来看两个本子：「介写的是我？」你们一起念给她听，她乐得直拍腿。
      memory: 作业本背面
      bond: { sync: 3, close: 3 }
  dissonance:
    text: 一个还在缠，一个已经拉了钩。姥姥一手一个，把你们俩的脑袋按在一块儿。
    bond: { close: 1 }

- id: f_he_gone
  kind: solo
  stage: young
  weight: 3
  requires: { minAge: 21, flags: [fam_grandma, he_99] }
  title: 姥姥走了
  text: 姥姥走了。收拾床铺，枕头底下压着一个手绢包，里头是你小时候掉的牙，还有一张谁也看不懂的画。
  options:
    - id: pocket
      text: 把那张画揣进兜里
      tags: [gentle]
      effects: { self: { mood: -10 }, flags: [he_gone, he_paper] }
    - id: sit
      text: 在床边坐了一宿
      tags: [solitude]
      effects: { self: { mood: -15, energy: -20 }, flags: [he_gone] }
    - id: door
      text: 去敲对门
      tags: [gentle]
      effects: { self: { mood: -5 }, other: { mood: -5 }, bond: { close: 2 }, flags: [he_gone] }

- id: f_he_hundredth
  kind: solo
  stage: old
  weight: 3
  requires: { flags: [fam_grandma, he_gone] }
  title: 第一百个
  text: 小孙子扒着门框，要听故事。九十九个，你都讲过了。
  options:
    - id: tell
      text: 讲第一百个
