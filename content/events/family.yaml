    wear:
      text: 两件一模一样的格子褂子走在楼下，整条街都在乐：「介是双胞胎？」
      memory: 同一匹布
      bond: { sync: 3, close: 3 }
    save:
      text: 大年初一，两扇门同时开了。你们看着对方的褂子，谁也没憋住。
      memory: 初一的格子褂
      bond: { sync: 3, close: 3 }
    no:
      text: 两件褂子在门上挂了一冬。开春收起来的时候，谁也没说为嘛。
