# 楼下的支线（pl_st_ 前缀）。where 用 content/maps/street.yaml 的 areas。写法见 places/building.yaml 文件头。
# 二月二剃头和煎饼果子的规矩已经有了（neighbors.yaml），这里不重复。

- id: pl_st_icebox
  kind: mirror
  stage: childhood
  where: shop
  when: [780, 1110]
  hint: 小卖部的冰柜嗡嗡响。
  seasons: [summer]
  weight: 2
  requires: { minAge: 4 }
  title: 一根冰棍
  text: 你们俩的钱凑一块儿，只够一根冰棍。小卖部的阿姨把冰柜盖子掀开，等你们挑。
  options:
    - id: split
      text: 买一根掰两半
      tags: [gentle]
      effects: { self: { mood: 6 } }
    - id: rps
      text: 剪子包袱锤，赢的先咬
      tags: [competitive]
      effects: { self: { mood: 5 } }
    - id: wait
      text: 攒着明天再来
      tags: [patient]
      effects: { self: { mood: 2 } }
  resonance:
    split:
      text: 冰棍掰得一长一短。你们都伸手去拿短的，又同时缩了回去。
      memory: 一长一短
      bond: { sync: 3, close: 3 }
    rps:
      text: 你们连出了五回一样的。阿姨看不下去，又从柜里拿了一根：「算我的。」
      memory: 五回平局
      bond: { sync: 3, close: 2 }
    wait:
      text: 第二天再来，冰柜里正好剩一根，就是昨天那个味儿。
      memory: 剩下的那根
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个已经把冰棍掰开了，一个说留着明天。半根冰棍化在手里，滴了一路。
    bond: { close: 0 }

- id: pl_st_chess
  kind: mirror
  stage: teen
  where: alley
  when: [780, 1140]
  hint: 棋摊那边围了一圈人。
  weight: 2
  requires: { minAge: 12 }
  title: 观棋不语
  text: 楼下的棋摊围了一圈人。下棋的大爷举着马不落，回头问：「你俩谁看出来了？说一个。」
  options:
    - id: point
      text: 指一步
      tags: [competitive]
      effects: { self: { mind: 1 } }
    - id: hush
      text: 摇头，不说
      tags: [patient]
      effects: { self: { mood: 2 } }
    - id: look
      text: 先看对门的眼色
      tags: [gentle]
      effects: { self: { charm: 1 } }
  resonance:
    point:
      text: 你们伸出手指，指的是同一个格子。大爷把马落下去，对面认了输。
      memory: 同一个格子
      bond: { sync: 3, close: 2 }
    hush:
      text: 你们一起摇头。大爷乐了：「对，观棋不语。」这盘他输了，也没怪你们。
      memory: 一起摇头
      bond: { sync: 3, close: 2 }
    look:
      text: 你们看了对方一眼，又一齐看向大爷。大爷说：「行，俩人一个心思。」
      memory: 一个眼色
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个张嘴要说，一个在底下踩了他一脚。大爷全看见了，假装没看见。
    bond: { close: 0 }

- id: pl_st_cloth
  kind: solo
  stage: teen
  where: alley
  when: [930, 1110]
  hint: 路口有人在铺塑料布。
  weight: 2
  requires: { minAge: 12, flags: [fam_poor] }
  title: 一块塑料布
  text: 放学先不回家。路口铺开一块塑料布，袜子鞋垫码整齐，你坐马扎上，作业本搁在膝盖上。
  options:
    - id: call
      text: 抬头吆喝一声
      tags: [responsible]
      effects: { self: { charm: 1, mood: -2 } }
    - id: write
      text: 低头写作业
      tags: [solitude]
      effects: { self: { mind: 1, mood: -3 } }
    - id: wave
      text: 冲路过的同学招手
      tags: [gentle]
      effects: { self: { charm: 1, mood: 3 } }

- id: pl_st_newbike
  kind: solo
  stage: teen
  where: alley
  weight: 1
  requires: { minAge: 12, maxAge: 15, flags: [fam_rich] }
  title: 新车
  hint: 楼门口停着辆新车。
  text: 家里给你买了辆变速山地车。楼下几个孩子围着看。旧的那辆二八靠在墙边，链子是你俩一块儿上的油。
  options:
    - id: lend
      text: 让对门先骑一圈
      tags: [gentle]
      effects: { self: { mood: 3 }, other: { mood: 5 }, bond: { close: 1 } }
    - id: ride
      text: 骑去河边兜一圈
      tags: [adventure]
      effects: { self: { body: 1, mood: 5 } }
    - id: teach
      text: 教那几个孩子换挡
      tags: [responsible]
      effects: { self: { charm: 1 } }

- id: pl_st_bench
  kind: mirror
  stage: old
  where: shop
  when: [780, 1110]
  hint: 便利店门口的长凳空着。
  weight: 2
  title: 门口的长凳
  text: 小卖部改成了便利店，门口那条长凳没撤。你们一人坐一头。
  options:
    - id: soda
      text: 买两瓶汽水
      tags: [gentle]
      effects: { self: { mood: 6 } }
    - id: sit
      text: 就这么坐着
      tags: [patient]
      effects: { self: { energy: 4 } }
  resonance:
    soda:
      text: 汽水换了瓶子，还是那个甜。你们喝得很慢。
      memory: 两瓶汽水
      bond: { sync: 2, close: 1 }
    sit:
      text: 坐了一下午。过去的人，有一半认得你们。
      memory: 一下午
      bond: { sync: 2, close: 1 }
  dissonance:
    text: 一个进去买汽水，出来时另一个靠着长凳打起了盹。汽水就搁在他手边。
    bond: { close: 0 }

# ---------- 补空档（11-11）：青年、中年 ----------
# 每件挂在下一道关前面：十八九岁那件接着高考后的夏天，二十出头那件在找事由（22）前面给一点手艺；
# 中年两件是钱和人的取舍：花两块钱的那条路会让四十五、六十那两道看积蓄的关紧一点点。

- id: pl_st_books
  kind: mirror
  stage: young
  where: alley
  when: [930, 1200]
  hint: 巷子口有人吆喝收旧书。
  weight: 2
  requires: { minAge: 18, maxAge: 19 }
  title: 论斤称
  text: 考完那个夏天，巷子口来了个收旧书的，论斤称。两家的课本捆成两摞，并排搁在秤边。
  options:
    - id: sell
      text: 都卖了
      tags: [adventure]
      effects: { self: { mood: 5 } }
    - id: keep
      text: 抽出一本留着
      tags: [patient]
      effects: { self: { mind: 1 } }
    - id: give
      text: 挑几本给楼里的小孩
      tags: [gentle]
      effects: { self: { charm: 1 } }
  resonance:
    sell:
      text: 两摞一共三十一斤。收书的多给了两毛，说你们的书干净，没怎么翻。
      memory: 三十一斤
      bond: { sync: 3, close: 2 }
    keep:
      text: 你们抽出来的是同一本，书皮上写着对方的名字。当年借了，一直没还。
      memory: 没还的那本
      bond: { sync: 3, close: 2 }
    give:
      text: 楼里的小四儿抱走了一摞，走两步回头问：「里头有答案吗？」
      memory: 抱走的一摞
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一摞已经上了秤，另一摞的绳子又被解开了。收书的蹲着等，没催。
    bond: { close: 0 }

- id: pl_st_minding
  kind: solo
  stage: young
  where: bikeshop
  when: [720, 1110]
  hint: 车铺的卷帘门半开着。
  weight: 2
  requires: { minAge: 19, maxAge: 23 }
  title: 看半天铺子
  text: 修车爷爷要过桥配零件，让你帮着看半天铺子。工具摆了一地，哪样是哪样，他说了两遍。
  options:
    - id: fix
      text: 来一辆修一辆
      tags: [responsible]
      effects: { self: { body: 1, mind: 1, energy: -10 } }
    - id: watch
      text: 只收车，等他回来修
      tags: [patient]
      effects: { self: { charm: 1, energy: -3 } }
    - id: close
      text: 挂个牌子，跟他过桥
      tags: [adventure]
      effects: { self: { mood: 4, energy: -6 } }

- id: pl_st_tab
  kind: mirror
  stage: middle
  where: breakfast
  when: [390, 480]
  hint: 鏊子已经热了。
  weight: 2
  requires: { minAge: 32 }
  title: 一张桌
  text: 上班前在早点铺碰上，就剩一张桌。老板娘问：「还是老样子？」
  options:
    - id: treat
      text: 抢着把两份都付了
      tags: [gentle]
      cost: 2
      effects: { self: { mood: 4 }, bond: { close: 1 } }
    - id: pack
      text: 多买一份给爸妈带回去
      tags: [responsible]
      cost: 2
      effects: { self: { mood: 3 } }
    - id: quick
      text: 站着吃完就走
      tags: [competitive]
      effects: { self: { energy: 4 } }
    - id: sit
      text: 坐下，晚到一会儿
      tags: [patient]
      effects: { self: { mood: 5, energy: -2 } }
  resonance:
    treat:
      text: 两个人同时把钱拍在案子上。老板娘两份都收了，给你俩各添了半碗豆浆。
      memory: 半碗豆浆
      bond: { sync: 3, close: 2 }
    pack:
      text: 两个塑料袋挂在同一根车把上，你们推着车走到路口才分开。
      memory: 一根车把
      bond: { sync: 3, close: 2 }
    quick:
      text: 两碗一块儿见底，碗往桌上一搁，一前一后出了门。
      memory: 两只空碗
      bond: { sync: 2, close: 1 }
    sit:
      text: 两个人都迟到了一刻钟，谁也没跟谁说。
      memory: 一刻钟
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个站在门口吃完就走了，一个坐下才发现对面空着，桌上留了一份没动的果子。
    bond: { close: 0 }

- id: pl_st_tab_owed
