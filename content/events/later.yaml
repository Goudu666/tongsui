# 少年 / 青年 / 中年 / 老年 篇的示例事件（M0 只放占位样例，M2/M3 扩写）
# 某个阶段没有可抽的事件时，服务器会用「平淡的日子」兜底。

- id: t_note
  kind: mirror
  stage: teen
  where: school
  weight: 2
  title: 课本上的纸条
  text: 上课时，一张纸条从后排传了过来，上面只有一个问号。
  options:
    - id: reply
      text: 在问号后面画一个笑脸
      tags: [gentle]
      effects: { self: { mood: 5 } }
    - id: ignore
      text: 认真听课，假装没看见
      tags: [responsible]
      effects: { self: { mind: 1 } }
  resonance:
    reply:
      text: 那张纸条来回传了一整节课，最后变成一整页的小人。
      memory: 一整页的小人
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 纸条在课桌角上躺了一节课。下课时，它不见了。
    bond: { close: -1 }

- id: t_choose_school
  kind: solo
  stage: teen
  weight: 2
  requires: { minAge: 15 }
  title: 志愿
  text: 中考志愿表发下来了。市里的重点高中要住校，离家很远。
  options:
    - id: far
      text: 报市重点
      tags: [competitive]
      effects: { self: { mind: 2 }, bond: { distance: 1 } }
    - id: near
      text: 报家门口的学校
      tags: [gentle]
      effects: { self: { mood: 5 } }

- id: y_letter_city
  kind: solo
  stage: young
  weight: 2
  title: 另一座城市
  text: 一家外地的公司给了你一份工作，工资是现在的两倍。
  options:
    - id: go
      text: 去
      tags: [adventure, competitive]
      effects: { self: { charm: 1, mood: -5 }, bond: { distance: 2 } }
    - id: stay
      text: 留下
      tags: [gentle]
      effects: { self: { mood: 5 } }

- id: m_demolish
  kind: mirror
  stage: middle
  where: alley
  hint: 楼门口贴了一张红色的告示。
  weight: 1
  title: 拆迁通知
  text: 楼门口贴出了拆迁通知。这栋红砖楼也在红线里。
  options:
    - id: dig
      text: 回去把楼道墙上刻的名字拍下来
      tags: [gentle]
      effects: { self: { mood: 5 } }
    - id: let_go
      text: 让它跟着楼一起没了吧
      tags: [solitude]
      effects: { self: { mood: -5 } }
  resonance:
    dig:
      text: 你们隔了很多年，在同一个周末回到了楼里，在三楼的楼道里碰了面。墙上两个人的名字还在。
      memory: 拆迁前的周末
      bond: { sync: 4, close: 4, distance: -1 }
  dissonance:
    text: 墙上的名字，只有一个人回来拍了。
    bond: { close: 0 }

- id: o_last_letter
  kind: solo
  stage: old
  weight: 1
  title: 最后一封信
  text: 你翻出一叠旧信。有一封，当年写好了却没有寄出去。
  options:
    - id: send
      text: 现在寄出去
      tags: [gentle]
      effects: { self: { mood: 10 }, other: { mood: 10 }, bond: { close: 2 } }
    - id: keep
      text: 放回抽屉
      tags: [solitude]
      effects: { self: { mood: -5 } }
