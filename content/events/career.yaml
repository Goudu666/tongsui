    # 看本事的几行（坐办公室、托关系、教书、厂里、外地）另有一条花钱的路：读个在职、进修。中年属性长不太动了，
    # 三十到三十六这两个日子里挪得动的是积蓄：买了房的人从零攒起，下了班多揽活的人攒得快（清贫人家拿时间换钱）
    - id: study
      text: 进修两年，评了上去
      score: { money: 1 }
      min: 80
      cost: 40
      requires: { flags: [rank1], notFlags: [rank2, job_trade, job_craft, job_labor, job_odd, own_shop, own_stall, no_job, laid_off] }
      lock: 不是你这一行
      hide: true
      joins: top_desk
      tags: [patient]
      effects: { self: { mind: 0.3, mood: 2 }, flags: [rank2, studied] }
    # 二十六没升上的：熬了这些年，总算升了一级（线不低，人到这会儿本事也长了）
    - id: late
      text: 熬了这些年，升了一级
      score: { mind: 0.4, charm: 0.3, body: 0.3 }
      min: 8.8
      requires: { notFlags: [rank1, own_shop, own_stall, no_job, laid_off] }
      lock: 这一步你用不着
      hide: true
      tags: [patient]
      effects: { self: { mood: 4 }, flags: [rank1] }
    # 被人挖走：升了一级的人才有人来挖。看人缘和手气，直接当个头；老东家那头的人情就没了
    - id: poach
      text: 被人挖去别家当个头
      score: { charm: 0.7, luck: 0.3 }
      min: 8.9
      requires: { flags: [rank1], notFlags: [rank2, job_odd, own_shop, own_stall, no_job, laid_off] }
      lock: 不是你这一行
      hide: true
      tags: [adventure]
      effects: { self: { mood: 3 }, bond: { close: -2 }, flags: [rank2, jumped] }
    # 殷实：家里再使使劲。只给已经升了一级的殷实人家看
    - id: push
      text: 家里再使使劲
      score: { mind: 0.5, charm: 0.5 }
      min: 9.2
      cost: 40
      requires: { flags: [fam_rich, rank1], notFlags: [fam_cut, rank2, own_shop, own_stall, no_job, laid_off] }
      lock: 家里使不上劲
      hide: true
      joins: top_desk
      tags: [competitive]
      effects: { self: { mood: -2 }, flags: [rank2, seat_pull] }
    - id: hold
      text: 就这样，挺好
      tags: [gentle]
      effects: { self: { mood: 4 } }
  resonance:
    top_desk:
      text: 两个人都挑上了大梁。饭桌上的话越来越少，电话铃一响，两家一起抬头。
      memory: 一起抬头
      bond: { sync: 2 }
    late:
      text: 熬了十年，同一年升的。谁也没请客，两家凑了一桌饺子。
      memory: 一桌饺子
      bond: { sync: 3 }
    hold:
      text: 两个人都没往上挤。礼拜天还能一块儿去河边。
      memory: 礼拜天的河边
      bond: { sync: 2 }
  dissonance:
    text: 一个周末也在单位，一个按点回家。按点回家的那个，把对门的报纸顺手收进来。
    bond: { close: -2 }
