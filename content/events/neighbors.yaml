  text: 早点铺来了个外地口音的：「能加根火腿肠吗？」老板娘手上没停：「我们这儿不加。」排队的都扭头看他。
  options:
    - id: explain
      text: 小声给他讲讲规矩
      tags: [gentle]
      effects: { self: { charm: 1 } }
    - id: join
      text: 跟着说：「没这规矩。」
      tags: [competitive]
      effects: { self: { mood: 5 } }
    - id: curious
      text: 其实也想尝尝加肠的
      tags: [adventure]
      effects: { self: { mood: 5 } }
  resonance:
    explain:
      text: 你们一左一右，把绿豆面、果子、果篦儿讲了个全套。那人听完，老老实实要了一套。
      memory: 一套正经的
      bond: { sync: 3, close: 2 }
    join:
      text: 数你们俩嗓门大。老板娘刮子一指：「就你俩懂？上回谁管我要番茄酱来着？」
      memory: 番茄酱
      bond: { sync: 3, close: 2 }
    curious:
      text: 你们对了个眼神，谁也没敢出声。那是你们头一回发现：对门跟自己一样，是个叛徒。
      memory: 两个叛徒
      bond: { sync: 4, close: 2 }
  dissonance:
    text: 一个喊没这规矩，一个嘀咕加一根也死不了人。排队的下了结论：这俩，早晚出一个离家的。
