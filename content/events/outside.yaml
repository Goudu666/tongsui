      bond: { sync: 3, close: 2 }
    go:
      text: 栈桥上，两个人隔着十几米认出了对方。谁也没往前走，先挥了挥手。
      memory: 栈桥上的手
      bond: { sync: 3, close: 2 }
    stay:
      text: 车走了。两个人坐在楼道的台阶上，把一本小人书从头翻到尾，又翻回来。
