# 人生路线：一个人现在在过哪一种日子，每天被占掉哪一块时间。
#
# 不存进存档。每次按年龄和标记从上往下取第一条符合的，所以关口（content/events/milestones.yaml）
# 和事件只管打标记（考上了、辍学了、去外地了），日程自己跟着变。最后一条必须没有条件，兜底。
#
# duty：日程块。spot 是去哪报到（content/map.yaml 里 action 含 duty 的点位），arrive 是几点到几点之间到，
#       until 是几点结束；needs / stats / money 是这一天下来的结果。两个人走同一条路，就是一起去、一起回，
#       算「搭伴」；走了不同的路，放学下班的钟点就错开了。
# 时间用当天的分钟数：420 = 07:00，930 = 15:30，1080 = 18:00。

- id: preschool
  label: 还没上学
  requires: { maxAge: 5 }

# ---- 6~11 小学：两个人一定同路（当了不同的小干部也还是同班，group 一样就算同路） ----
- id: primary_study
  label: 上小学 · 学习委员
  group: primary
  requires: { minAge: 6, maxAge: 11, flags: [lead_study] }
  duty: { label: 上学, spot: school_gate, arrive: [420, 540], until: 930, needs: { hunger: 30, energy: -15 }, stats: { mind: 0.34, charm: 0.07 } }
