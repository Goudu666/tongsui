<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<style>
@font-face{font-family:Smiley;src:url(fonts/SmileySans-Oblique.ttf)}
@font-face{font-family:Pix;src:url(fonts/fusion/fusion-pixel-12px-proportional-zh_hans.ttf)}
body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<script src="mats.js"></script><script src="scene.js"></script><script src="r2d.js"></script>
<script>
const q=new URLSearchParams(location.search);
const s=document.createElement('script');s.src='styles/'+q.get('style')+'.js';
s.onload=async()=>{
  await Promise.all(['900 40px "Noto Sans SC"','700 40px "Noto Sans SC"','40px Smiley','12px Pix'].map(f=>document.fonts.load(f,'小卖部河畔茶社修车里奖状12301302')));
  const {env,L}=buildScene(q.get('scene'));
  const c=await render(env,L);
  c.id='out';document.body.appendChild(c);window.DONE=1;
};
document.head.appendChild(s);
</script></body></html>
