# 对门在楼道里接一下：一个刚从医院回来，一个记了两份作业。either 看带 kin_care 的那一个
- id: out_kin_visit
  kind: mirror
  stage: teen
  where: hallway
  when: [1110, 1320]
  hint: 楼道里有人在刷饭盒。
  weight: 4
  requires: { minAge: 13, either: { flags: [kin_care] } }
  title: 两份作业
  text: 晚上楼道里，一个刚从医院回来，饭盒还没刷；一个手里拿着今天的作业，记了两份。
  options:
    - id: tell
      text: 说说医院里的事
      requires: { flags: [kin_care] }
      tags: [gentle]
      effects: { self: { mood: 3 } }
    - id: copy
      text: 把作业摊开讲一遍
      requires: { notFlags: [kin_care] }
      tags: [responsible]
      effects: { self: { mind: 1 }, other: { mind: 1 } }
    - id: wash
      text: 一块儿把饭盒刷了
      tags: [patient]
      effects: { self: { mood: 2 } }
    - id: sit
      text: 在楼梯上坐一会儿
      tags: [solitude]
      effects: { self: { energy: 3 } }
  resonance:
    tell:
      text: 两个人说着说着停住了：说的是同一家医院，同一层楼，开水房的同一个龙头。
      memory: 同一个龙头
      bond: { sync: 3, close: 2 }
    wash:
      text: 水池边两个人挤着，一个刷，一个拿抹布擦干。饭盒盖上刻的字擦得发亮。
      memory: 发亮的饭盒盖
      bond: { sync: 3, close: 2 }
    sit:
      text: 两个人在楼梯上坐着，谁也没提医院。楼道灯灭了，谁也没去跺那一脚。
      memory: 没跺的那一脚
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个把作业搁在门口的凳子上，一个在水池边刷饭盒。刷完了回头，作业还在凳子上。
    bond: { close: 0 }

