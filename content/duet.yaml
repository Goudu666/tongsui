# 「接话」：两个人之间一抛一接的文案和数值。玩法说明见 docs/DUET.md。
# 改完运行 npm run content（和事件一起校验，一起生成进 content.json / content.generated.ts）。
#
# 文案里可以用的占位符：{a} {b} 两个人的名字，{gap} 隔了几个日子，{o} 选项或事件的原文，{x} {y} 次数

# ---------------------------------------------------------------------------
# 一、搭上了：默契事件里两人选得不一样，但一个抛、一个接
#
# 按事件 id 挂上去，可以挂在任何 mirror 事件上，不用改事件文件。pair 不分先后。
# 没写在这里的不同选项组合，仍然算错位。
#   text    48 字以内，写成一来一往，停在一个画面上
#   memory  8 字以内，一样握得住的东西
#   flags   可选，共同标记（p_ 开头），和共鸣的 flags 一样两个人都会得到
# ---------------------------------------------------------------------------
catches:
  c_roof_summer:
    - pair: [stars, popsicle]
      text: 一个躺着数星星，一个举着两根冰棍上来了。数到哪儿不要紧，冰棍先吃。
      memory: 楼顶的冰棍
      bond: { sync: 2, close: 1 }
  c_river_ice:
    - pair: [skate, shore]
      text: 一个在冰上抽冰嘎，一个在岸上给抱着棉袄。棉袄捂热了，人也上来了。
      memory: 捂热的棉袄
      bond: { sync: 2, close: 1 }
  d_kite_tree:
    - pair: [climb, hold]
      text: 一个上树，一个在底下张着手。风筝先下来的，人后下来的，都接住了。
      memory: 都接住了
      bond: { sync: 3, close: 1 }
  d_broken_window:
    - pair: [own, cover]
      text: 一个刚说「是我们俩」，一个抢着说「是我一个人」。马奶奶：「你俩先对对词儿。」
      memory: 没对上的词儿
      bond: { sync: 2, close: 2 }
  d_radio_show:
    - pair: [pick, clap]
      text: 一个往下编，一个在边上「嗯、啊、别挨骂了」。马爷爷说：「行，这俩能上台了。」
      memory: 楼顶那一段
      bond: { sync: 4, close: 1 }
  d_teen_bike:
    - pair: [ride, seat]
      text: 一个蹬，一个坐后座上扶着书包。上桥那段是下来推的，谁也没提。
      memory: 上桥那一段
      bond: { sync: 3, close: 1 }
  d_wheel_steps:
    - pair: [front, back]
      text: 一个前头，一个后头，三级台阶，没人喊一二三。老楼长说：「你俩打小就这么抬白菜。」
      memory: 三级台阶
      bond: { sync: 4, close: 1 }
  d_old_bench:
    - pair: [talk, quiet]
      text: 一个说，一个听。说的那个说岔了年头，听的那个没给纠正。
      memory: 说岔的年头
      bond: { sync: 3, close: 1 }

# ---------------------------------------------------------------------------
# 二、猜 TA：默契事件里选完自己的，再猜对门的选了什么。猜中是「懂」，有方向。
# 结算时旁白多说的那一句。
# ---------------------------------------------------------------------------
lines:
  knew_both_same: 而且谁也不意外。
  knew_both_diff: 没选到一块儿，可谁也没猜错谁。
  knew_one: "{a}猜着了{b}，{b}没猜着{a}。"
  knew_none: 你俩把对方都猜错了，也算扯平。
  knew_single: "{a}猜着了。"

# ---------------------------------------------------------------------------
# 三、回话：一方不在时影子替他选过的默契事件，本人回来后补答
# ---------------------------------------------------------------------------
echo:
  ask: 你不在的那天，是影子替你去的。换了你，你会？
  res: 这句话在半空悬了{gap}，接上了。
  catch: 隔了{gap}，还是搭上了。
  miss: 换了本人，也没选到一块儿。倒省得后悔。
  like: 影子选的也是这个。它学得挺像。
  unlike: 影子替你选的是「{o}」。它还得学。
  knew: "{b}当时猜的就是这个。{b}比影子懂你。"
  kept: 这一回是影子替{b}去的。话先悬着，等本人回来接。
  told: "{b}回了「{o}」那天的话。"

# ---------------------------------------------------------------------------
# 四、一生结束时多出来的几句（接在人生长卷的题词后面）
# last 按顺序取第一条满足的：minRate 是默契率（共鸣和搭上了都算）
# ---------------------------------------------------------------------------
epitaph:
  know: "{a}猜中{b} {x} 回，{b}猜中{a} {y} 回。"
  shadow: 影子替{a}去过 {x} 回，有 {y} 回选得跟本人一样。
  last:
    - { minRate: 70, text: 这二位，对门住了一辈子，正经话没说过几句，话也没掉地上过几回。 }
    - { minRate: 40, text: 这二位，一个抛的另一个不一定接得住，可回回都伸手了。 }
    - { minRate: 0, text: 这二位，各说各的说了一辈子，倒也没耽误当对门。 }
