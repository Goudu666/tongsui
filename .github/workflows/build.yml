name: build

# push 到 main / 开 PR：测服务端 + 端到端联机 + 部署脚本冒烟 + 出 APK（Artifacts 下载）
# 打 tag（git tag v0.2.0 && git push --tags）：再额外发一个 GitHub Release，APK 挂在上面
#
# 仓库里可选的配置（Settings → Secrets and variables → Actions），全不填也能出能装的调试包：
#   Variables  TONGSUI_SERVER             部署脚本最后打印的那段 JSON，打进 APK 当默认服务器
#   Secrets    ANDROID_KEYSTORE_BASE64    正式签名，tools/make_release_keystore.sh 生成
#              ANDROID_KEYSTORE_PASSWORD
#              ANDROID_KEY_ALIAS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: 服务端 · 构建 / 单测 / 真 Nakama 冒烟
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nakama
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 内容校验，并确认生成文件已提交
        run: |
          npm ci && npm run content
          git diff --exit-code -- client/data server/src/content.generated.ts || (echo "请运行 npm run content 并提交生成的文件" && exit 1)
      - name: 构建 + 单测
        working-directory: server
        run: npm install --no-audit --no-fund && npm test
      - name: 在真实 Nakama 里加载模块并调用 RPC
        run: |
          docker run -d --name nakama --network host \
            -v "$PWD/server/build:/nakama/data/modules:ro" \
            -v "$PWD/deploy/nakama/local.yml:/nakama/data/local.yml:ro" \
            --entrypoint /bin/sh heroiclabs/nakama:3.41.0 -ecx \
            "/nakama/nakama migrate up --database.address postgres:ci@127.0.0.1:5432/nakama && exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:ci@127.0.0.1:5432/nakama"
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:7350/healthcheck && break; sleep 2; done
          docker logs nakama 2>&1 | tee nakama.log | grep "server module loaded"
          TOKEN=$(curl -fsS -u defaultkey: -H 'Content-Type: application/json' \
            -d '{"id":"ci-device-000001"}' "http://127.0.0.1:7350/v2/account/authenticate/device?create=true" | jq -r .token)
          curl -fsS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '"{\"name\":\"ci\"}"' http://127.0.0.1:7350/v2/rpc/lifeline_create | tee rpc.json
          jq -e '.payload | fromjson | .code | length == 6' rpc.json
      - name: 联机端到端（两个机器人：配对、并发开房、同框走动、断线重连）
        run: npm --prefix server run e2e
      - name: Nakama 日志
        if: failure()
        run: docker logs nakama || true
      - uses: actions/upload-artifact@v4
        with:
          name: server-module
          path: server/build/index.js

  e2e:
    name: 端到端 · 两个真 Godot 客户端联机
    needs: server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: server-module
          path: server/build
      - name: 拉 nakama-godot 插件
        run: bash tools/fetch_addons.sh --no-font
      - name: 开线 → 配对 → 进房间 → 重抽 → 投胎 → 收到实时世界
        run: bash tools/ci/e2e_online.sh

  deploy:
    name: 部署 · 一键安装脚本冒烟（HTTPS / 登录 / 备份恢复 / 更新）
    needs: server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: server-module
          path: server/build
      - name: 用 localhost 自签证书把 install.sh 全流程跑一遍
        run: bash deploy/ci-smoke.sh --module server/build/index.js

  android:
    name: 客户端 · 导出 Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    outputs:
      apk_name: ${{ steps.apk.outputs.apk_name }}
      signing: ${{ steps.apk.outputs.signing }}
    steps:
      - uses: actions/checkout@v5
      - name: 版本号
        id: ver
        run: |
          # versionCode 只增不减，手机上才能覆盖安装；tag v1.2.3 → 1.2.3，其他 → 0.1.<序号>
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then name="${GITHUB_REF_NAME#v}"; else name="0.1.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: 打包（插件 / 字体 / 服务器地址 / 冒烟测试 / 签名）
        id: apk
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          TONGSUI_SERVER: ${{ vars.TONGSUI_SERVER }}
          # PR 里拿不到 Secrets，会自动退回调试签名
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash tools/ci/build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk }}
          compression-level: 0 # APK 本身就是压缩包
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-logs
          path: |
            build/*.log
            build/signature.txt
          if-no-files-found: ignore

  release:
    name: 发布 · GitHub Release
    if: github.ref_type == 'tag'
    needs: [server, e2e, deploy, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android.outputs.apk_name }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: server-module
          path: dist
      - name: 发 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 同岁 ${{ github.ref_name }}
          files: |
            dist/*.apk
            dist/index.js
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.android.outputs.signing != 'release' }}
