# 人生关口。到了年纪的那天早上一定发生，两个人同时面对、各自私下选。
#
# 和普通事件不同的地方：
#   age     到这个年纪的第一天发生
#   score   怎么算分：各项属性乘权重相加（money = 积蓄，close = 两个人的亲近；这两样按原数显示，不算发挥）。界面上常驻显示离每条线还差多少
#   swing   考试有发挥：得分随手气和运气上下浮动一点（约 ±0.3）。手气差的那一半按默契托住一些（rules.yaml 的 bond.syncSteady）
#   grades  成绩档（事实）：从高到低取第一个够得着的，给标记
#   options 能走的路（选择）：min 是这条路的分数线，不够的选项是灰的；score 可以单独写这条路看什么；
#           cost 是选了以后花掉的积蓄。只剩一条路可走时不弹窗，直接记进长卷
#   resonance / dissonance 两个人选了同一条路 / 不同的路
#
# 选项只管打标记，日程由 content/tracks.yaml 按标记决定。
# 考上了也可以不去：分数够不够是一回事，走不走是另一回事。
#
# 家境（docs/MEANS.md）：带 requires 的路只给某种人家留着。
#   lock   标记不对的人看到的那句（「家里拿不出这笔钱」）：路摆在那儿，灰着，知道有这么条路
#   joins  和哪条路是同一条：交钱进的重点班和考进去的同班，两个人一个交钱一个考，也算同路
# 殷实人家花钱买的路照样有线，只是低一些，钱从自己的积蓄里扣：花在念书上，三十岁安家就少了这一截。
# 清贫人家自己的路（接班、分房、当兵）线低或者不看分，可往后挣得也少。挂了标记的路不当兜底（lifeMilestoneFallback）。
# 分数线是这个游戏最要紧的数值，改之前跑一遍 node tools/paths.mjs 看各种活法落在哪。

- id: m_school
  kind: milestone
  stage: childhood
  age: 6
  title: 上小学
  text: 新书包比你的背还宽。头一天，老师让每个人上讲台站一会儿：念黑板上的字，绕操场跑一圈，再唱两句。她要挑三个小干部。
  options:
    - id: study
      text: 当学习委员，收作业本
      score: { mind: 1 }
      min: 5.5
      tags: [competitive]
      effects: { flags: [in_school, lead_study] }
    - id: sport
      text: 当体育委员，喊队
      score: { body: 1 }
      min: 5.5
      tags: [adventure]
      effects: { flags: [in_school, lead_sport] }
    - id: art
      text: 当文艺委员，起头唱歌
      score: { charm: 1 }
      min: 5.3
      tags: [gentle]
      effects: { flags: [in_school, lead_art] }
    - id: go
      text: 坐回自己的座位
      tags: [patient]
      effects: { flags: [in_school] }
  resonance:
    study:
      text: 两个人都举了手，老师想了想，一个管收，一个管发。作业本从你手里出去，从 TA 手里回来。
      memory: 一个收一个发
      bond: { sync: 2, close: 2 }
    sport:
      text: 一个喊「立正」，一个喊「稍息」。全班站得乱七八糟，你们俩站得最直。
      memory: 立正，稍息
      bond: { sync: 2, close: 2 }
    art:
      text: 起头的是你们俩，起的不是一个调。全班跟着唱成了两截，老师笑得直不起腰。
      memory: 起了两个调
      bond: { sync: 2, close: 2 }
    go:
      text: 两扇门是同时开的。两个新书包，一前一后下了楼，坐进了前后桌。
      memory: 两个新书包
      bond: { sync: 1, close: 2 }
  dissonance:
    text: 一个站在讲台边上，一个坐在底下。放学的时候，底下的那个等在门口，替讲台上的那个拿着书包。
    bond: { close: 1 }

# 三年级：放学以后的那两个钟头交给谁。选了哪个，哪个地方下午就多一件只有你们能做的事（content/map.yaml 的 club_*），
# 长得比自己练快；两个人进同一个，下午就能搭伴。只能进一个。
- id: m_club
  kind: milestone
  stage: childhood
  age: 9
  title: 三年级
  text: 少年宫的老师来学校挑人，体校的教练在操场边上站了一下午，数学老师在黑板上留了一道没人会的题。放学以后的那两个钟头，要交给一个地方了。
  options:
    - id: math
      text: 进数学小组
      score: { mind: 1 }
      min: 6.6
      tags: [competitive]
      effects: { flags: [club_math] }
    - id: sport
      text: 进体校的少年班
      score: { body: 1 }
      min: 6.4
      tags: [adventure]
      effects: { flags: [club_sport] }
    - id: art
      text: 进少年宫的曲艺队
      score: { charm: 1 }
      min: 6.0
      tags: [gentle]
      effects: { flags: [club_art] }
    - id: none
      text: 哪儿也不去，放了学就回家
      tags: [solitude]
      effects: { self: { mood: 5 } }
  resonance:
    math:
      text: 那道没人会的题，你们俩在一张草稿纸上算了三天。算出来那天，纸的正反面都写满了。
      memory: 写满正反面的草稿纸
      bond: { sync: 3, close: 2 }
    sport:
      text: 教练让新来的先跑十圈。跑到第七圈，谁也没先停。
      memory: 第七圈
      bond: { sync: 3, close: 2 }
    art:
      text: 一副快板拆成两半，一人一片。两片合起来才打得响。
      memory: 一人一片快板
      bond: { sync: 3, close: 2 }
    none:
      text: 三点半，校门口，你们俩是头一拨出来的。太阳还高，哪儿都来得及去。
      memory: 头一拨出校门
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 放了学，一个往操场走，一个往校门外走。走到一半都回了一下头。
    bond: { close: -2 }

- id: m_junior
  kind: milestone
  stage: teen
  age: 12
  score: { mind: 1 }
  swing: true
  requires: { notFlags: [dropout] }
  title: 小升初
  text: 分班的名单贴在校门口的红纸上。重点班在最上面一栏，放学比别的班晚一个半钟头。
  options:
    - id: key
      text: 去重点班
      min: 7.0
      tags: [competitive]
      effects: { flags: [junior_key] }
    - id: paid
      text: 家里交了钱，进重点班
      min: 6.5
      cost: 20
      requires: { flags: [fam_rich] }
      lock: 家里拿不出这笔钱
      joins: key
      tags: [competitive]
      effects: { flags: [junior_key, junior_paid] }
    - id: normal
      text: 去普通班
      tags: [gentle]
      effects: { self: { mood: 4 } }
  resonance:
    key:
      text: 两个名字都在最上面那一栏，中间隔着三个人。放学晚了，可是一块儿晚。
      memory: 最上面那一栏
      bond: { sync: 2, close: 2 }
    normal:
      text: 三点半，校门口，还是你们俩。
      memory: 三点半的校门口
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 一个三点半放学，一个要上到五点。先出来的那个，在校门口的台阶上多坐了一会儿。
    bond: { close: -3 }

- id: m_senior
  kind: milestone
  stage: teen
  age: 15
  score: { mind: 1 }
  swing: true
  requires: { notFlags: [dropout] }
  title: 中考
  text: 志愿表发下来了。市里的重点高中在河对岸，天不亮就得过桥；家门口的高中走路十分钟；职专下午三点就放学。
  options:
    - id: far
      text: 过桥去念重点高中
      min: 7.2
      tags: [competitive]
      effects: { bond: { distance: 1 }, flags: [school_far] }
    - id: paid
      text: 交择校费，过桥上重点
      min: 6.8
      cost: 35
      requires: { flags: [fam_rich] }
      lock: 家里拿不出择校费
      joins: far
      tags: [competitive]
      effects: { bond: { distance: 1 }, flags: [school_far, school_paid] }
    - id: near
      text: 念家门口的高中
      min: 5.8
      tags: [gentle]
      effects: { flags: [school_near] }
    - id: vocational
      text: 念职专，早点学本事
      tags: [responsible]
      effects: { flags: [vocational] }
  resonance:
    far:
      text: 天不亮，桥上只有两辆自行车。风大，谁也没说话，蹬得一样快。
      memory: 桥上两辆车
      bond: { sync: 3, close: 2 }
    near:
      text: 还是那条路，还是十分钟。校服换了个颜色，别的没换。
      memory: 还是那条路
      bond: { sync: 2, close: 2 }
    vocational:
      text: 三点钟放学，太阳还高。你们推着车往回走，说以后合伙开个铺子。
      memory: 三点钟的太阳
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 一个往桥那边去，一个往胡同里拐。早上出门的钟点不一样了，楼道里碰不上了。
    bond: { close: -3 }

- id: m_gaokao
  kind: milestone
  stage: young
  age: 18
  score: { mind: 1 }
  swing: true
  requires: { notFlags: [dropout, vocational] }
  title: 高考
  text: 分数出来了，志愿表摊在饭桌上。最远的那所学校，坐火车要一天一夜。
  grades:
    - { min: 6.8, label: 过了本科线, flags: [gaokao_good] }
    - { min: 0, label: 没过线, flags: [gaokao_bad] }
  options:
    - id: away
      text: 去外地念大学
      min: 8.3
      tags: [adventure, competitive]
      effects: { bond: { distance: 2 }, flags: [uni_away] }
    - id: abroad
      text: 家里送你出国念书
      # 比考外地（8.3）低半分多，留给差一口气的人。6.3 的时候等于花钱买了最好的那所大学（玩法评审）
      min: 7.7
      cost: 60
      requires: { flags: [fam_rich] }
      lock: 家里供不起
      tags: [adventure]
      effects: { bond: { distance: 3 }, flags: [uni_abroad] }
    - id: local
      text: 念本市的大学
      min: 6.8
      tags: [gentle]
      effects: { flags: [uni_near] }
    - id: army
      text: 报名去当兵
      score: { body: 1 }
      min: 5.8
      requires: { notFlags: [fam_rich] }
      lock: 家里舍不得
      tags: [responsible, adventure]
      effects: { bond: { distance: 2 }, flags: [army] }
    - id: work
      text: 不念了，找活干
      tags: [responsible]
      effects: { flags: [work_early] }
  resonance:
    away:
      text: 两张火车票，两个方向。你们在站台上对了对表，说好寒假同一天回来。
      memory: 对过的表
      bond: { sync: 3, close: 1 }
    local:
      text: 两所学校隔着四站地。周末回河畔里，还是从同一个楼门进去。
      memory: 四站地
      bond: { sync: 2, close: 2 }
    abroad:
      text: 两个人坐同一班飞机走的。落地以后，一个往东，一个往西，隔着一个时区写信。
      memory: 同一班飞机
      bond: { sync: 3, close: 1 }
    army:
      text: 胸口戴着同一种红花，坐上同一趟车。车开了，楼里的人还站在路口。
      memory: 同一种红花
      bond: { sync: 3, close: 2 }
    work:
      text: 第一个月的工钱，你们一人买了一双新鞋，在楼下比了比谁的贵。
      memory: 两双新鞋
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 一个去车站，一个去上工。同一个早上出的门，往两头走的。
    bond: { close: -3 }

- id: m_job
  kind: milestone
  stage: young
  age: 22
  requires: { notFlags: [left_city] }
  title: 找个正经事由
  text: 该定下来了。干哪一行，往后几十年每天几点出门、几点回来，就都跟着定了。
  options:
    - id: desk
      text: 过桥去坐办公室
      score: { mind: 1 }
      min: 8.2
      tags: [competitive]
      effects: { flags: [job_desk] }
    - id: pull
      text: 托家里的关系进单位
      # 自己一份营生（tracks.yaml 的 job_pull），不算考进去的办公室：一天少几块，往后三道要钱的关不跟着坐办公室走。
      # 魅力只占四成：占六成的时候嘴甜的殷实孩子 85% 进得去，同样嘴甜的小康 19%，成了「魅力换办公室」（玩法评审）。
      # 时间切段（#23）以后人长得快一些，7.8 时嘴甜殷实 57% 对小康 30%，抬到 8.0（means.test 钉着差不超过 15 个点）
      score: { mind: 0.6, charm: 0.4 }
      min: 8.0
      cost: 15
      requires: { flags: [fam_rich] }
      lock: 家里没有这层关系
      tags: [competitive]
      effects: { self: { mood: -3 }, flags: [job_pull] }
    - id: teach
      text: 回小学教书
      score: { mind: 0.6, charm: 0.4 }
      min: 6.8
      tags: [patient]
      effects: { flags: [job_teach] }
    - id: trade
      text: 在街口支个摊，做买卖
      score: { charm: 0.7, luck: 0.3 }
      min: 6.9
      tags: [adventure]
      effects: { flags: [job_trade] }
    - id: craft
      text: 学一门手艺
      score: { body: 0.5, mind: 0.5 }
      min: 6.4
      tags: [patient, responsible]
      effects: { flags: [job_craft] }
    - id: labor
      text: 去码头卖力气
      score: { body: 1 }
      min: 6.0
      tags: [responsible]
      effects: { flags: [job_labor] }
    - id: succeed
      text: 接爸妈的班，进厂
      requires: { flags: [fam_factory] }
      lock: 家里没人在厂里
      tags: [responsible]
      effects: { flags: [job_succeed] }
    - id: placed
      text: 退伍安置，进厂
      requires: { flags: [army] }
      lock: 没当过兵
      joins: succeed
      tags: [responsible]
      effects: { flags: [job_succeed, army_placed] }
    - id: odd
      text: 先打零工
      tags: [solitude]
      effects: { flags: [job_odd] }
  resonance:
    desk:
      text: 同一趟早班车，一个在第三站下，一个在第五站下。
      memory: 同一趟早班车
      bond: { sync: 2, close: 2 }
    teach:
      text: 当年你们坐过的那间教室，现在一人教一个班。
      memory: 一人一个班
      bond: { sync: 3, close: 2 }
    trade:
      text: 两个摊子挨着，一把遮阳伞底下，谁先卖完谁帮另一个吆喝。
      memory: 一把遮阳伞
      bond: { sync: 3, close: 2 }
    craft:
      text: 一个铺子，两条板凳，师傅说你们俩一个手稳一个手快。
      memory: 两条板凳
      bond: { sync: 3, close: 2 }
    labor:
      text: 一根杠子两头抬，走了一天，步子是一样的。
      memory: 一根杠子
      bond: { sync: 3, close: 2 }
    pull:
      text: 两家托的是同一个人。报到那天在传达室碰上了，谁也没问对方是怎么进来的。
      memory: 传达室
      bond: { sync: 2, close: 1 }
    succeed:
      text: 同一个厂门，同一种蓝工装。下了班在澡堂门口等，谁先出来谁去买汽水。
      memory: 两身蓝工装
      bond: { sync: 3, close: 2 }
    odd:
      text: 今天有活，明天没活。没活的那天，你们在河边坐一下午。
      memory: 没活的下午
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 一个出门早，一个回来晚。对门的灯，各亮各的钟点。
    bond: { close: -3 }

- id: m_settle
  kind: milestone
  stage: middle
  age: 30
  score: { money: 1 }
  title: 安家
  text: 三十了。这些年攒下的钱都在存折上，够不够给自己安一个地方？
  options:
    - id: buy
      text: 买下一套自己的房
      # 成年后歇班那年工钱照发以后，三十岁的积蓄整体多了四成，线跟着从 150 抬到 200（tools/paths.mjs 校准）
      min: 200
      cost: 200
      tags: [responsible]
      effects: { self: { mood: 15 }, flags: [home_own] }
    - id: help
      text: 爸妈出首付，买了房
      # 爸妈出五十块。线再低，三十岁买不买得起房就几乎只看投胎了（tools/paths.mjs：殷实不上心的人 130 时九成有房）
      min: 150
      cost: 150
      requires: { flags: [fam_rich] }
      lock: 爸妈帮不上
      joins: buy
      tags: [responsible]
      effects: { self: { mood: 10 }, flags: [home_own, home_help] }
    - id: unit
      text: 等到了厂里分的房
      min: 40
      cost: 40
      requires: { flags: [job_succeed] }
      lock: 单位不分房
      joins: buy
      tags: [patient]
      effects: { self: { mood: 12 }, flags: [home_own, home_unit] }
    - id: rent
      text: 在附近租一间
      min: 100
      cost: 100
      tags: [adventure]
      effects: { self: { mood: 6 }, flags: [home_rent] }
    - id: stay
      text: 还住老屋
      tags: [gentle]
      effects: { flags: [home_old] }
  resonance:
    buy:
      text: 钥匙是同一天拿的。新楼没有楼道灯，你们各自在门口装了一盏。
      memory: 两盏门灯
      bond: { sync: 2, close: 2 }
    rent:
      text: 搬家那天互相搭了把手。东西都不多，一趟就完了。
      memory: 一趟就搬完
      bond: { sync: 2, close: 2 }
    stay:
      text: 还是三楼，还是对门。暖气片还是那么烫手。
      memory: 还是对门
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 一个搬走了，一个留下了。留下的那个，有时候还会朝对面那扇门看一眼。
    bond: { close: -3 }

# 四十五岁：前半辈子攒下的三样东西（身体、本事、钱）各能换一样。只够顾好一头。
# 三条路都接着七十岁那一关：身体接「自己下楼」，位子多挣的钱接「请人照应」，花在家里的接「搭伙过」。
- id: m_midlife
  kind: milestone
  stage: middle
  age: 45
  title: 四十五
  text: 体检单上多了两个箭头，单位里空出来一个位子，家里的老人要住院。三件事是同一个礼拜到的，力气只够顾好一头。
  options:
    - id: post
      text: 去争那个位子
      score: { mind: 0.5, charm: 0.5 }
      min: 7.4
      tags: [competitive]
      effects: { self: { mood: 6 }, flags: [mid_post] }
    - id: home
      text: 把钱和工夫都花在家里
      score: { money: 1 }
      min: 110
      cost: 110
      tags: [responsible]
      effects: { self: { mood: 10 }, other: { mood: 4 }, bond: { close: 8 }, flags: [mid_home] }
    - id: fit
      text: 先把身体捡起来
      tags: [patient]
      effects: { self: { body: 2, mood: 4 }, flags: [mid_fit] }
  resonance:
    post:
      text: 两个人都升了一级，都搬进了有窗户的那间屋。晚上回来得更晚了，可是楼道里的灯，后回来的那个总看见还亮着。
      memory: 留着的楼道灯
      bond: { sync: 2, close: 1 }
    home:
      text: 医院的走廊里，你们一人守上半夜，一人守下半夜。交班的时候谁也不说话，把暖壶递过去。
      memory: 递过去的暖壶
      bond: { sync: 3, close: 3 }
    fit:
      text: 早上六点，河边多了两个跑不动的人。跑一段，走一段，一个月以后，能一口气到桥头了。
      memory: 一口气到桥头
      bond: { sync: 3, close: 3 }
