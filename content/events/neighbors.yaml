# ===================== 傅家 · 扎风筝的（fam_kite） =====================

- id: f_fu_eyes
  kind: mirror
  stage: childhood
  where: river
  when: [600, 1080]
  hint: 河边有只风筝，还没画眼睛。
  seasons: [spring]
  weight: 3
  requires: { minAge: 5, flags: [fam_kite] }
  title: 点睛
  text: 傅家爷爷扎了一辈子风筝。这只燕子，竹篾劈得比挂面还细，就差眼睛。他把笔一递：「点睛这一笔，手不能抖。你们俩，谁来？」
  options:
    - id: take
      text: 接过笔
      tags: [adventure]
      effects: { self: { mood: 5 }, flags: [fu_kite] }
    - id: hold
      text: 「你点，我给你扶着。」
      tags: [gentle]
      effects: { self: { mood: 5 }, flags: [fu_kite] }
    - id: back
      text: 「爷爷，还是您来吧。」
      tags: [responsible]
      effects: { self: { mind: 1 } }
  resonance:
    take:
      text: 两只手攥着一支笔点了下去：一只眼大，一只眼小。爷爷端详半天：「行。像是冲人挤眼睛。」
      memory: 挤眼睛的燕子
      bond: { sync: 4, close: 3 }
    hold:
      text: 都伸手去扶，没人拿笔。爷爷自己拿起笔，把你们俩的手按在风筝上。那两个黑点，算三个人点的。
      memory: 三个人点的睛
      bond: { sync: 3, close: 3 }
  dissonance:
    text: 一个点，一个扶。扶的比点的还紧张，把竹篾攥出了一道印儿。爷爷看了看，没换，就这么糊上了纸。
    bond: { close: 1 }

