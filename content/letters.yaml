# 写信：一个人去了外地（念书、出国、当兵、上班），两个人就分在两张图上，互相看不见。
# 在外地车站边的邮局、楼下小卖部门口的邮筒「写信」，信第二天早上到对门手里（出国的多走一天）。
# 规则在 server/src/post.ts：一封信两句近况 + 一句结尾，按写信的人那时候在过的日子挑；
# 同一个人写的信按顺序轮着用，一轮写完才重复。改完运行 npm run content。
#
# 写法（见 docs/tianjin_style.md）：一句一个看得见的东西，22 字以内；不抒情、不说「想你」，
# 想念藏在问的那件小事里。外地那座城不叫名字，口音、吃的、天气写差别就行。

# 写信的人那时候在过的日子 → 两句近况从哪一组挑。路线 id 见 content/tracks.yaml；
# 没写到的路线：人在外地用 work，人在河畔里用 home
lines:
  uni_away:
    - 宿舍楼下有棵树，叫不出名字，开的花有点像槐花。
    - 食堂的馒头是甜的，吃了一个月也没吃惯。
    - 这边下雨不打雷，一下就是好几天。
    - 图书馆十点关门，我总是最后几个走的。
    - 这边的人说话快，我学了两句，一说他们就笑。
    - 上课的教室比咱们中学的礼堂还大。
    - 生活费还剩一点，在旧书摊买了一本书。
    - 社团里有人会拉胡琴，拉的调子我在茶社听过。
  uni_abroad:
    - 这边比家里晚好几个钟头，我写信的时候你那边睡了。
    - 超市里找不着挂面，拿别的面凑合。
    - 同屋的人问我家在哪儿，我在纸上画了一条河。
    - 这边的冬天天黑得早，下午四点就点灯。
    - 上课听不全，我录下来晚上再听一遍。
    - 学校边上有座桥，比咱们那座铁桥新，不好看。
  army:
    - 早上五点半吹哨，被子要叠成方块，我叠了三回才过。
    - 班长是南方人，吃饭不放醋。
    - 晚上站岗，天上的星星比楼顶上看得多。
    - 发了一双新鞋，磨脚，过几天就好了。
    - 跑五公里，我跑在中间。
    - 连里有个人也会下棋，下不过楼下的大爷。
  work:
    - 这个月加了几天班，工钱多了一点。
    - 住的地方离上班的地方要坐四站车。
    - 楼下有家面馆，老板记得我不要香菜。
    - 过年的票还没抢着，再等等。
    - 同事问我老家在哪儿，我说在一条河边上。
    - 屋里没有暖气，晚上灌个热水袋。
    - 窗户对着别人家的窗户，那家天天炖肉。
  home:
    - 楼下的早点铺换了招牌，味道没变。
    - 你家窗台上那盆花，你妈天天浇。
    - 修车的爷爷问你什么时候回来。
    - 楼道的灯又坏了，楼长说过两天修。
    - 今年冬天暖气来得早。
    - 楼顶的鸽子少了几只，大爷说是飞丢了。
    - 我还是每天走那条路，路边的树又高了一截。
    - 河边新修了一段栏杆，刷的绿漆。
    - 小卖部的阿姨问起你，我说你挺好的。

# 一封信的最后一句。in：写信的人在外地（away）还是在河畔里（home），不写就两边都用
ends:
  - { text: 先写到这儿。 }
  - { text: 你那边冷不冷？ }
  - { text: 回信寄到老地方。, in: away }
  - { text: 早点别老买着吃。 }
  - { text: 等你回来。, in: home }
  - { text: 有空写信。 }
  - { text: 替我看看楼顶的鸽子。, in: away }
  - { text: 过年回来吗？, in: home }

# 两个人同一天都写了信，第二天早上各收一封：长卷上多一句
crossed: 两封信在路上错过去了，说的差不多是同一件事。
