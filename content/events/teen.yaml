  weight: 2
  requires: { minAge: 16 }
  title: 对岸的高楼
  text: 海河对岸起了第一栋高楼，楼顶一闪一闪地亮着红灯。你们骑车走在堤岸上，风把校服吹得鼓鼓的。
  options:
    - id: count
