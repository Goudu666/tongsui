# ======================== D. 街坊 ========================

- id: c_street_supper
  kind: solo
  stage: childhood
  weight: 2
  requires: { minAge: 7, maxAge: 11, flags: [fam_poor] }
  title: 一碗粥
  text: 你妈上夜班，锅是凉的。二门的婶子隔着窗户喊你下去，给你盛了一碗粥，又夹了两筷子咸菜。
  options:
    - id: wash
      text: 吃完把碗洗了送回去
      tags: [responsible]
      effects: { self: { charm: 0.1, mood: 4, hunger: 20 } }
    - id: home
      text: 端回家慢慢吃
      tags: [solitude]
      effects: { self: { mood: 2, hunger: 20 } }
    - id: no
      text: 说吃过了
      tags: [patient]
      effects: { self: { mood: -2 } }

- id: c_street_help
  kind: solo
  stage: middle
  weight: 4
  requires: { minAge: 31, maxAge: 59, flags: [tie_street], notFlags: [owe_street] }
  title: 一沓钱
  text: 家里老人住了院。楼里知道了，这家五块那家十块，二门的婶子挨家收齐，装在信封里送上门。
  options:
    - id: take
      text: 收下，记在本子上
      tags: [responsible]
      effects: { self: { mood: 3 }, money: 15, drop: [tie_street], flags: [owe_street] }
    - id: thank
      text: 收下，挨家去道谢
      tags: [gentle]
      effects: { self: { charm: 0.1, energy: -10, mood: 2 }, money: 15, drop: [tie_street], flags: [owe_street] }
    - id: no
      text: 谢了，不要
      tags: [solitude]
      effects: { self: { mood: -2 } }

