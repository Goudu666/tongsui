  requires: { minAge: 16, flags: [leg_p_kid_uni] }
  title: 旧喜报
  text: 楼下信报箱后头夹着一张红纸。抽出来，是一张喜报，「考取」两个字还认得，名字让雨洇没了。
  options:
    - id: keep
      text: 叠好夹进课本
      tags: [patient]
      effects: { self: { mind: 1 } }
    - id: back
      text: 原样塞回去
      tags: [gentle]
      effects: { self: { mood: 5 } }
    - id: ask
      text: 拿去问楼长
      tags: [responsible]
      effects: { self: { mood: 3 } }
