  text: 腊月二十几，家家在楼道里支油锅，炸丸子，炸藕夹。谁家炸什么，全楼的鼻子都知道。两家大人同时招手：「过来，尝尝咸淡。」
  options:
    - id: own
      text: 就着锅边吃头一个
      tags: [adventure]
      effects: { self: { hunger: 10, mood: 8 } }
    - id: swap
      text: 端一碗去换对门的
      tags: [gentle]
      effects: { self: { mood: 3 }, other: { hunger: 10, mood: 5 } }
    - id: both
      text: 两家的都偷着吃
      tags: [competitive]
      effects: { self: { hunger: 20, mood: 5 } }
  resonance:
    swap:
      text: 两只碗在楼道中间碰了头。这家咸，那家淡，掺一块儿正好。后来两家炸东西，就支一口锅。
      memory: 一口锅
      bond: { sync: 3, close: 4 }
    own:
      text: 都烫了舌头，隔着楼道互相吐着舌头扇风。大人问咸淡，一个字也没问出来。
      memory: 烫了的舌头
      bond: { sync: 3, close: 2 }
    both:
      text: 两个笸箩都下去了一半。没挨打：年根儿底下不兴打孩子。这笔账，记到了正月十六。
      memory: 记到十六的账
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个端着碗来换，对门那个鼓着腮帮子，碗已经空了。「等会儿，下一锅给你。」
    bond: { close: -1 }

