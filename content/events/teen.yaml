      tags: [patient]
      effects: { self: { mind: 1 } }
    - id: race
      text: 比谁先骑上铁桥
      tags: [competitive]
      effects: { self: { body: 1, energy: -8 } }
    - id: hands
      text: 撒开把骑
      tags: [adventure]
      effects: { self: { mood: 10, clean: -10 } }
  resonance:
    count:
      text: 你们数出来的层数不一样，在桥头争了半天。后来才知道，那楼还没盖完。
      memory: 没盖完的楼
      bond: { sync: 3, close: 3 }
    race:
      text: 两辆车几乎同时冲上铁桥，桥板咣当咣当地响。你们喘得说不出话，光剩下笑。
