# 河畔里的人家。开局两位玩家各抽一户，两户永远是对门（不会抽到同一户）。
# wealth: 0 清贫 / 1 小康 / 2 殷实 —— 影响家底（money）、饭菜带来的心情，以及能走哪些路。
#         殷实人家必须带 fam_rich，清贫人家必须带 fam_poor，小康两个都不带（build-content 校验）。
#         内容里读家境一律用这两个标记：小康写 notFlags: [fam_rich, fam_poor]。
#         家境差在哪见 docs/MEANS.md：殷实的能花钱买路（补习、择校、出国、托关系），清贫的有自己的路（帮家里、接班、分房、当兵），
#         两样都不替人长本事，线照样要自己够。
#         殷实人家的 money 只比小康多二三十块：家里的钱不直接存进你的存折，要花在那几条路上才看得见（原来是 90~120，
#         三十岁买房几乎不看活法）。
# bonus: 先天属性加成（body 体魄 / mind 心智 / charm 魅力 / luck 运气）
# traits: 家庭标记，事件可以用 requires.flags 读取
# desc: 每户写一个日常细节，再写一样摸得着的东西

- id: chen
  name: 陈家 · 自行车铺
  wealth: 1
  weight: 3
  money: 30
  desc: 你爸在楼下修了二十年车，一手机油洗不出来了。车有毛病，他先拿耳朵听。你妈在纺织厂倒三班。
  bonus: { body: 1 }
  traits: [fam_handy, fam_factory]

- id: lin
  name: 林家 · 教书先生
  wealth: 1
  weight: 3
  money: 25
  desc: 爸妈都是小学老师。家里书比碗多，规矩比书多。楼里的孩子路过你家门口，嗓门自动小一半。
  bonus: { mind: 2, charm: -1 }
  traits: [fam_strict]

- id: zhou
  name: 周家 · 早点铺
  wealth: 1
  weight: 3
  money: 35
  desc: 楼下的煎饼果子摊是你家的。天不亮爸妈就起来磨绿豆面，全楼都是闻着你家的味儿醒的。
  bonus: { charm: 1 }
  traits: [fam_breakfast]

- id: xu
  name: 许家 · 跑海运
  wealth: 2
  weight: 2
  money: 55
  desc: 你爸在船上跑远洋，一年回来两趟，带回些街坊叫不上名儿的洋玩意儿。挂历上的红圈是你画的。
  bonus: { luck: 1 }
  traits: [fam_rich, fam_father_away]

- id: he
  name: 何家 · 姥姥带大
  wealth: 0
  weight: 2
  money: 5
  desc: 爸妈在外地打工，你跟着姥姥过。姥姥不识字，肚子里有一百个故事，讲一个，择完一把韭菜。
  bonus: { charm: 1, luck: 1 }
  traits: [fam_grandma, fam_poor]

- id: su
  name: 苏家 · 裁缝铺
  wealth: 1
  weight: 2
  money: 30
  desc: 你妈的裁缝铺里挂满别人的新衣裳。她量人不用尺，搭一眼就有数。你的衣裳是这片儿最合身的。
  bonus: { charm: 1, luck: 1 }
  traits: [fam_tailor]

- id: tang
  name: 唐家 · 南方搬来的
  wealth: 2
  weight: 2
  money: 60
  desc: 刚从南方搬来，口音跟全楼都不一样。楼里的孩子起先不大跟你玩。
  bonus: { mind: 1, charm: -1 }
  traits: [fam_rich, fam_outsider]

- id: wu
  name: 吴家 · 钢厂双职工
  wealth: 0
  weight: 2
  money: 8
  desc: 爸妈都在钢厂三班倒，回家倒头就睡。你脖子上挂着钥匙，很早就会自己热饭，也很早就不爱吭声。
  bonus: { body: 2 }
  traits: [fam_poor, fam_independent, fam_factory]

- id: gu
  name: 顾家 · 说相声的
  wealth: 1
  weight: 2
  money: 20
  desc: 你爸晚上在茶馆说相声，白天对着墙练贯口。你是听着包袱长大的，三岁就会接下茬。
  bonus: { charm: 2 }
  traits: [fam_crosstalk]

- id: jiang
  name: 江家 · 四口挤一间
  wealth: 0
  weight: 2
  money: 6
  desc: 上头一个哥，下头一个妹，一间屋四张嘴。什么都得抢，抢慢了就没了。可你家从来不冷清。
  bonus: { luck: 2 }
  traits: [fam_poor, fam_siblings]

- id: zhao
  name: 赵家 · 楼长家
  wealth: 1
  weight: 2
  money: 25
  desc: 你爸是楼长，腰上挂着全楼的钥匙。谁家漏水，谁家欠电费，谁在楼道多码了两棵白菜，他都有数。
  bonus: { mind: 1, charm: 1, luck: -1 }
  traits: [fam_head]

- id: ma
  name: 马家 · 楼顶鸽子棚
  wealth: 0
  weight: 2
  money: 6
  desc: 你爷爷在楼顶搭了个鸽子棚，三十多只，个个有名字。家里的钱一半买了鸽粮，他说值。
  bonus: { luck: 1, body: 1 }
  traits: [fam_pigeon, fam_poor]

- id: meng
  name: 孟家 · 开出租的
  wealth: 1
  weight: 2
  money: 28
  desc: 就你爸一个人带你，白天黑夜地开出租。车后座是你的另一张床，收音机里的相声你比他背得熟。
  bonus: { charm: 1, body: 1, mind: -1 }
  traits: [fam_taxi, fam_single]

- id: liu
  name: 刘家 · 楼下小卖部
  wealth: 1
  weight: 2
  money: 40
  desc: 楼下的小卖部是你家的。冰柜、汽水、泡泡糖、五毛钱的画片。全楼的孩子都想跟你好，真假得自己分。
  bonus: { luck: 1, mind: 1, body: -1 }
  traits: [fam_shop]

# ---- 街坊篇新增的四户（专属剧情见 events/neighbors.yaml） ----

- id: bai
  name: 白家 · 管红白事的
  wealth: 1
  weight: 2
  money: 25
  desc: 这片儿谁家娶媳妇、送老人，都请你爸张罗。他说红事白事一个理儿：把人好好送进门，好好送出门。
  bonus: { mind: 1, charm: 1 }
  traits: [fam_dale]

- id: jin
  name: 金家 · 老城里搬来的
  wealth: 0
  weight: 2
  money: 6
  desc: 祖上在老城里阔过，如今三代挤一间半。爷爷的规矩一样没丢：吃饭不许吧唧嘴，冬天怀里揣着蝈蝈葫芦。
  bonus: { mind: 1, charm: 1, body: -1 }
  traits: [fam_oldmoney, fam_poor]

- id: tong
  name: 佟家 · 摔跤的
  wealth: 0
  weight: 2
  money: 8
  desc: 你爸年轻时摔过跤，有点名气，如今在厂里看大门。当年的跤衣还挂在门后头。他的规矩就一条：倒了地的人，不许再碰。
  bonus: { body: 2 }
  traits: [fam_wrestle, fam_poor, fam_factory]

- id: fu
  name: 傅家 · 扎风筝的
  wealth: 1
  weight: 2
  money: 20
  desc: 你家房梁上挂满没糊纸的风筝骨架，一屋子竹篾和浆糊味儿。爷爷说：扎是手艺，放是能耐，起不起得来看老天爷。
  bonus: { mind: 1, luck: 1 }
  traits: [fam_kite]

# ---- 殷实人家（家境篇新增，专属剧情见 events/means.yaml） ----
# fam_factory：爸妈有一头在厂里（陈、吴、佟三家），二十二岁能接班进厂，三十岁能等厂里分房

- id: dong
  name: 董家 · 厂长家
  wealth: 2
  weight: 2
  money: 55
  desc: 你爸是厂里的副厂长，家里有全楼头一部电话。谁家来了长途，你妈就站在楼道里喊人下来接。
  bonus: { charm: 1, mind: 1, body: -1 }
  traits: [fam_rich, fam_cadre]

- id: zheng
  name: 郑家 · 大夫家
  wealth: 2
  weight: 2
  money: 50
  desc: 你妈是区医院的大夫，你爸在设计院画图纸。家里永远有一股来苏水味儿，书架上一半是你看不懂的厚书。
  bonus: { mind: 2, body: -1 }
  traits: [fam_rich, fam_doctor]
