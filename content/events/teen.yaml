- id: t_family_trouble
  kind: solo
  stage: teen
  weight: 2
  requires: { minAge: 16, notFlags: [dropout] }
  title: 家里出事了
  text: 妈妈在车间里伤了手。夜里你听见爸妈在隔壁小声算账——学费、药费、下个月的煤气罐。算到后来，就没声了。
  options:
    - id: quit
      text: 不念了，去打工
      tags: [responsible]
      effects: { self: { mood: -10, body: 1 }, flags: [dropout] }
    - id: stay
      text: 咬咬牙，接着念
      tags: [competitive]
      effects: { self: { mind: 1, mood: -5 } }
    - id: both
      text: 白天上学，晚上帮工
      tags: [patient]
      effects: { self: { body: 1, energy: -20, mood: -5 } }

- id: t_first_paycheck
  kind: solo
  stage: teen
  weight: 3
  requires: { minAge: 16, flags: [dropout] }
  title: 头一个月的工钱
  text: 在港口仓库扛了一个月的货，你领到了头一份工钱。薄薄一沓，揣在兜里，一路上隔着裤子摸了好几遍。
  options:
    - id: table
      text: 全拍在家里桌上
      tags: [responsible]
      effects: { self: { mood: 5, charm: 1 } }
    - id: book
      text: 偷偷买一套复习书
      tags: [patient]
      effects: { self: { mind: 2, mood: -3 } }
    - id: treat
      text: 请对门吃顿好的
      tags: [gentle]
      effects: { self: { mood: 8 }, other: { mood: 8 }, bond: { close: 1 } }

- id: t_gate_dropout
  kind: mirror
  stage: teen
  where: school
  when: [930, 1140]
  hint: 校门口蹲着个穿工装的。
  weight: 3
  requires: { minAge: 16, flags: [dropout] }
  title: 校门口
  text: 放学铃响了。校门口，一个背着书包，一个穿着沾了油的工装，中间隔着一道铁栅栏门，和一群往外涌的学生。
  options:
    - id: call
      text: 喊对方的名字
      tags: [adventure]
      effects: { self: { mood: 5 } }
    - id: noodle
      text: "「走，吃碗面去。」"
      tags: [gentle]
      effects: { self: { hunger: 15 }, other: { mood: 5 } }
    - id: pretend
      text: 装作没看见
      tags: [solitude]
      effects: { self: { mood: -5 } }
  resonance:
    call:
      text: 你们同时喊出了对方的名字，隔着栅栏都笑了。笑完，谁也不知道下一句该说什么。
      memory: 隔着栅栏
      bond: { sync: 3, close: 2 }
    noodle:
      text: 面馆里，一个说学校的事，一个说厂里的事。两碗面都坨了，话还没说完。
      memory: 坨了的面
      bond: { sync: 3, close: 3 }
    pretend:
      text: 你们都把头扭向了别处。人群散了，校门口只剩下两个背影，往两头走。
      memory: 两个背影
      bond: { sync: 2, close: 1 }
  dissonance:
    text: 一个人抬起手想打招呼，另一个人已经低头扎进了人群。那只手在半空停了一会儿，挠了挠头。
    bond: { close: -1 }

- id: t_gaokao
  kind: solo
  stage: teen
  weight: 3
  requires: { minAge: 17, notFlags: [dropout, vocational] }
  title: 最后一门
  text: 模拟考最后一门，离交卷还有二十分钟，你忽然发现前面一道大题从第一步就错了。窗外的知了叫得人心慌。
  options:
    - id: redo
      text: 推倒重算，赌一把
      tags: [adventure]
      effects: { self: { mind: 1, energy: -20, mood: -5 } }
    - id: safe
      text: 不动它，先保住会的
      tags: [patient]
      effects: { self: { mind: 1, mood: 3 } }
    - id: window
      text: 搁下笔，看窗外
      tags: [solitude]
      effects: { self: { mood: 10 } }
