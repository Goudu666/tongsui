# 童年篇事件（3–12 岁，一回合 = 一个季节里被记住的一天）
#
# 字段说明见 docs/TECH.md「内容格式」。
#   kind: mirror  默契事件：两人同时在 where 才触发，看到同一段文字，各自私下选择
#   kind: solo    各自事件：每个人单独遇到；没有 where 时在早上醒来触发
# 数值键：
#   个人属性 body 体魄 / mind 心智 / charm 魅力 / luck 运气（0~10）
#   需求     mood 心情 / hunger 饱腹 / energy 精力 / clean 清洁（0~100）
#   关系     sync 默契 / close 亲近 / distance 距离
#   触发     where 地点（见 map.yaml 的 zones）/ when [起, 止] 分钟（1080 = 18:00）/ hint 地图上飘着的提示

- id: c_roof_summer
  kind: mirror
  stage: childhood
  where: roof
  when: [1080, 1300]
  hint: 楼顶好像有人在收凉席。
  seasons: [summer]
  weight: 3
  title: 楼顶的夏夜
  text: 三伏天，屋里待不住人。楼顶上凉席挨着凉席，不知谁家的收音机正说着相声，半个楼顶都等着乐。
  options:
    - id: stars
      text: 躺在凉席上数星星
      tags: [gentle]
      effects: { self: { mood: 10 } }
    - id: popsicle
      text: 跑下楼买两根冰棍
      tags: [adventure]
      effects: { self: { mood: 5 }, other: { mood: 5 } }
    - id: home
      text: 太晚了，回屋吧
      tags: [solitude]
      effects: { self: { energy: 10 } }
  resonance:
    stars:
      text: 数到第四十七颗，收音机里抖了个包袱，楼顶全乐了。再数，谁也不记得数到哪儿了。
      memory: 第四十七颗星
      bond: { sync: 3, close: 3 }
    popsicle:
      text: 你们在楼梯拐角撞上了，手里都攥着两根冰棍。最后一人吃了两根，第二天都闹肚子。
      memory: 四根冰棍
      bond: { sync: 3, close: 2 }
    home:
      text: 你们一前一后下了楼，在楼道里说了声"明儿见"。
      memory: 明儿见
      bond: { sync: 2, close: 1 }
  dissonance:
    text: 一个在楼顶占着两个人的凉席，一个在楼下攥着两根冰棍。冰棍化了，凉席也没人躺。
    bond: { close: 1 }

- id: c_stray_cat
  kind: mirror
  stage: childhood
  where: hallway
  hint: 楼道的暖气片后面有很细的叫声。
  weight: 2
  requires: { minAge: 5 }
  title: 暖气片后面的猫
  text: 楼道暖气片后头缩着一只瘸腿的小猫，叫得比蚊子还细。楼长贴过条子：楼道里不许养活物。白菜不算。
  options:
    - id: hide
      text: 偷偷拿纸箱给它搭个窝
      tags: [adventure, gentle]
      effects: { self: { mood: 5 }, flags: [cat_secret] }
    - id: tell
      text: 去告诉大人
      tags: [responsible]
      effects: { self: { mind: 1 } }
    - id: leave
      text: 不敢管，绕开走
      tags: [solitude]
      effects: { self: { mood: -5 } }
  resonance:
    hide:
      text: 从那天起，你们有了第一个只属于两个人的秘密。猫叫"暖暖"。
      memory: 暖暖
      bond: { sync: 3, close: 4 }
    tell:
      text: 你们去敲了楼长的门。楼长嘴上说净给他找事儿，转脸把猫抱去了车铺：逮耗子，顶半个伙计。
      memory: 车铺的猫
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 一个想留下它，一个想交给大人。你们第一次为一件事争了起来。
    bond: { close: -1 }

- id: c_new_year
  kind: mirror
  stage: childhood
  where: alley
  when: [1140, 1320]
  hint: 楼下飘着一股火药味。
  seasons: [winter]
  weight: 2
  title: 除夕的鞭炮
  text: 大年三十，楼下一地红纸屑。你攥着一盒从灶台上顺来的火柴，兜里揣着三个「二踢脚」，捻儿都让你搓软了。
  options:
    - id: together
      text: 喊上对门一起放
      tags: [adventure]
      effects: { self: { mood: 10 } }
    - id: save
      text: 留到初一早上
      tags: [patient]
      effects: { self: { mind: 1 } }
  resonance:
    together:
      text: "「砰——啪！」眉毛燎没了半截。楼上有人推开窗户：「谁家倒霉孩子！」骂完自己先乐了：「过年好！」"
      memory: 燎掉的眉毛
      bond: { sync: 3, close: 3 }
    save:
      text: 大年初一的清晨，整条街只有你们两个人的鞭炮声。
      memory: 初一的清晨
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 你在楼下喊了好几声，楼上那扇窗一直没开。那年的鞭炮是一个人听的。
    bond: { close: 0 }

- id: c_river_ice
  kind: mirror
  stage: childhood
  where: river
  hint: 海河边有人在喊"冻实了！"
  seasons: [winter]
  weight: 2
  title: 冻上的海河
  text: 海河冻结实了。冰面上抽冰嘎的、推冰车的、凿窟窿钓鱼的，各占一块地方。岸上的大人就会喊一句：「别往中间去！」
  options:
    - id: skate
      text: 下去推冰车
      tags: [adventure]
      effects: { self: { body: 1, mood: 5 } }
    - id: shore
      text: 在岸上看着
      tags: [patient]
      effects: { self: { mood: 5 } }
  resonance:
    skate:
      text: 一个人坐在冰车上，一个人在后面推。摔了七次，笑了七次。
      memory: 冰车
      bond: { sync: 3, close: 3 }
    shore:
      text: 你们靠着栏杆，看着别人在冰上转圈，哈出来的白气混在一起。
      memory: 栏杆上的白气
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个在冰上喊"快下来"，一个在岸上喊"快上来"。
    bond: { close: 1 }

- id: c_first_fight
  kind: solo
  stage: childhood
  where: alley
  when: [900, 1140]
  weight: 2
  requires: { minAge: 7 }
  title: 第一次打架
  text: 放学路上，隔壁楼几个大孩子把你堵在墙根儿，说你「天天跟对门那个混在一块儿，没出息」。
  options:
    - id: fight
      text: 冲上去
      tags: [adventure, competitive]
      effects: { self: { body: 1, mood: -5 }, other: { mood: 5 }, bond: { close: 2 } }
    - id: run
      text: 跑回家
      tags: [solitude]
      effects: { self: { mood: -5 } }
    - id: argue
      text: "跟他们掰扯：「介有嘛丢人的？」"
      tags: [responsible]
      effects: { self: { mind: 1, charm: 1 } }

- id: c_rainy_day
  kind: solo
  stage: childhood
  weight: 3
  title: 下雨天
  text: 雨从夜里下到晌午，楼下的路成了河，有人拿洗衣裳的大盆当船划。出不去了。
  options:
    - id: read
      text: 翻出一本没看完的小人书
      tags: [solitude]
      effects: { self: { mind: 1 } }
    - id: puddle
      text: 穿上雨靴去踩水坑
      tags: [adventure]
      effects: { self: { body: 1, mood: 5, clean: -20 } }
    - id: door
      text: 去对门借一本小人书
      tags: [gentle]
      effects: { self: { mood: 5 }, other: { mood: 5 }, bond: { close: 1 } }

- id: c_guitar
  kind: solo
  stage: childhood
  where: bikeshop
  weight: 1
  requires: { minAge: 8 }
  title: 车铺里的旧二胡
  text: 修车爷爷的墙上，扳手和车圈中间挂着一把落灰的二胡。「想学就来。不收钱，收耳朵：头仨月那动静，你得受得了。」
  options:
    - id: learn
      text: 每天放学来学一会儿
      tags: [patient]
      effects: { self: { charm: 1, mood: 5 }, flags: [erhu] }
    - id: skip
      text: 算了，太难听了
      tags: [solitude]
      effects: {}

- id: c_exam
  kind: solo
  stage: childhood
  weight: 2
  requires: { minAge: 9 }
  title: 期末考试
  text: 明天期末考试，数学还有两个单元一眼没看。大人放了话：考好了吃捞面，考砸了吃笤帚疙瘩。
  options:
    - id: cram
      text: 熬夜看书
      tags: [competitive]
      effects: { self: { mind: 2, energy: -20 } }
    - id: ask
      text: 去对门问题目
      tags: [gentle]
      effects: { self: { mind: 1 }, bond: { close: 1 } }
    - id: sleep
      text: 早点睡，听天由命
      tags: [solitude]
      effects: { self: { mood: 5 } }

# ===================== 以下为童年篇扩写：四季的轮回 =====================
# 季节：spring 立春 / summer 立夏 / autumn 立秋 / winter 立冬
# 年龄：3–5 岁的小事用 maxAge，6–8 岁上小学，9–11 岁快小升初

# ---------- 不限季节 · 默契 ----------

- id: c_first_name
  kind: mirror
  stage: childhood
  where: hallway
  hint: 对门的门缝里有一双眼睛。
  weight: 3
  requires: { maxAge: 4 }
  title: 第一次叫名字
  text: 午后的楼道里只有暖气片咔哒咔哒地响。对门的门开了一条缝，一双眼睛在看你。大人教过好几遍TA的名字，你还一回都没叫出口过。
  options:
    - id: call
      text: 张嘴叫TA的名字
      tags: [gentle]
      effects: { self: { mood: 5 }, other: { mood: 5 } }
    - id: hide
      text: 躲到大人腿后面
      tags: [solitude]
      effects: { self: { mood: 2 } }
    - id: wave
      text: 不出声，只招招手
      tags: [patient]
      effects: { self: { mood: 3 }, other: { mood: 3 } }
  resonance:
    call:
      text: 两个人同时开了口，叫的都是对方的名字，都叫得不太对。两家大人在屋里笑出了声。
      memory: 叫错的名字
      bond: { sync: 3, close: 3 }
    hide:
      text: 两扇门后面各藏着一个小孩，各自从大人的腿缝里往外瞄。瞄了整整一下午。
      memory: 腿缝里的眼睛
      bond: { sync: 2, close: 2 }
    wave:
      text: 你们隔着窄窄的楼道招了一下午手，谁也没说一个字，招得胳膊都酸了。
      memory: 一下午的招手
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 你这边刚出声，门缝「砰」地关上了。过了一会儿，那道缝又开了，比刚才宽一点。
    bond: { close: 1 }

- id: c_wall_names
  kind: mirror
  stage: childhood
  where: hallway
  when: [930, 1260]
  hint: 楼道墙上有人用钉子划过。
  weight: 3
  requires: { minAge: 7, minClose: 20 }
  title: 墙上的名字
  text: 楼道里堆着各家过冬的白菜和煤球，墙皮蹭得发黑。你兜里揣着一根捡来的大铁钉，墙上已经有好几茬孩子划的道道了。
  options:
    - id: carve
      text: 刻上两个人的名字
      tags: [adventure]
      effects: { self: { mood: 5 } }
    - id: draw
      text: 画一只歪脖子鸽子
      tags: [gentle]
      effects: { self: { mood: 5, charm: 1 } }
    - id: skip
      text: 楼长看见要骂的
      tags: [responsible]
      effects: { self: { mind: 1 } }
  resonance:
    carve:
      text: 你们在暖气片上头、踮脚够得着的地方，一笔一笔刻下两个人的名字，中间刻了个「和」字。
      memory: 墙上的名字
      bond: { sync: 4, close: 4 }
      flags: [p_wall_names]
    draw:
      text: 一个画了鸽子身子，一个画了鸽子脑袋，凑到一块儿是一只四条腿的鸽子。你们笑得蹲在了白菜堆上。
      memory: 四条腿的鸽子
      bond: { sync: 3, close: 2 }
    skip:
      text: 你们把钉子交给了楼长。楼长瞅了瞅满墙的道道，说：「我小时候也刻过。」
      memory: 楼长也刻过
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 墙上只刻下了一个人的名字，旁边留着一块空。后来很多年，那块墙皮一直空着。
    bond: { close: -1 }

# ---------- 春 · 默契 ----------

- id: c_spring_kite
  kind: mirror
  stage: childhood
  where: river
  when: [600, 1080]
  hint: 海河边的天上挂着好几只风筝。
  seasons: [spring]
  weight: 3
  title: 立春的风筝
  text: 立春了，海河边的风还冻手。铁桥底下有人卖沙燕风筝，五块钱一只。你们俩兜里的钱凑一块儿，正好五块。
  options:
    - id: buy
      text: 合买一只沙燕
      tags: [gentle]
      effects: { self: { mood: 8 } }
    - id: make
      text: 回家拿报纸自己糊
      tags: [patient]
      effects: { self: { mind: 1, mood: 3 } }
    - id: watch
      text: 看别人放就够了
      tags: [solitude]
      effects: { self: { mood: 3 } }
  resonance:
    buy:
      text: 沙燕飞得比铁桥还高的时候，线在两个人手里攥着，谁也不肯先撒手。
      memory: 两个人的线
      bond: { sync: 3, close: 3 }
    make:
      text: 两只报纸风筝一只栽进了河里，一只挂在了柳树上。你们笑得一屁股坐在了地上。
      memory: 报纸风筝
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个已经把两块五掏了出来，另一个转身往家跑，去拿浆糊。那天天上的风筝都是别人的。
    bond: { close: 0 }

- id: c_capsule
  kind: mirror
  stage: childhood
  where: river
  when: [900, 1140]
  hint: 河边的柳树底下有人在挖土。
  seasons: [spring]
  weight: 3
  requires: { minAge: 8 }
  title: 铁皮盒子
  text: 你们找到一个装过饼干的铁皮盒子，打算埋在海河边第三棵柳树底下。说好了，等长大了再一起挖出来。
  options:
    - id: letter
      text: 写封信给长大的自己
      tags: [patient]
      effects: { self: { mind: 1 } }
    - id: treasure
      text: 放进最好的弹球和画片
      tags: [gentle]
      effects: { self: { mood: 5 } }
    - id: keep
      text: 舍不得，揣回家去
      tags: [solitude]
      effects: { self: { mood: 2 } }
  resonance:
    letter:
      text: 两封信都折成了小方块，谁也不许偷看谁的。土拍实了，你们在柳树皮上划了一道。
      memory: 第三棵柳树
      bond: { sync: 3, close: 3 }
      flags: [p_capsule]
    treasure:
      text: 盒子里放进了一颗玻璃弹球、一张最亮的画片——不对，是两颗、两张。你们想到一块儿去了。
      memory: 两颗弹球
      bond: { sync: 3, close: 3 }
      flags: [p_capsule]
    keep:
      text: 你们抱着空盒子蹲了半天，最后谁也没舍得往里放东西，又一路抱回了楼里。
      memory: 空着的盒子
      bond: { sync: 2, close: 1 }
  dissonance:
    text: 盒子最后还是埋下去了，只是里头好像少了点什么。谁也没问。
    bond: { close: 0 }
    flags: [p_capsule]

- id: c_xiaohui
  kind: mirror
  stage: childhood
  where: roof
  when: [930, 1140]
  hint: 楼顶的鸽子窝边掉了几根灰毛。
  seasons: [spring]
  weight: 3
  requires: { minAge: 6 }
  title: 一只灰鸽子
  text: 楼顶养鸽子的刘大爷托着个纸箱：「翅膀伤了，跟不上群了。谁要谁抱走，不要钱，给口小米就行。」里头一只灰鸽子，缩成一团。
  options:
    - id: raise
      text: 我们俩一起养
      tags: [responsible, gentle]
      effects: { self: { mood: 5 } }
    - id: free
      text: 养好了就放它走
      tags: [patient]
      effects: { self: { mood: 3 } }
    - id: skip
      text: 家里不让养
      tags: [solitude]
      effects: { self: { mood: -3 } }
  resonance:
    raise:
      text: 你们给它起名叫「小灰」。一个管喂小米，一个管换水，鸽子笼的钥匙一人一把。
      memory: 两把钥匙
      bond: { sync: 3, close: 4 }
      flags: [p_pigeon]
    free:
      text: 二十天后，你们一人托着一边把它往天上一送。它绕着楼顶飞了三圈，又落回你们脚边。那就叫它小灰吧。
      memory: 绕了三圈
      bond: { sync: 3, close: 3 }
      flags: [p_pigeon]
  dissonance:
    text: 一个人已经抱起了纸箱，另一个往后退了半步。最后鸽子让刘大爷又收了回去。
    bond: { close: -1 }

- id: c_promise
  kind: mirror
  stage: childhood
  where: hallway
  when: [930, 1200]
  hint: 楼道里堆满了搬家的纸箱。
  seasons: [spring]
  weight: 3
  requires: { minAge: 8, minClose: 20 }
  title: 拉钩
  text: 二楼的王奶奶家要搬去新楼了。纸箱从楼道一直堆到楼梯口，王奶奶的小孙子坐在箱子上哭。你们俩看着看着，谁也没说话。
  options:
    - id: hook
      text: 伸出小拇指
      tags: [gentle]
      effects: { self: { mood: 5 } }
    - id: help
      text: 帮着搬箱子
      tags: [responsible]
      effects: { self: { body: 1 } }
    - id: away
      text: 回屋，不想看
      tags: [solitude]
      effects: { self: { mood: -5 } }
  resonance:
    hook:
      text: 「拉钩上吊，一百年不许变。」说好了，长大了也住对门。谁变谁是小狗。
      memory: 一百年不许变
      bond: { sync: 4, close: 4 }
      flags: [p_promise]
    help:
      text: 你们一人一头抬着最后一个箱子下了楼。车开走了，楼道空出一大块，你们站在那儿，影子挨着影子。
      memory: 空出来的一块
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一根小拇指伸在半空，另一个人已经抱着箱子下楼了。手指头慢慢地收了回去。
    bond: { close: -1 }

# ---------- 夏 · 默契 ----------

- id: c_river_swim
  kind: mirror
  stage: childhood
  where: river
  when: [780, 1080]
  hint: 河边有人「扑通」跳下去了。
  seasons: [summer]
  weight: 2
  requires: { minAge: 8 }
  title: 偷着下河
  text: 三伏天，几个大孩子光着膀子从铁桥底下往海河里跳。大人说过一百遍不许下河，可那水看着倍儿凉快。
  options:
    - id: jump
      text: 甩了鞋就跳
      tags: [adventure]
      effects: { self: { body: 1, mood: 10, clean: -10 } }
    - id: guard
      text: 在岸上看着衣服
      tags: [responsible]
      effects: { self: { mood: 3 } }
    - id: tell
      text: 跑回去喊大人
      tags: [responsible]
      effects: { self: { mind: 1 }, other: { mood: -5 } }
  resonance:
    jump:
      text: 刚扑腾了两下，岸上就有人喊「谁家孩子！」你们湿着裤衩一路跑回楼里，鞋还在河边。
      memory: 落在河边的鞋
      bond: { sync: 3, close: 3 }
    guard:
      text: 两个人抱着一堆别人的衣服蹲在岸上，盯着水里的人，比水里的人还紧张。
      memory: 一堆衣服
