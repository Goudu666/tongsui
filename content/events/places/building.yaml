# 楼里的支线（地点内容，pl_bd_ 前缀）。where 用 content/maps/building.yaml 的 areas。
# 这个目录现在不进 build-content，等横版多地图的 loader 接上（见 content/maps/building.yaml 文件头）。
# 写法守 docs/tianjin_style.md：字数按阶段（童年 60 / 少年 55 / 青年 50 / 中年 45 / 老年 30），旁白和选项不用方言。
# 新加的 mirror 错位亲近给 0，童年默契权重给 2（见剧情写法的平衡约定）。
# 主线（敲对门、楼顶拉钩、刻名字、拆迁、搬空的楼道）归主线剧情，这里不写。

- id: pl_bd_coal
  kind: mirror
  stage: childhood
  where: hallway
  when: [480, 900]
  hint: 楼下停着一车蜂窝煤。
  seasons: [autumn, winter]
  weight: 2
  requires: { minAge: 5 }
  title: 蜂窝煤
  text: 送煤的车停在楼下。楼里的孩子排成一串，一人捧两块，从一楼递到三楼。送煤的说，摔一块赔一块。
  options:
    - id: four
      text: 一次捧四块
      tags: [competitive]
      effects: { self: { body: 1 } }
    - id: slow
      text: 两块，走慢点
      tags: [patient]
      effects: { self: { mood: 3 } }
    - id: count
      text: 站在楼梯口数数
      tags: [responsible]
      effects: { self: { mind: 1 } }
  resonance:
    four:
      text: 你们一人捧四块，在二楼拐角撞了个满怀。煤一块没碎，两张脸全黑了。
      memory: 两张黑脸
      bond: { sync: 3, close: 2 }
    slow:
      text: 你们走得最慢。送煤的走前塞给你俩一人一块糖，糖纸上也是黑手印。
      memory: 黑手印糖纸
      bond: { sync: 3, close: 2 }
    count:
      text: 一个在楼下喊，一个在楼上应，二百一十块，一块不差。送煤的让你们在账本上画了个圈。
      memory: 二百一十块
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个抢着往上跑，一个守在楼梯口数。数到一半就乱了，送煤的说不要紧，他心里有数。
    bond: { close: 0 }

- id: pl_bd_stool
  kind: solo
  stage: childhood
  where: hallway
  when: [1110, 1290]
  hint: 楼道里有人借着灯写字。
  weight: 2
  requires: { minAge: 7, flags: [fam_poor] }
  title: 小板凳
  text: 屋里一张桌子，吃饭用，写字也用。晚上你搬个小板凳去楼道，暖气片上铺张报纸，就是书桌。
  options:
    - id: write
      text: 趴着写到熄灯
      tags: [responsible]
      effects: { self: { mind: 1, energy: -5 } }
    - id: knock
      text: 敲开对门借个亮
      tags: [gentle]
      effects: { self: { mood: 4 }, bond: { close: 1 } }
    - id: hum
      text: 一边写一边哼歌
      tags: [solitude]
      effects: { self: { mood: 5 } }

- id: pl_bd_aircon
  kind: solo
  stage: childhood
  seasons: [summer]
  weight: 1
  requires: { minAge: 6, flags: [fam_rich] }
  title: 头一台空调
  text: 家里装了空调，外机一开，整个楼道都听得见。三伏天，楼里的孩子都爱往你家门口凑。
  options:
    - id: share
      text: 叫对门的进来写作业
      tags: [gentle]
      effects: { self: { mood: 3 }, other: { mood: 5 }, bond: { close: 1 } }
    - id: remote
      text: 让大家轮着按遥控器
      tags: [adventure]
      effects: { self: { charm: 1 } }
    - id: roof
      text: 关了，一块儿上楼顶
      tags: [solitude]
      effects: { self: { mood: 4, energy: -3 } }

- id: pl_bd_blackout
  kind: mirror
  stage: teen
  where: hallway
  when: [1110, 1320]
  hint: 楼道里有人在喊保险丝。
  weight: 2
  title: 停电
  text: 整栋楼一下子黑了。各家都开了门，楼道里一串手电筒，有人说是总闸，有人说整片都停了。
  options:
    - id: candle
      text: 回屋找蜡烛
      tags: [responsible]
      effects: { self: { mood: 2 } }
    - id: stairs
      text: 坐楼梯上等来电
      tags: [patient]
      effects: { self: { mood: 4 } }
    - id: roof
      text: 上楼顶看看
      tags: [adventure]
      effects: { self: { mood: 6 } }
  resonance:
    candle:
      text: 两家同时点着了蜡烛，门都开着，楼道里一边一个亮。你们隔着楼道写完了作业。
      memory: 两根蜡烛
      bond: { sync: 3, close: 2 }
    stairs:
      text: 你们坐在同一级台阶上。灯亮的时候全楼一声欢呼，你们谁都没动。
      memory: 同一级台阶
      bond: { sync: 3, close: 3 }
    roof:
      text: 楼顶上看出去整片都黑着，只有河对岸还亮。你们看了很久，楼下喊来电了。
      memory: 对岸的亮
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个在屋里翻抽屉找蜡烛，一个已经摸黑上了楼顶。来电的时候，两个人都在找对方。
    bond: { close: 0 }

- id: pl_bd_stairs
  kind: solo
  stage: old
  where: hallway
  weight: 2
  requires: { minAge: 65 }
  title: 一层一歇
  hint: 楼梯上有人在喘气。
  text: 三楼爬到一半，你在二楼拐角歇一歇。窗台上换了一盆花。
  options:
    - id: rest
      text: 歇够了再走
      tags: [patient]
      effects: { self: { energy: 5 } }
    - id: push
      text: 一口气上去
      tags: [competitive]
      effects: { self: { body: 1, energy: -5 } }

# ---------- 补空档（11-11）：青年、中年 ----------
# 青年两件在找事由（22）前后：四楼租房的那件拿精力换心智，停水那件拿精力换体魄或人缘。
# 中年两件只给还住在老楼里的人（没买房），写在拆迁那张告示之前（38 岁以前）：钱和亲近的取舍，接着七十岁那道看亲近的关。

- id: pl_bd_silou
  kind: solo
  stage: young
  where: hallway
  when: [1110, 1320]
  hint: 楼梯灯底下有人在念叨。
  weight: 2
  requires: { minAge: 19, maxAge: 26 }
  title: 楼梯灯
  text: 四楼新搬来个租房的，每晚坐在楼梯灯底下背书，说在考一个证。灯一灭，他就跺一脚。
  options:
    - id: join
      text: 拿本书坐他下一级
      tags: [competitive]
      effects: { self: { mind: 1, energy: -8 } }
    - id: lamp
      text: 把屋里的台灯借他
      tags: [gentle]
      effects: { self: { charm: 1 } }
    - id: sleep
      text: 点个头，回屋睡
      tags: [solitude]
      effects: { self: { energy: 6 } }

- id: pl_bd_water
  kind: mirror
  stage: young
  where: hallway
  when: [390, 720]
  hint: 楼下水龙头排了一串桶。
  weight: 2
  title: 停水
  text: 楼里停水，只有一楼院里的龙头还出水。各家的桶排了一串，一直排到楼门口。
  options:
    - id: carry
      text: 一手一桶往上拎
      tags: [competitive]
      effects: { self: { body: 1, energy: -8 } }
    - id: help
      text: 先给二楼奶奶拎
      tags: [gentle]
      effects: { self: { charm: 1, energy: -5 } }
    - id: wait
      text: 等来水再说
      tags: [patient]
      effects: { self: { mood: 3 } }
  resonance:
    carry:
      text: 你们一前一后拎到三楼，才发现拎的都是对方家的桶。
      memory: 拎错的桶
      bond: { sync: 3, close: 2 }
    help:
      text: 二楼奶奶家的缸满了。她一人塞给你们一个苹果，说够吃到来水。
      memory: 两个苹果
      bond: { sync: 3, close: 2 }
    wait:
      text: 你们两家的桶排在最后，挨着。来水的时候，天已经黑了。
      memory: 挨着的桶
      bond: { sync: 2, close: 1 }
  dissonance:
    text: 一个已经拎着桶上了三楼，一个还在楼门口排着。上去的那个又下来了，接过一只桶。
    bond: { close: 0 }

- id: pl_bd_chair
  kind: solo
  stage: middle
  where: hallway
  when: [930, 1200]
  hint: 楼道里多了一辆轮椅。
  weight: 2
  requires: { minAge: 32, maxAge: 38, notFlags: [home_own] }
  title: 轮椅
  text: 楼道里多了辆轮椅，是你爸的。上下楼，得两个人抬。
  options:
    - id: carry
      text: 背他下楼晒太阳
      tags: [responsible]
      effects: { self: { mood: 4, energy: -12 } }
    - id: knock
      text: 敲对门搭把手
      tags: [gentle]
      effects: { self: { energy: -5 }, bond: { close: 2 } }
    - id: pay
      text: 花钱请人每天抬
      tags: [competitive]
      cost: 8
      effects: { self: { mood: 2 } }
    - id: window
      text: 推到窗口，开开窗
      tags: [patient]
      effects: { self: { mood: 2 } }

- id: pl_bd_bulb
  kind: mirror
  stage: middle
  where: hallway
  when: [1110, 1320]
  hint: 楼道灯又不亮了。
  weight: 2
  requires: { minAge: 30, maxAge: 38, notFlags: [home_own] }
  title: 灯泡
  text: 楼道灯坏了三天。两家下夜班的都摸黑上楼，脚底下数着台阶。
  options:
    - id: buy
      text: 买个灯泡换上
      tags: [responsible]
      cost: 1
      effects: { self: { mood: 3 } }
    - id: torch
      text: 门口挂个手电
      tags: [gentle]
      effects: { self: { charm: 1 } }
    - id: count
      text: 接着数台阶
      tags: [patient]
      effects: { self: { mind: 1 } }
  resonance:
    buy:
      text: 两个人各买了一个，站在凳子上一比，一样的瓦数。多的那个搁在了电表箱上。
      memory: 电表箱上那个
      bond: { sync: 3, close: 2 }
    torch:
      text: 两家门口各挂了一只手电，谁晚回来谁拿，第二天再挂回对方门口。
      memory: 换着挂的手电
      bond: { sync: 3, close: 2 }
    count:
      text: 一共四十六级。两个人数的都是四十六，不用开灯也到得了门口。
      memory: 四十六级
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个换好了灯泡，一个摸黑上楼时还在数台阶，数到一半，灯亮了。
    bond: { close: 0 }
