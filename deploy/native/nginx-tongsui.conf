# 同岁：公网 8080 → 本机 Nakama 127.0.0.1:7350（HTTP API + WebSocket /ws）
# setup.sh 装到 /etc/nginx/sites-available/tongsui 并链接到 sites-enabled。
# 和 cakery 的 80 默认 server 互不相干；map 用自己的变量名，不依赖 cakery 那份配置。
map $http_upgrade $tongsui_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 1m;

    # 控制台只在 127.0.0.1:7351，用 ssh -L 访问；这里再兜一层
    location ^~ /console { return 404; }
    location ^~ /v2/console { return 404; }

    location / {
        proxy_pass http://127.0.0.1:7350;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tongsui_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 联机长连接：默认 60 秒没数据就断，调到 1 小时（客户端每 2 秒 PING）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
