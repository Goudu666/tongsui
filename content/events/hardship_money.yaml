# ======================== 清贫：借来的时间 ========================

# 助学贷款还清了（loan 是十八岁那一段打的）：二十七到二十九岁一回，没碰上的三十出头再一回。权重高：这件事迟早要来
- id: mx_loan_paid
  kind: solo
  stage: young
  weight: 30
  requires: { minAge: 27, maxAge: 29, flags: [loan] }
  title: 还清了
  text: 最后一笔助学贷款寄出去了。回执你折了两折，夹进了当年那张录取通知书里。
  options:
    - id: treat
      text: 叫上对门吃顿饭
      tags: [gentle]
      effects: { self: { mood: 6 }, other: { mood: 3 }, drop: [loan] }
    - id: walk
      text: 一个人去河边走走
      tags: [solitude]
      effects: { self: { mood: 5 }, drop: [loan] }

- id: mx_loan_paid_late
  kind: solo
  stage: middle
  weight: 30
  requires: { minAge: 31, flags: [loan] }
  title: 回执
  text: 银行寄来一张单子：助学贷款还清了。你看了两遍，揣进上衣兜里。
  options:
    - id: treat
      text: 买两瓶汽水回家
      tags: [gentle]
      effects: { self: { mood: 5 }, drop: [loan] }
    - id: keep
      text: 把单子压在玻璃板下
      tags: [patient]
      effects: { self: { mood: 4 }, drop: [loan] }

# 爸妈走了，往家里寄的那份就停了（四十五岁把爸妈接过来住的，那天已经摘了 send_home）
- id: mx_last_remit
  kind: solo
  stage: middle
  weight: 30
  requires: { minAge: 40, flags: [send_home, parent_gone] }
  title: 汇款单
  text: 月初你照常去了邮局，排到柜台才想起来，这个月不用寄了。
  options:
    - id: pocket
      text: 把汇款单揣回兜里
      tags: [patient]
      effects: { self: { mood: -3 }, drop: [send_home] }
    - id: stand
      text: 在邮局门口站一会儿
      tags: [solitude]
      effects: { self: { mood: -5 }, drop: [send_home] }
