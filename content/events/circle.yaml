# ---------- 求到你门上（有了位子，轮到别人来求你） ----------

- id: c_ask_door
  kind: solo
  stage: middle
  weight: 3
  requires: { minAge: 31, maxAge: 55, flags: [job_desk] }
  title: 一兜苹果
  text: 楼下谁家孩子毕业了，他妈拎着一兜苹果来敲门，问你们单位还要不要人。
  options:
    - id: speak
      text: 替他去说一句
      tags: [gentle]
      effects: { self: { mood: -4, energy: -10 }, flags: [tie_street] }
    - id: no
      text: 说这事你做不了主
      tags: [patient]
      effects: { self: { mood: -2 } }
    - id: apples
      text: 苹果退回去，留杯茶
      tags: [responsible]
      effects: { self: { charm: 0.1, mood: -1 } }

- id: c_ask_door_pull
  kind: solo
  stage: middle
  weight: 3
  requires: { minAge: 31, maxAge: 55, flags: [job_pull], notFlags: [job_desk] }
  title: 门口的人
  text: 楼下谁家的孩子待业在家。他爸在楼道里等了你半天，开口先递烟：「听说你们那儿是托人进的？」
  options:
    - id: speak
      text: 替他去问一句
      tags: [gentle]
      effects: { self: { mood: -4, energy: -10 }, flags: [tie_street] }
    - id: no
      text: 说你也是托的人
      tags: [patient]
      effects: { self: { mood: -2 } }
    - id: smoke
      text: 接过烟，陪他站会儿
      tags: [solitude]
      effects: { self: { charm: 0.1, mood: -1 } }

