      text: 手抄一份交上去
      tags: [patient]
      effects: { self: { mind: 0.1, mood: -4, energy: -10 } }
    - id: door
      text: 求对门帮着打
      tags: [gentle]
      effects: { self: { mood: 2 }, other: { mood: -2 }, bond: { close: 1 } }

# ======================== 牛奶 ========================

# 订了牛奶的人家（殷实，小康晚几年）：一天一瓶，九岁体校那道关看体魄
- id: ho_milk
  kind: solo
