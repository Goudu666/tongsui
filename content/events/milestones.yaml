# 人生关口。到了年纪的那天早上一定发生，两个人同时面对、各自私下选。
#
# 和普通事件不同的地方：
#   age     到这个年纪的第一天发生
#   score   怎么算分：各项属性乘权重相加（money = 积蓄，close = 两个人的亲近；这两样按原数显示，不算发挥）。界面上常驻显示离每条线还差多少
#   swing   考试有发挥：得分随手气和运气上下浮动一点（约 ±0.3）。手气差的那一半按默契托住一些（rules.yaml 的 bond.syncSteady）
#   grades  成绩档（事实）：从高到低取第一个够得着的，给标记
#   options 能走的路（选择）：min 是这条路的分数线，不够的选项是灰的；score 可以单独写这条路看什么；
#           cost 是选了以后花掉的积蓄。只剩一条路可走时不弹窗，直接记进长卷
#   resonance / dissonance 两个人选了同一条路 / 不同的路
#
# 选项只管打标记，日程由 content/tracks.yaml 按标记决定。
# 考上了也可以不去：分数够不够是一回事，走不走是另一回事。
#
# 家境（docs/MEANS.md）：带 requires 的路只给某种人家留着。
#   lock   标记不对的人看到的那句（「家里拿不出这笔钱」）：路摆在那儿，灰着，知道有这么条路
#   joins  和哪条路是同一条：交钱进的重点班和考进去的同班，两个人一个交钱一个考，也算同路
# 殷实人家花钱买的路照样有线，只是低一些，钱从自己的积蓄里扣：花在念书上，三十岁安家就少了这一截。
# 清贫人家自己的路（接班、分房、当兵）线低或者不看分，可往后挣得也少。挂了标记的路不当兜底（lifeMilestoneFallback）。
# 分数线是这个游戏最要紧的数值，改之前跑一遍 node tools/paths.mjs 看各种活法落在哪。

# 四岁：头一道小关（关口冲刺 11-11）。开局十分钟里就有一回「看线 → 押时间 → 揭晓」，原来头一道关在六岁，真人手速要第十九分钟。
# 只挑一个人上台，线比六岁的小干部高：底子最好的那项再使使劲才够得着。够不着也有台下那一条，不改往后的路。
- id: m_kinder
  kind: milestone
  stage: childhood
  age: 4
  title: 六一
  text: 幼儿园要过六一。阿姨拿着花名册挨个看：领唱的、翻跟头的、背诗的，台上各要一个。
  options:
    - id: sing
      text: 站在最前头领唱
      score: { charm: 1 }
      min: 6.3
      tags: [gentle]
      effects: { self: { mood: 6 }, flags: [k_sing] }
    - id: tumble
      text: 在台上翻跟头
      score: { body: 1 }
      min: 6.5
      tags: [adventure]
      effects: { self: { mood: 6 }, flags: [k_tumble] }
    - id: poem
      text: 一口气背完一首长诗
      score: { mind: 1 }
      min: 6.5
      tags: [competitive]
      effects: { self: { mood: 6 }, flags: [k_poem] }
    - id: clap
      text: 坐在台下拍巴掌
      tags: [patient]
      effects: { self: { mood: 2 } }
  resonance:
    sing:
      text: 阿姨挑不出来，让两个人一块儿领。唱到一半忘了词，两个人对着看了一眼，接着往下哼。
      memory: 一块儿哼过去
      bond: { sync: 2, close: 2 }
    tumble:
      text: 一个翻过去，一个翻过来，在台中间差点撞上。底下的家长以为是排好的，鼓掌鼓得最响。
      memory: 差点撞上
      bond: { sync: 2, close: 2 }
    poem:
      text: 两个人背的是同一首，一人一句轮着背。轮到最后一句，两个人一块儿张的嘴。
      memory: 一人一句
      bond: { sync: 2, close: 2 }
    clap:
      text: 两个小板凳挨着。台上唱什么你们都没听，光顾着比谁拍得响。
      memory: 比谁拍得响
      bond: { sync: 1, close: 2 }
  dissonance:
    text: 一个在台上，一个在台下。下了台，台下的那个把攥热了的糖塞过去一块。
    bond: { close: 1 }

- id: m_school
  kind: milestone
  stage: childhood
  age: 6
  title: 上小学
  text: 新书包比你的背还宽。头一天，老师让每个人上讲台站一会儿：念黑板上的字，绕操场跑一圈，再唱两句。她要挑三个小干部。
  options:
    - id: study
      text: 当学习委员，收作业本
      score: { mind: 1 }
      min: 5.5
      tags: [competitive]
      effects: { flags: [in_school, lead_study] }
    - id: sport
      text: 当体育委员，喊队
      score: { body: 1 }
      min: 5.5
      tags: [adventure]
      effects: { flags: [in_school, lead_sport] }
    - id: art
      text: 当文艺委员，起头唱歌
      score: { charm: 1 }
      min: 5.3
      tags: [gentle]
      effects: { flags: [in_school, lead_art] }
    - id: go
      text: 坐回自己的座位
      tags: [patient]
      effects: { flags: [in_school] }
  resonance:
    study:
      text: 两个人都举了手，老师想了想，一个管收，一个管发。作业本从你手里出去，从 TA 手里回来。
      memory: 一个收一个发
      bond: { sync: 2, close: 2 }
    sport:
      text: 一个喊「立正」，一个喊「稍息」。全班站得乱七八糟，你们俩站得最直。
      memory: 立正，稍息
      bond: { sync: 2, close: 2 }
    art:
      text: 起头的是你们俩，起的不是一个调。全班跟着唱成了两截，老师笑得直不起腰。
      memory: 起了两个调
      bond: { sync: 2, close: 2 }
    go:
      text: 两扇门是同时开的。两个新书包，一前一后下了楼，坐进了前后桌。
      memory: 两个新书包
      bond: { sync: 1, close: 2 }
  dissonance:
    text: 一个站在讲台边上，一个坐在底下。放学的时候，底下的那个等在门口，替讲台上的那个拿着书包。
    bond: { close: 1 }

# 三年级：放学以后的那两个钟头交给谁。选了哪个，哪个地方下午就多一件只有你们能做的事（content/map.yaml 的 club_*），
# 长得比自己练快；两个人进同一个，下午就能搭伴。只能进一个。
- id: m_club
  kind: milestone
  stage: childhood
  age: 9
  title: 三年级
  text: 少年宫的老师来学校挑人，体校的教练在操场边上站了一下午，数学老师在黑板上留了一道没人会的题。放学以后的那两个钟头，要交给一个地方了。
  options:
    - id: math
      text: 进数学小组
      score: { mind: 1 }
      min: 6.6
      tags: [competitive]
      effects: { flags: [club_math] }
    - id: sport
      text: 进体校的少年班
      score: { body: 1 }
      min: 6.4
      tags: [adventure]
      effects: { flags: [club_sport] }
    - id: art
      text: 进少年宫的曲艺队
      score: { charm: 1 }
      min: 6.0
      tags: [gentle]
      effects: { flags: [club_art] }
    - id: none
      text: 哪儿也不去，放了学就回家
      tags: [solitude]
      effects: { self: { mood: 5 } }
  resonance:
    math:
      text: 那道没人会的题，你们俩在一张草稿纸上算了三天。算出来那天，纸的正反面都写满了。
      memory: 写满正反面的草稿纸
      bond: { sync: 3, close: 2 }
    sport:
      text: 教练让新来的先跑十圈。跑到第七圈，谁也没先停。
      memory: 第七圈
      bond: { sync: 3, close: 2 }
    art:
      text: 一副快板拆成两半，一人一片。两片合起来才打得响。
      memory: 一人一片快板
      bond: { sync: 3, close: 2 }
    none:
      text: 三点半，校门口，你们俩是头一拨出来的。太阳还高，哪儿都来得及去。
      memory: 头一拨出校门
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 放了学，一个往操场走，一个往校门外走。走到一半都回了一下头。
    bond: { close: -2 }

# 家境的三种难度（docs/MEANS.md 第八节）：考场公平，同一张卷子同一条线；考场外不公平。
#   清贫：考进最高那档（年级前十、全区前五十）拿助学金（aid），往后放学那一段还给自己；中考多一条中专（包分配）；
#         高考考上了背助学贷款（loan，flagsIf），拿过助学金的不用背；没有复读（家里等着你挣钱）。
#   小康：爸妈攒的一笔钱（fam_nest）一辈子动一回：十五岁交择校费，或者十八岁复读一年。动了就摘掉（drop）。
#   殷实：expect 是爸妈心里那条线（exp_*）。走的路不在单子上，记一回脸色（strain1，有了的再记就是 fam_cut，家里不管了）；
#         homePays：走爸妈的意思，钱家里出，不是爸妈的意思就自己出。fam_cut 的人殷实那几条路全锁上（lockBy：家里已经不管你了）。
#   hide 的路标记不对的人看不见；lockBy 让断了供的人看见的是另一句（理由不是 lock 那句的不藏）。
- id: m_junior
  kind: milestone
  stage: teen
  age: 12
  score: { mind: 1 }
  swing: true
  requires: { notFlags: [dropout] }
  title: 小升初
  text: 分班的名单贴在校门口的红纸上。重点班在最上面一栏，放学比别的班晚一个半钟头。
  # 比重点班的线高一截的名次：起点高的人这一关也有得冲（goal 纸带上会摆出来）。最后一档是兜底，不写字
  grades:
    - { min: 9.8, label: 考进年级前三, flags: [junior_top, junior_top3] }
    - { min: 8.6, label: 考进年级前十, flags: [junior_top] }
    - { min: 0, label: "" }
  # 念书考出去的人家（exp_book）：没进重点班，记一回脸色
  expect:
    exp_book: [key]
  options:
    - id: key_aid
      text: 拿助学金，进重点班
      # 和「考进年级前三」同一条线：清贫人家考进最高那档，学校给助学金，放学那一段不用再帮家里
      min: 9.8
      requires: { flags: [fam_poor] }
      lock: 这是给困难人家的
      hide: true
      joins: key
      tags: [competitive]
      effects: { money: 8, flags: [junior_key, aid] }
    - id: key
      text: 去重点班
      min: 7.4
      tags: [competitive]
      effects: { flags: [junior_key] }
    - id: paid
      text: 家里交了钱，进重点班
      min: 6.9
      cost: 20
      # 念书考出去是爸妈的意思：钱家里出。别的人家交的是自己攒的
      homePays: [exp_book]
      requires: { flags: [fam_rich], notFlags: [fam_cut] }
      lock: 家里拿不出这笔钱
      lockBy: { fam_cut: 家里已经不管你了 }
      joins: key
      tags: [competitive]
      effects: { flags: [junior_key, junior_paid] }
    - id: normal
      text: 去普通班
      tags: [gentle]
      effects: { self: { mood: 4 } }
  resonance:
    key:
      text: 两个名字都在最上面那一栏，中间隔着三个人。放学晚了，可是一块儿晚。
      memory: 最上面那一栏
      bond: { sync: 2, close: 2 }
    normal:
      text: 三点半，校门口，还是你们俩。
      memory: 三点半的校门口
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 一个三点半放学，一个要上到五点。先出来的那个，在校门口的台阶上多坐了一会儿。
    bond: { close: -3 }

- id: m_senior
  kind: milestone
  stage: teen
  age: 15
  score: { mind: 1 }
  swing: true
  requires: { notFlags: [dropout] }
  title: 中考
  text: 志愿表发下来了。市里的重点高中在河对岸，天不亮就得过桥；家门口的高中走路十分钟；职专下午三点就放学。
  grades:
    - { min: 9.8, label: 考进全区前五十, flags: [senior_top] }
    - { min: 0, label: "" }
  # 念书、出国的人家要市重点；进单位、学琴的人家，上了高中就行
  expect:
    exp_book: [far]
    exp_abroad: [far]
    exp_pull: [far, near]
    exp_art: [far, near]
  options:
    - id: far_aid
      text: 拿助学金，过桥上重点
      # 和「考进全区前五十」同一条线
      min: 9.8
      requires: { flags: [fam_poor] }
      lock: 这是给困难人家的
      hide: true
      joins: far
      tags: [competitive]
      effects: { money: 12, bond: { distance: 1 }, flags: [school_far, aid] }
    - id: far
      text: 过桥去念重点高中
      min: 8.7
      tags: [competitive]
      effects: { bond: { distance: 1 }, flags: [school_far] }
    - id: paid
      text: 交择校费，过桥上重点
      min: 7.8
      cost: 35
      homePays: [exp_book, exp_abroad]
      requires: { flags: [fam_rich], notFlags: [fam_cut] }
      lock: 家里拿不出择校费
      lockBy: { fam_cut: 家里已经不管你了 }
      joins: far
      tags: [competitive]
      effects: { bond: { distance: 1 }, flags: [school_far, school_paid] }
    - id: nest
      text: 动了爸妈攒的钱，上重点
      # 小康人家的那笔钱（fam_nest）：线和殷实人家交择校费一样，可一辈子只有这一回，用了十八岁就不能拿它复读
      min: 8.3
      requires: { flags: [fam_nest] }
      lock: 家里没攒下这笔钱
      hide: true
      joins: far
      tags: [competitive]
      effects: { bond: { distance: 1 }, drop: [fam_nest], flags: [school_far, school_paid, nest_used] }
    - id: zhongzhuan
      text: 考中专，三年后包分配
      # 清贫人家的一条稳路：线比市重点低一点，三年后直接分配进厂（打 job_succeed，二十二岁起是厂里那条路），不考大学，天花板低
      min: 8.2
      requires: { flags: [fam_poor] }
      lock: 这是给困难人家的
      hide: true
      tags: [responsible]
      effects: { flags: [zhongzhuan, job_succeed] }
    - id: near
      text: 念家门口的高中
      min: 5.8
      tags: [gentle]
      effects: { flags: [school_near] }
    - id: vocational
      text: 念职专，早点学本事
      tags: [responsible]
      effects: { flags: [vocational] }
  resonance:
    far:
      text: 天不亮，桥上只有两辆自行车。风大，谁也没说话，蹬得一样快。
      memory: 桥上两辆车
      bond: { sync: 3, close: 2 }
    zhongzhuan:
      text: 两张录取通知书上印着同一个厂徽。你们对着看了半天，说三年后在厂门口见。
      memory: 同一个厂徽
      bond: { sync: 2, close: 2 }
    near:
      text: 还是那条路，还是十分钟。校服换了个颜色，别的没换。
      memory: 还是那条路
      bond: { sync: 2, close: 2 }
    vocational:
      text: 三点钟放学，太阳还高。你们推着车往回走，说以后合伙开个铺子。
      memory: 三点钟的太阳
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 一个往桥那边去，一个往胡同里拐。早上出门的钟点不一样了，楼道里碰不上了。
    bond: { close: -3 }

- id: m_gaokao
  kind: milestone
  stage: young
  age: 18
  score: { mind: 1 }
  swing: true
  requires: { notFlags: [dropout, vocational, zhongzhuan] }
  title: 高考
  text: 分数出来了，志愿表摊在饭桌上。最远的那所学校，坐火车要一天一夜。
  grades:
    - { min: 9.3, label: 考进全市前一百, flags: [gaokao_good, gaokao_top] }
    - { min: 6.8, label: 过了本科线, flags: [gaokao_good] }
    - { min: 0, label: 没过线, flags: [gaokao_bad] }
  # 出国的人家要出国；别的殷实人家考上大学就行，复读一年也认
  expect:
    exp_book: [away, local, abroad, retake]
    exp_abroad: [abroad, retake]
    exp_pull: [away, local, abroad, retake]
    exp_art: [away, local, abroad, retake]
  options:
    - id: away
      text: 去外地念大学
      min: 8.4
      tags: [adventure, competitive]
      # 清贫人家没拿过助学金的，背一笔助学贷款（loan：往后的工钱打折，rules.yaml）
      effects: { bond: { distance: 2 }, flags: [uni_away], flagsIf: [{ flags: [fam_poor], notFlags: [aid], add: [loan] }] }
    - id: abroad
      text: 家里送你出国念书
      # 比考外地（8.4）低半分多，留给差一口气的人。6.3 的时候等于花钱买了最好的那所大学（玩法评审）
      min: 7.8
      cost: 60
      homePays: [exp_abroad]
      requires: { flags: [fam_rich], notFlags: [fam_cut] }
      lock: 家里供不起
      lockBy: { fam_cut: 家里已经不管你了 }
      tags: [adventure]
      effects: { bond: { distance: 3 }, flags: [uni_abroad] }
    - id: local
      text: 念本市的大学
      min: 6.8
      tags: [gentle]
      effects: { flags: [uni_near], flagsIf: [{ flags: [fam_poor], notFlags: [aid], add: [loan] }] }
    - id: army
      text: 报名去当兵
      score: { body: 1 }
      min: 5.8
      requires: { notFlags: [fam_rich] }
      lock: 家里舍不得
      tags: [responsible, adventure]
      effects: { bond: { distance: 2 }, flags: [army] }
    - id: retake
      text: 复读一年，明年再考
      # 复读班的学费从自己的积蓄出；殷实人家家里出（断了供的自己出），小康可以动爸妈攒的那笔（retake_nest）
      cost: 20
      homePays: [fam_rich]
      requires: { notFlags: [fam_poor] }
      lock: 家里等着你挣钱
      tags: [patient, competitive]
      effects: { self: { mood: -6 }, flags: [retake] }
    - id: retake_nest
      text: 动了爸妈攒的钱，复读一年
      requires: { flags: [fam_nest] }
      lock: 家里没攒下这笔钱
      hide: true
      joins: retake
      tags: [patient, competitive]
      effects: { self: { mood: -6 }, drop: [fam_nest], flags: [retake, nest_used] }
    - id: work
      text: 不念了，找活干
      tags: [responsible]
      effects: { flags: [work_early] }
  resonance:
    away:
      text: 两张火车票，两个方向。你们在站台上对了对表，说好寒假同一天回来。
      memory: 对过的表
      bond: { sync: 3, close: 1 }
    local:
      text: 两所学校隔着四站地。周末回河畔里，还是从同一个楼门进去。
      memory: 四站地
      bond: { sync: 2, close: 2 }
    abroad:
      text: 两个人坐同一班飞机走的。落地以后，一个往东，一个往西，隔着一个时区写信。
      memory: 同一班飞机
      bond: { sync: 3, close: 1 }
    army:
      text: 胸口戴着同一种红花，坐上同一趟车。车开了，楼里的人还站在路口。
      memory: 同一种红花
      bond: { sync: 3, close: 2 }
    retake:
      text: 复读班的最后一排，两张桌子拼在一块儿。又是一摞卷子，这回是两个人一起写。
      memory: 拼起来的桌子
      bond: { sync: 3, close: 2 }
    work:
      text: 第一个月的工钱，你们一人买了一双新鞋，在楼下比了比谁的贵。
      memory: 两双新鞋
      bond: { sync: 2, close: 2 }
  dissonance:
    text: 一个去车站，一个去上工。同一个早上出的门，往两头走的。
    bond: { close: -3 }

# 十九岁：再考一回（复读了的人，m_gaokao 的 retake）。路和高考一样，不能再复读。
# 少年以后一年一个日子：复读的那一年就是十八岁那天考完剩下的时间（tracks.yaml 的 retake_class），十九岁早上就考
- id: m_retake
  kind: milestone
  stage: young
  age: 19
  score: { mind: 1 }
  swing: true
  requires: { flags: [retake] }
  title: 再考一回
  text: 又是这张志愿表。复读这一年的卷子摞起来，快跟桌子一样高了。
  grades:
    - { min: 9.3, label: 考进全市前一百, flags: [gaokao_good, gaokao_top] }
    - { min: 6.8, label: 过了本科线, flags: [gaokao_good] }
    - { min: 0, label: 没过线, flags: [gaokao_bad] }
  expect:
    exp_book: [away, local, abroad]
    exp_abroad: [abroad]
    exp_pull: [away, local, abroad]
    exp_art: [away, local, abroad]
  options:
    - id: away
      text: 去外地念大学
      min: 8.4
      tags: [adventure, competitive]
      effects: { bond: { distance: 2 }, flags: [uni_away], flagsIf: [{ flags: [fam_poor], notFlags: [aid], add: [loan] }] }
    - id: abroad
      text: 家里送你出国念书
      min: 7.8
      cost: 60
      homePays: [exp_abroad]
      requires: { flags: [fam_rich], notFlags: [fam_cut] }
