  kind: mirror
  stage: childhood
  where: hallway
  when: [390, 600]
  seasons: [summer]
  hint: 楼道里堆着两兜子东西。
  weight: 3
  requires: { minAge: 6, maxAge: 8, either: { notFlags: [fam_rich, fam_poor] } }
