# 主线：七章，每章三件一定会发生的事，一道关收尾。
# 主线就是两个人加一栋楼：从三岁敲开对门，到老了在河边挖出那个铁皮盒子。
#
# 和 content/events/ 里随机的事不同：
#   chapter / beat   第几章、章里第几件。前一件没发生，后一件不出
#   scene / slot     在哪张图、哪一段（morning 6:30–8 / am 8–12 / pm 12–15:30 / evening 15:30–18:30 / night 18:30–22）。
#                    mirror 要两个人这一段都在这张图上；solo 只看当事人。没去会等着，等到章里最后一个日子一早强制发生
#   next             纸带上「下一件事」那一句，15 字以内
#   replaces         这件事顶替了随机池里的哪些旧事件（引擎接上主线后把它们从随机池摘掉；旧 id 不删，存档和传承还引用着）
#   不写 stage（按章推）、weight、when、hint、seasons（强制发生时可能不在那个季节）
#
# 同一章同一件可以有好几个变体，按文件里的顺序，谁先满足 requires 就是谁。
#   mirror 的 requires 看的是两个人标记的并集（和随机事件一样）；solo 只看自己。
#   requires.alone: true 是对门已经不在了的那个人的变体，第五章往后每件都要有一个。
#
# 出身和路线：选项上可以写 requires（只看选的那个人自己的 flags / notFlags）和 cost（花积蓄），语义同关口选项。
#   殷实人家（fam_rich）的孩子在几件事上多一个选项，清贫人家（fam_poor）的孩子有自己的一个，小康的两样都没有。
#   每件事至少两个谁都能选的选项（build-content 校验）。两个人只有选了同一个选项才共鸣，所以带门槛的选项多半没有共鸣，
#   这是故意的：家底不一样的两个人，在这些地方本来就走不到一块儿。
#   主线事件只读路线标记（uni_away、home_own……），不发。路线标记由关口发。
#
# 主线发的共同标记：p_knock（三岁隔着门敲了三下）、p_promise（楼顶拉钩）、p_wall_names（刻名字）、
#   p_capsule（埋盒子）、p_note（课本里的纸条）、p_bridge（自己过过桥，选什么都打上；河对岸那张图读它）。前后几章和传承读它们。
#
# 文风守 docs/tianjin_style.md：正文上限 童年 60 / 少年 55 / 青年 50 / 中年 45 / 老年 30 字（主线比随机事件再收一点），
#   选项 15、共鸣 48、错位 47、memory 8、title 7。mirror 里两个人读同一段字，不写「你爸」「你家」，不写谁比谁怎样。

chapters:
  - id: door
    title: 对门
    ages: [3, 5]
    opens: [building, street]
    intro: 三楼两扇门，门对着门。
    closes: [m_school]
  - id: class
    title: 一个班
    ages: [6, 11]
    opens: [primary, river]
    intro: 从楼门口到校门口，一走六年。
    closes: [m_club, m_junior]
  - id: bridge
    title: 过桥
    ages: [12, 17]
    opens: [middle, across]
    intro: 楼顶上看了好些年的灯，在桥那边。
    closes: [m_senior, m_gaokao]
  - id: apart
    title: 远近
    ages: [18, 29]
    opens: [away]
    intro: 有人走，有人留，信要走两天。
    closes: [m_job, m_settle]
  - id: home
    title: 安家
    ages: [30, 44]
    opens: [newhome, rental]
    intro: 各有各的家了，老楼还在。
    closes: [m_midlife]
  - id: half
    title: 半辈子
    ages: [45, 59]
    opens: [hospital]
    intro: 楼没了，日子照旧早起。
    closes: [m_retire]
  - id: river
    title: 河边
    ages: [60, 200]
    opens: [park]
    intro: 河还是那条河。
    closes: [m_evening]

events:
  # ======================= 第一章 · 对门（3–5） =======================

  - id: s1_door
    kind: mirror
    chapter: 1
    beat: 1
    scene: building
    slot: am
    next: 上午，楼道里
    title: 对门
    text: 楼道里两扇门对着开。大人在门口说话，门缝后头有个跟你一般高的人，也在往外看。
    options:
      - id: knock
        text: 过去敲三下门
        tags: [adventure]
        effects: { self: { mood: 5 } }
      - id: hide
        text: 躲到大人腿后头
        tags: [solitude]
        effects: { self: { mood: 2 } }
      - id: candy
        text: 递过去一块糖
        tags: [gentle]
        effects: { self: { mood: 3 } }
      - id: frog
        text: 拿出上弦的铁皮青蛙
        requires: { flags: [fam_rich] }
        tags: [adventure]
        effects: { self: { mood: 5, charm: 1 } }
    resonance:
      knock:
        text: 你敲了三下，门里头也敲了三下。大人把门打开的时候，你俩还隔着门板在敲。
        memory: 敲了三下
        bond: { sync: 3, close: 3 }
        flags: [p_knock]
      hide:
        text: 两个人都躲在大人腿后头，只露半个脑袋。大人聊了半个钟头，你俩对看了半个钟头。
        memory: 半个脑袋
        bond: { sync: 2, close: 2 }
      candy:
        text: 两块糖在门槛上碰了头，一块水果糖，一块奶糖。后来谁吃的哪块，谁也说不清了。
        memory: 两块糖
        bond: { sync: 3, close: 2 }
    dissonance:
      text: 一个在门这边敲，一个在门那边躲。门开了一条缝，又让过堂风带上了。
      bond: { close: 0 }

  - id: s1_breakfast
    kind: mirror
    chapter: 1
    beat: 2
    scene: street
    slot: morning
    next: 早上，楼下早点铺
    requires: { minAge: 4 }
    title: 一套煎饼
    text: 头一回让你俩自己下楼买早点。早点铺门口排着队，一个攥着钱，一个攥着从家里带的鸡蛋，手心都出了汗。
    options:
      - id: line
        text: 规规矩矩排到头
        tags: [patient]
        effects: { self: { mood: 3 } }
      - id: egg
        text: 把手里的举过头顶
        tags: [gentle]
        effects: { self: { mood: 4 } }
      - id: squeeze
        text: 从大人腿缝里往前钻
        tags: [adventure]
        effects: { self: { mood: 5, body: 1 } }
      - id: extra
        text: 多买一套带上楼
        requires: { flags: [fam_rich] }
        cost: 1
        tags: [gentle]
        effects: { self: { mood: 3 }, other: { mood: 3 } }
      - id: half
        text: 一套掰成两半
        requires: { flags: [fam_poor] }
        tags: [responsible]
        effects: { self: { mood: 3 }, other: { hunger: 10 } }
    resonance:
      line:
        text: 排到了，老板娘接过鸡蛋，在鏊子边上一磕。她没问夹什么，也没问是谁家的。
        memory: 鏊子边上一磕
        bond: { sync: 2, close: 2 }
      egg:
        text: 钱和鸡蛋一块儿举过了头顶。老板娘先接的鸡蛋，在鏊子边上磕了。
        memory: 举过头顶
        bond: { sync: 3, close: 2 }
      squeeze:
        text: 两个人一块儿钻到了最前头，让老板娘一手一个拎回了队尾。后头的人笑，你俩也笑。
        memory: 拎回队尾
        bond: { sync: 3, close: 2 }
    dissonance:
      text: 一个老老实实排在队尾，一个已经钻到了前头。那套煎饼，最后是两个人分着吃的。
      bond: { close: 0 }

  - id: s1_roof
    kind: mirror
    chapter: 1
    beat: 3
    scene: building
    slot: evening   # 原来是晚上：五岁的孩子晚上那一段总在睡，回回是被叫醒的。收床单本来就是天快黑时候的事
    next: 傍晚，楼顶
    replaces: [c_promise]
    title: 对岸的灯
    text: 天快黑的时候，大人上楼顶收床单，你俩趴在栏杆上。河对岸的灯一片一片亮起来，比这边多，也比这边高。
    options:
      - id: hook
        text: 伸出小拇指
        tags: [gentle]
        effects: { self: { mood: 5 } }
      - id: count
        text: 一盏一盏数
        tags: [patient]
        effects: { self: { mind: 1 } }
      - id: point
        text: 指着最高的那盏
        tags: [adventure]
        effects: { self: { mood: 3 } }
    resonance:
      hook:
        text: 「长大了去那边住，还住对门。」两根小拇指勾在栏杆上，勾了好半天，谁也不先松。
        memory: 勾在栏杆上
        bond: { sync: 3, close: 3 }
        flags: [p_promise]
      count:
        text: 数到一百多，对岸又亮了一片，只好从头数。收完床单下楼，你俩已经数了三回。
        memory: 从头数
        bond: { sync: 3, close: 2 }
      point:
        text: 两根手指指着同一盏，都说那是最高的。其实是对岸楼顶上的红灯，一闪一闪。
        memory: 一闪一闪
        bond: { sync: 2, close: 2 }
    dissonance:
      text: 那根小拇指在栏杆上伸了半天，旁边的人还在数灯。大人喊下楼了，才揣回兜里。
      bond: { close: 0 }

  # ======================= 第二章 · 一个班（6–11） =======================

  - id: s2_road
    kind: mirror
    chapter: 2
    beat: 1
    scene: street
    slot: morning
    next: 早上，楼门口
    requires: { minAge: 6 }
    title: 上学的路
    text: 开学头一天，两家大人都说不送了。从楼门口到校门口，要过两个路口、一个早点铺、一个修车铺。
    options:
      - id: hand
        text: 拉着手过马路
        tags: [gentle]
        effects: { self: { mood: 4 } }
      - id: race
        text: 比谁先到校门口
        tags: [competitive]
        effects: { self: { body: 1 } }
      - id: dawdle
        text: 在修车铺门口蹲一会儿
        tags: [patient]
        effects: { self: { mind: 1 } }
      - id: car
        text: 坐家里的车过去
        requires: { flags: [fam_rich] }
        tags: [solitude]
        effects: { self: { energy: 10 } }
      - id: key
        text: 把钥匙塞进领口
        requires: { flags: [fam_poor] }
        tags: [responsible]
        effects: { self: { mind: 1 } }
    resonance:
      hand:
        text: 过头一个路口还拉着手，过第二个就松开了，一前一后跑。传达室的大爷看了你俩一眼，记住了。
        memory: 两个路口
        bond: { sync: 3, close: 3 }
      race:
        text: 两个人同时撞上校门的铁栏杆，书包里的铅笔盒响成一片。大爷说：「慢点儿，门跑不了。」
        memory: 一块儿撞上
        bond: { sync: 3, close: 2 }
      dawdle:
        text: 修车爷爷补完一个胎，抬头看见两个小人儿蹲着：「还不走？要打铃了。」你俩跑着去的。
        memory: 补完一个胎
        bond: { sync: 2, close: 2 }
      car:
        text: 两辆车在校门口一前一后停下，车门同时开了。两个人隔着车门，对着笑了一下。
        memory: 两扇车门
        bond: { sync: 2, close: 1 }
    dissonance:
      text: 校门口先到了一个，回头看来的路。另一个也在路上，只是慢了一个路口。
      bond: { close: 0 }

  - id: s2_names
    kind: mirror
    chapter: 2
    beat: 2
    scene: building
    slot: evening
    next: 傍晚，三楼楼道
    requires: { minAge: 7 }
    replaces: [c_wall_names]
    title: 墙上的名字
    text: 暖气片上头那块墙，一层一层全是早先的孩子划的道道。楼道里堆着自行车。你俩兜里各有一根钉子。
    options:
      - id: carve
        text: 刻两个人的名字
        tags: [adventure]
        effects: { self: { mood: 5 } }
      - id: height
        text: 靠着墙量个子
        tags: [patient]
        effects: { self: { mood: 3, body: 1 } }
      - id: hand_in
        text: 把钉子交给楼长
        tags: [responsible]
        effects: { self: { mind: 1 } }
    resonance:
      carve:
        text: 你刻一个，对门的刻一个，当中空着一个字的地方，谁也没想好刻什么。踮着脚，刻得很矮。
        memory: 空着一个字
        bond: { sync: 4, close: 3 }
        flags: [p_wall_names]
      height:
        text: 两个人背靠着墙，一个给另一个划道。两道印子一般高，谁也不信，又量了一回。
        memory: 一般高
        bond: { sync: 3, close: 2 }
      hand_in:
        text: 两根钉子交到楼长手里。楼长看看墙，说他小时候也在这儿刻过，现在找不着了。
        memory: 找不着的那道
        bond: { sync: 2, close: 2 }
    dissonance:
      text: 一个名字刻完了，钉子递过去，没人接。那块墙皮后来让白菜蹭得更黑了。
      bond: { close: 0 }

  - id: s2_capsule
    kind: mirror
    chapter: 2
    beat: 3
    scene: river
    slot: evening
    next: 傍晚，河边柳树底下
    requires: { minAge: 8 }
    replaces: [c_capsule]
    title: 铁皮盒子
    text: 河边第三棵柳树底下，你俩挖了个坑。盒子是装过饼干的，铁皮的，盖上印着外国字。说好了，老了再来挖。
    options:
      - id: letter
        text: 写封信给老了的自己
        tags: [patient]
        effects: { self: { mind: 1 } }
      - id: marble
        text: 放进最好的那颗弹球
        tags: [gentle]
        effects: { self: { mood: 5 } }
      - id: keep
        text: 舍不得，抱回家
        tags: [solitude]
        effects: { self: { mood: 2 } }
      - id: watch
        text: 放进一块电子表
        requires: { flags: [fam_rich] }
        tags: [adventure]
        effects: { self: { mood: 4 } }
      - id: coins
        text: 放进攒下的五毛钱
        requires: { flags: [fam_poor] }
        tags: [responsible]
        effects: { self: { mood: 4 } }
    resonance:
      letter:
        text: 两封信都折成了小方块，谁也没看谁的。土拍实了，你俩在柳树皮上划了一道。
        memory: 树皮上一道
        bond: { sync: 3, close: 3 }
        flags: [p_capsule]
      marble:
        text: 盒子里放进了一颗玻璃弹球。不对，是两颗。你俩把最好的那颗都拿出来了。
        memory: 两颗弹球
        bond: { sync: 3, close: 3 }
        flags: [p_capsule]
      keep:
        text: 两个人抱着空盒子蹲了半天，又一路抱回了楼里，塞到床底下，后来就忘了。
        memory: 空着的盒子
        bond: { sync: 2, close: 1 }
      watch:
        text: 两块电子表放进去，都还走着。土埋上了，你俩趴下去听，好像还能听见。
        memory: 走着的表
        bond: { sync: 3, close: 2 }
        flags: [p_capsule]
      coins:
        text: 两张五毛的票子叠在一块儿放进去。盖上盖子，比放什么都踏实。
        memory: 两张五毛
        bond: { sync: 3, close: 3 }
        flags: [p_capsule]
    dissonance:
      text: 盒子还是埋下去了，里头一样东西多，一样东西少。谁也没问。
      bond: { close: 0 }
      flags: [p_capsule]

  # ======================= 第三章 · 过桥（12–17） =======================

  - id: s3_bridge
    kind: mirror
    chapter: 3
    beat: 1
    scene: across
    slot: night
    next: 晚上，过桥去对岸
    requires: { minAge: 12 }
    title: 过桥
    text: 头一回不跟大人，自己过桥去了对岸。小时候在楼顶上看的那片灯，走近了是一栋一栋的楼，没有一扇窗户是认识的。
    options:
      - id: look_back
        text: 站在桥当中往回看
        tags: [gentle]
        effects: { self: { mood: 5 } }
      - id: walk
        text: 走回去，不坐车
        tags: [patient]
        effects: { self: { body: 1 } }
      - id: mall
        text: 进商场转一圈
        tags: [adventure]
        effects: { self: { mood: 3, charm: 1 } }
      - id: taxi
        text: 打个车回去
        requires: { flags: [fam_rich] }
        cost: 2
        tags: [solitude]
        effects: { self: { energy: 10 } }
      - id: soda
        text: 省下车钱买两瓶汽水
        requires: { flags: [fam_poor] }
        tags: [gentle]
        effects: { self: { body: 1 }, other: { mood: 5 } }
    resonance:
      look_back:
        text: 从桥当中往回看，河这边黑了一片，只有三楼两扇窗户还亮着。不知道是谁家大人在等。
        memory: 亮着的两扇窗
        bond: { sync: 3, close: 3 }
        flags: [p_bridge]
      walk:
        text: 两个人一路走回了河畔里，到楼门口腿都直了。谁也没说累，第二天谁也没起来。
        memory: 走回来的桥
        bond: { sync: 3, close: 2 }
        flags: [p_bridge]
      mall:
        text: 商场里一样东西也没买，你俩把每一层的电梯都坐了一遍，下来的时候笑岔了气。
        memory: 每一层电梯
        bond: { sync: 3, close: 2 }
        flags: [p_bridge]
    dissonance:
      text: 一个站在桥当中往回看，一个已经到了桥那头，回头喊了一声。风大，没听见。
      bond: { close: 0 }
      flags: [p_bridge]

  - id: s3_note
    kind: mirror
    chapter: 3
    beat: 2
    scene: building
    slot: night
    next: 晚上，楼里
    title: 一张纸条
    text: 你俩换着借的课本，同一天还了回来。翻到当中，都夹着一张纸条，折了四折，压得平平的。
    options:
      - id: read
        text: 在被窝里打开看
        tags: [adventure]
        effects: { self: { mood: 5 } }
      - id: reply
        text: 写一句，夹回去
        tags: [gentle]
        effects: { self: { mood: 3, charm: 1 } }
      - id: keep
        text: 不拆，夹进日记本
        tags: [patient]
        effects: { self: { mind: 1 } }
    resonance:
      read:
        text: 两张纸条上写的都是数学题的答案，最底下都还有一行小字。手电筒关了又开，开了又关。
        memory: 最底下一行
        bond: { sync: 3, close: 3 }
        flags: [p_note]
      reply:
        text: 第二天课本又换了回来。纸条上多了一行，字比上一行还小。
        memory: 多了一行
        bond: { sync: 3, close: 3 }
        flags: [p_note]
      keep:
        text: 两张纸条都没拆，夹在两个本子里。一个在三楼东屋，一个在三楼西屋。
        memory: 没拆的纸条
        bond: { sync: 3, close: 2 }
        flags: [p_note]
    dissonance:
      text: 一张纸条拆开看了，一张原样夹着，后来跟着旧课本一块儿卖了废品。
      bond: { close: 0 }

  - id: s3_eve
    kind: mirror
    chapter: 3
    beat: 3
    scene: building
    slot: night
    next: 晚上，三楼楼道
    title: 前一晚
    text: 明天大考。楼道的灯坏了一盏，两扇门里都亮着台灯，门缝底下漏出两条光，在楼道当中差一点挨上。
    options:
      - id: knock
        text: 隔着门敲三下
        tags: [gentle]
        effects: { self: { mood: 5 } }
      - id: drill
        text: 再做一套卷子
        tags: [competitive]
        effects: { self: { mind: 1, energy: -10 } }
      - id: sleep
        text: 早点关灯睡觉
        tags: [patient]
        effects: { self: { energy: 15 } }
      - id: chores
