  resonance:
    pair:
      text: 一筐白菜两个人抬，下巴上都沾着菜叶。抬到最后分不清哪筐是哪家的，码成了一垛。
      memory: 一垛白菜
      bond: { sync: 3, close: 3 }
    three:
      text: 都抱三棵，在二楼拐角撞了个满怀。六棵白菜滚下楼，一棵没糟践，全让楼长捡走了：充公。
      memory: 滚下楼的白菜
      bond: { sync: 3, close: 2 }
    stack:
      text: 两家的白菜码成了一堵墙，齐得像砖。楼长背着手看了半天：「这手艺，留着盖房。」
      memory: 白菜墙
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个在楼下抱，一个在楼上码，一下午没照面。天黑数分，两家大人各说各的孩子搬得多。
    bond: { close: -1 }

- id: j_fry
