# 街坊篇（j_ 前缀，跨所有人生阶段）+ 四户新人家的专属线（f_ 前缀）
#
# 这一篇写楼里楼外的街坊，和一年四季的日子。
# 河畔里在天津，但天津只是底色：让它待在物件、吃食和街坊的做派里，不靠方言词和民俗名目撑场面。
# 写的时候守这几条：
#
#   1. 短句，白描，先说物件后说人。不抒情，停在一个动作或一样东西上。
#   2. 叙述用普通话，方言词能不用就不用。没到过天津的人读着不隔，才算写对了。
#   3. 街坊各有一样本事，守一条规矩。写他的手，别写他的心。
#   4. 苦事儿往轻里说。共鸣把「底」留到最后；错位不怪谁，让旁人或物件托一句。
#   5. 不写年份，不点真实的店铺、品牌和真人（见 docs/GDD.md 第 2 节）。
#   6. mirror 的文字两个人看到的是同一段，不写「你家」「你爸」，写「白家伯伯」「佟家伯伯」。
#   7. 字数：hint 15 / title 7 / text 60 / 选项 15 / 共鸣 48 / memory 8 / 错位 47。越老话越少。

# ===================== 童年 · 默契 =====================

- id: j_ear
  kind: mirror
  stage: childhood
  where: bikeshop
  when: [900, 1140]
  hint: 车铺门口有人在打赌。
  weight: 2
  requires: { minAge: 5 }
  title: 耳朵
  text: 修车的爷爷修车不大抬头。车从街口一拐，他就说：「中轴缺珠子。」今天有人不信，推来一辆让他听。
  options:
    - id: yes
      text: 押爷爷听得出来
      tags: [gentle]
      effects: { self: { mood: 5 } }
    - id: no
      text: 押他这回听不出来
      tags: [competitive]
      effects: { self: { mood: 3 } }
    - id: listen
      text: 闭上眼，自己也听听
      tags: [patient]
      effects: { self: { mind: 1 } }
  resonance:
    yes:
      text: 爷爷头也不抬：「车没毛病。是车筐里那瓶醋，盖儿没拧紧。」那人一低头，裤腿都湿了。
      memory: 没拧紧的醋
      bond: { sync: 3, close: 3 }
    no:
      text: 爷爷听完不说话，油手一伸：「一人欠我一趟酱油。」那天你们拎着瓶子，跑了两趟副食店。
      memory: 两趟酱油
      bond: { sync: 3, close: 2 }
    listen:
      text: 你们闭着眼听了半天，同时喊：「是车铃！」爷爷乐了：「铃好好的。是你俩的肚子。」
      memory: 肚子叫唤
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个押能，一个押不能。爷爷就说了三个字：「没毛病。」车是好的，那人是专门来找乐子的。
    bond: { close: 0 }

- id: j_popcorn
  kind: mirror
  stage: childhood
  where: alley
  when: [900, 1140]
  hint: 楼下有个黑铁葫芦在火上转。
  seasons: [autumn, winter]
  weight: 2
  title: 响喽
  text: 崩爆米花的来了。孩子们端着茶缸子排队，一缸棒子粒，一撮糖精。老头儿不看表，嘴里数数。数到头，脚一蹬：「响——喽——」
  options:
    - id: cover
      text: 赶紧捂住自己的耳朵
      tags: [patient]
      effects: { self: { mood: 3 } }
    - id: other
      text: 伸手去捂对门的耳朵
      tags: [gentle]
      effects: { self: { mood: 3 }, other: { mood: 5 } }
    - id: brave
      text: 不捂，瞪着眼等
      tags: [adventure]
      effects: { self: { mood: 8 } }
  resonance:
    other:
      text: 都去捂对方的耳朵，自己的全晾着。「砰！」耳朵嗡了一下午，说话全靠喊，大人以为你们吵架了。
      memory: 嗡了一下午
      bond: { sync: 4, close: 3 }
    brave:
      text: 「砰！」白烟腾起来，你们俩谁也没眨眼。其实腿都软了，谁也不说。
      memory: 谁也没眨眼
      bond: { sync: 3, close: 2 }
    cover:
      text: 捂得太早，胳膊都酸了它还不响。你们对了个眼神，刚一松手——「砰！」
      memory: 刚一松手
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个捂着耳朵蹲下了，一个伸出去的手捂了个空。爆米花倒没耽误：一麻袋，甜的。
    bond: { close: -1 }

- id: j_dough_figure
  kind: mirror
  stage: childhood
  where: school
  when: [930, 1080]
  hint: 校门口围了一圈小脑袋。
  seasons: [autumn]
  weight: 2
  requires: { minAge: 6 }
  title: 面人
  text: 校门口来了个捏面人的。一块面在他手指头里转两转，鼻子眼儿就齐了。五毛一个。你们俩的钱凑一块儿，正好五毛。
  options:
    - id: monkey
      text: 要个孙猴
      tags: [adventure]
      effects: { self: { mood: 5 } }
    - id: us
      text: 「能捏我们俩吗？」
      tags: [gentle]
      effects: { self: { mood: 5 } }
    - id: watch
      text: 不买，看他捏就够了
      tags: [patient]
      effects: { self: { mind: 1 } }
  resonance:
    us:
      text: 老头儿瞅瞅你们，搓了两搓：两个小人儿，一个缺门牙，一个翘头发，脚底下连着面。「掰开就都坏了。」
      memory: 连着的面人
      bond: { sync: 4, close: 4 }
    monkey:
      text: 孙猴一人拿一天。第九天，金箍棒掉了；第二十天，裂了一道缝。谁也不认是在自己手里裂的。
      memory: 一人一天的孙猴
      bond: { sync: 3, close: 2 }
    watch:
      text: 你们蹲到天擦黑。老头儿收摊，把一块红面掰成两半：「回家自己捏去。」
      memory: 一块红面
      bond: { sync: 3, close: 2 }
  dissonance:
    text: 一个要孙猴，一个要捏人。老头儿把面团一撂：「商量好了再来。」第二天，他没来。
    bond: { close: -1 }

- id: j_dragonfly
  kind: mirror
  stage: childhood
  where: river
  when: [1080, 1260]
  hint: 河边有人举着线抡圈儿。
  seasons: [summer]
  weight: 2
  requires: { minAge: 6 }
  title: 蜻蜓
  text: 太阳一落，河边的蜻蜓压得很低。大孩子拿线拴住一只抡圈儿，天上的大个儿就往下扑。他们匀给你们一只。
  options:
    - id: spin
      text: 「我来抡！」
      tags: [adventure]
      effects: { self: { mood: 8, energy: -5 } }
    - id: net
      text: 举着网兜，等着扣
      tags: [patient]
      effects: { self: { mood: 3 } }
    - id: free
      text: 把拴着的这只放了
      tags: [gentle]
      effects: { self: { mood: 3 } }
  resonance:
    spin:
      text: 两只手抢一个线头，抡出来的圈是扁的。大个儿的没招来，线缠了两人一脑袋。
      memory: 扁的圈
      bond: { sync: 3, close: 3 }
    net:
      text: 都举着网兜等，没人抡线。天黑才发现，拴着的那只早挣断线飞了。
      memory: 没人抡线
      bond: { sync: 3, close: 2 }
    free:
      text: 它没马上走，在你们手指头上趴了一会儿。大孩子说你们是「善人」，这在他们嘴里不算好话。
      memory: 手指头上的蜻蜓
      bond: { sync: 3, close: 3 }
  dissonance:
    text: 一个抡，一个扣，头一网就扣着只大个儿的。回家路上才想起来：咱俩想的明明不是一回事。
    bond: { sync: 1, close: 1 }

- id: j_haircut
